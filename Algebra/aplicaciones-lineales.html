<style>

  .trail button{ flex:0 0 auto; background:var(--panel); border:1px solid var(--line); color:var(--muted); font-family:var(--font-mono); font-size:11.5px; padding:7px 11px; border-radius:999px; cursor:pointer; white-space:nowrap; transition:border-color .15s,color .15s,background .15s; }

  .shape-chip{ font-family:var(--font-mono); font-size:13px; background:var(--panel-2); border:1px solid var(--line); padding:9px 14px; border-radius:10px; color:var(--text); }
  .shape-chip b{ color:var(--viu); font-weight:600; }
  #stage{ display:flex; flex-direction:column; align-items:center; gap:16px; padding:6px 2px; }

  footer{ flex:0 0 auto; display:flex; justify-content:center; gap:14px; flex-wrap:wrap; padding:4px clamp(16px,4vw,40px) calc(18px + env(safe-area-inset-bottom,0px)); }
  .nav-btn{ font-family:var(--font-body); font-weight:500; font-size:14.5px; background:var(--panel); border:1px solid var(--line); color:var(--text); padding:11px 22px; border-radius:10px; cursor:pointer; transition:border-color .15s,transform .1s; }
  .nav-btn:hover{ border-color:var(--viu); } .nav-btn:active{ transform:scale(.97); }
  .nav-btn:disabled{ opacity:.35; cursor:default; } .nav-btn:disabled:hover{ border-color:var(--line); }

  .viz-row{ display:flex; align-items:flex-start; justify-content:center; gap:clamp(18px,3vw,36px); flex-wrap:wrap; width:100%; }
  .viz-col{ display:flex; flex-direction:column; align-items:center; gap:10px; flex:1 1 280px; min-width:0; }
  .viz-label{ font-family:var(--font-mono); font-size:12px; color:var(--muted); text-align:center; line-height:1.4; }
  .viz-label b{ color:var(--text); font-weight:600; }

  .formula{ font-family:var(--font-mono); font-size:13.5px; background:var(--panel-2); border:1px solid var(--line); border-radius:10px; padding:12px 16px; min-height:44px; display:block; text-align:center; color:var(--text); max-width:720px; margin:0 auto; line-height:1.7; overflow-x:auto; }
  .formula b{ color:var(--cyan); } .formula .ok{ color:var(--viu); font-weight:600; } .formula .no{ color:var(--pink); font-weight:600; }

  .pad-note{ font-size:13px; color:var(--muted); text-align:center; max-width:74ch; margin:0 auto; line-height:1.6; }

  .bio-text{ max-width:74ch; margin:0 auto; }

  .qgrid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:10px; }
  .qcard{ background:var(--panel-2); border:1px solid var(--line); border-radius:12px; padding:14px 16px; cursor:pointer; transition:border-color .15s; }
  .qcard:hover{ border-color:var(--viu); }
  .qcard .n{ font-family:var(--font-mono); font-size:11.5px; color:var(--viu); }
  .qcard h3{ font-family:var(--font-head); font-size:15px; margin:4px 0 6px; font-weight:600; }

  .btn-row{ display:flex; gap:8px; justify-content:center; flex-wrap:wrap; align-items:center; }
  .toggle-btn{ font-family:var(--font-mono); font-size:11.5px; background:var(--panel-2); border:1px solid var(--line); color:var(--muted); padding:8px 13px; border-radius:999px; cursor:pointer; transition:all .15s; }
  .toggle-btn:hover{ color:var(--text); border-color:#3a4a6b; }
  .toggle-btn.active{ background:var(--viu-dim); border-color:var(--viu); color:var(--viu); }
  .toggle-btn.good{ background:var(--viu-dim); border-color:var(--viu); color:var(--viu); }
  .toggle-btn.bad{ background:var(--pink-dim); border-color:var(--pink); color:var(--pink); }

  .tv{ display:inline-block; min-width:22px; padding:1px 6px; border-radius:6px; font-family:var(--font-mono); font-weight:600; font-size:12.5px; }
  .tv.v1{ background:var(--viu-dim); color:var(--viu); } .tv.v0{ background:var(--pink-dim); color:var(--pink); }

  .stats{ display:flex; gap:10px; flex-wrap:wrap; justify-content:center; }
  .stat{ background:var(--panel-2); border:1px solid var(--line); border-radius:10px; padding:8px 14px; text-align:center; min-width:110px; }
  .stat .l{ font-family:var(--font-mono); font-size:10.5px; color:var(--muted); display:block; margin-bottom:3px; }
  .stat .v{ font-family:var(--font-mono); font-size:15px; font-weight:600; color:var(--text); }
  .stat.c1 .v{ color:var(--viu); } .stat.c2 .v{ color:var(--cyan); } .stat.c3 .v{ color:var(--pink); }
  .panel-title{ font-family:var(--font-head); font-weight:600; font-size:13.5px; color:var(--text); text-align:center; margin:0 0 2px; }
  .panel-title.c1{ color:var(--viu); } .panel-title.c2{ color:var(--cyan); } .panel-title.c3{ color:var(--pink); }

  pre.code{ margin:0; background:#0E1626; border:1px solid var(--line); border-radius:10px; padding:12px 14px; font-family:var(--font-mono); font-size:12.3px; line-height:1.6; color:var(--text); overflow-x:auto; text-align:left; }
  pre.code .cm{ color:#6b7a99; } pre.code .kw{ color:var(--pink); }

  table.dt{ border-collapse:collapse; font-family:var(--font-mono); font-size:12.5px; margin:0 auto; }
  table.dt th,table.dt td{ border:1px solid var(--line); padding:6px 11px; text-align:center; }
  table.dt th{ background:var(--panel-2); color:var(--muted); font-weight:500; }
  table.dt th.res{ background:var(--viu-dim); color:var(--viu); }
  table.dt tr.hl td{ background:rgba(94,234,212,.12); }
  table.dt tr.pick{ cursor:pointer; } table.dt tr.pick:hover td{ background:rgba(255,255,255,.04); }
  .tbl-wrap{ overflow-x:auto; max-width:100%; }

  .qrow{ background:var(--panel-2); border:1px solid var(--line); border-radius:12px; padding:12px 14px; display:flex; gap:12px; align-items:center; justify-content:space-between; flex-wrap:wrap; }
  .qrow .tx{ flex:1 1 280px; font-size:14px; line-height:1.5; }
  .qrow .opts{ display:flex; gap:6px; flex-wrap:wrap; }
  .qrow .fb{ flex:1 1 100%; font-size:12.5px; color:var(--muted); line-height:1.5; }
  .qrow .fb b.ok{ color:var(--viu); } .qrow .fb b.no{ color:var(--pink); }
  .qrow.done{ border-color:#3a4a6b; }

  select,.nin{ font-family:var(--font-mono); font-size:13px; background:var(--panel-2); color:var(--text); border:1px solid var(--line); border-radius:8px; padding:8px 10px; max-width:100%; }
  select:focus,button:focus-visible,.nin:focus,summary:focus-visible,input[type=range]:focus-visible{ outline:2px solid var(--cyan); outline-offset:1px; }

  .flow{ display:flex; flex-wrap:wrap; gap:8px; align-items:center; justify-content:center; }
  .fnode{ background:var(--panel-2); border:1px solid var(--line); border-radius:10px; padding:8px 12px; font-family:var(--font-mono); font-size:12px; cursor:pointer; transition:border-color .15s; }
  .fnode:hover{ border-color:var(--viu); } .fnode small{ display:block; color:var(--muted); font-size:10.5px; }
  .farrow{ color:var(--muted); }

  /* matrices y fórmulas con tablas/CSS (sin librerías) */
  table.mx{ border-collapse:separate; border-spacing:0; font-family:var(--font-mono); font-size:13px; border-left:2px solid var(--muted); border-right:2px solid var(--muted); border-radius:7px; margin:2px 3px; display:inline-table; vertical-align:middle; }
  table.mx td{ padding:4px 10px; text-align:right; min-width:34px; white-space:nowrap; }
  table.mx td.c1{ color:var(--viu); } table.mx td.c2{ color:var(--cyan); } table.mx td.c3{ color:var(--pink); }
  table.mx td.piv{ background:var(--viu-dim); color:var(--viu); font-weight:600; }
  table.mx td.col{ background:rgba(94,234,212,.12); }
  table.mx.mxin td{ padding:3px 4px; }
  .nin{ width:68px; text-align:right; padding:6px 7px; }
  .nin.bad{ border-color:var(--pink); background:var(--pink-dim); }
  .eq{ display:flex; align-items:center; justify-content:center; flex-wrap:wrap; gap:6px 8px; font-family:var(--font-mono); font-size:13.5px; line-height:1.5; max-width:100%; }
  .eq .op{ color:var(--muted); } .eq .nm{ color:var(--cyan); } .eq .nm.o{ color:var(--viu); }
  .eqscroll{ overflow-x:auto; max-width:100%; padding:4px 0; }
  .fld{ display:inline-flex; align-items:center; gap:6px; font-family:var(--font-mono); font-size:12.5px; color:var(--muted); }
  .fld .nin{ width:72px; }
  .flds{ display:flex; gap:12px; flex-wrap:wrap; justify-content:center; align-items:center; }
  .sl{ display:flex; align-items:center; gap:10px; font-family:var(--font-mono); font-size:12.5px; color:var(--muted); flex-wrap:wrap; justify-content:center; }
  .sl input[type=range]{ accent-color:var(--viu); width:min(300px,60vw); }
  .sl output{ color:var(--viu); min-width:6ch; display:inline-block; text-align:left; }
  .bar{ display:flex; gap:3px; justify-content:center; flex-wrap:wrap; }
  .bar span{ width:30px; height:26px; border-radius:6px; border:1px solid var(--line); background:var(--panel-2); font-family:var(--font-mono); font-size:11px; color:var(--muted); display:flex; align-items:center; justify-content:center; }
  .bar span.k{ background:var(--pink-dim); border-color:var(--pink); color:var(--pink); }
  .bar span.i{ background:var(--viu-dim); border-color:var(--viu); color:var(--viu); }
  .bar span.z{ border-style:dashed; }
  details{ background:var(--panel-2); border:1px solid var(--line); border-radius:12px; padding:10px 14px; max-width:74ch; margin:0 auto; }
  details summary{ cursor:pointer; font-family:var(--font-head); font-weight:600; font-size:14px; color:var(--cyan); }
  details .sol{ margin-top:10px; font-size:13.5px; line-height:1.7; }
  details .sol b{ color:var(--viu); }
  .tagrow{ display:flex; gap:8px; justify-content:center; flex-wrap:wrap; }
  .tag{ font-family:var(--font-mono); font-size:12px; padding:5px 11px; border-radius:999px; border:1px solid var(--line); background:var(--panel-2); color:var(--muted); }
  .tag.y{ background:var(--viu-dim); border-color:var(--viu); color:var(--viu); } .tag.n{ background:var(--pink-dim); border-color:var(--pink); color:var(--pink); }

  svg text{ font-family:var(--font-mono); }
  svg{ max-width:100%; height:auto; }
  @media (max-width:640px){ .viz-row{ gap:16px; } table.dt th,table.dt td{ padding:5px 7px; } table.mx td{ padding:4px 6px; min-width:26px; } .nin{ width:58px; } }
  @media (prefers-reduced-motion:reduce){ *{ transition:none !important; } }
</style>

<body>

<header>
  <div class="headline-row">
    <h1>Aplicaciones <span>lineales</span>, núcleo e imagen</h1>
    <span class="net-tag">02MIAR · Matemáticas para la IA · Sesión 6</span>
  </div>
  <div class="trail" id="trail"></div>
</header>

<main>
  <div class="card">
    <div class="step-meta">
      <div>
        <p class="step-count" id="stepCount"></p>
        <h2 class="step-title" id="stepTitle"></h2>
        <p class="step-desc" id="stepDesc"></p>
      </div>
      <div class="shape-chip" id="shapeChip"></div>
    </div>
    <div id="stage"></div>
  </div>
</main>

<footer>
  <button class="nav-btn" id="prevBtn">← Anterior</button>
  <button class="nav-btn primary" id="nextBtn">Siguiente →</button>
</footer>

<script>
/* =========================================================
   Utilidades generales
========================================================= */
const $ = s => document.querySelector(s);
let timers = [];
function clearTimers(){ timers.forEach(t => clearInterval(t)); timers = []; }
function el(tag, cls, html){ const e = document.createElement(tag); if(cls) e.className = cls; if(html != null) e.innerHTML = html; return e; }
const V = x => x ? 1 : 0;
const vtag = x => `<span class="tv v${V(x)}">${x ? '✔' : '✘'}</span>`;

function py(code){
  return code.replace(/&/g, '&amp;').replace(/</g, '&lt;').split('\n').map(l => {
    const k = l.indexOf('#'); let body = l, cm = '';
    if(k >= 0){ body = l.slice(0, k); cm = '<span class="cm">' + l.slice(k) + '</span>'; }
    body = body.replace(/\b(import|from|as|print|def|return|not|and|or|for|in)\b/g, '<span class="kw">$1</span>');
    return body + cm;
  }).join('\n');
}
function codeBox(code){ const p = el('pre', 'code'); p.innerHTML = py(code); return p; }

/* ---------- números y vectores (todo se calcula aquí) ---------- */
const clean = x => Math.abs(x) < 1e-10 ? 0 : x;
const fmt = x => String(Math.round(clean(x) * 1e4) / 1e4).replace(/-/g, '−');
const vec = v => '(' + v.map(fmt).join(', ') + ')';
const matVec = (M, v) => M.map(r => r.reduce((s, a, j) => s + a * v[j], 0));
const matMul = (A, B) => A.map(r => B[0].map((_, j) => r.reduce((s, a, k) => s + a * B[k][j], 0)));
const vAdd = (a, b) => a.map((x, i) => x + b[i]);
const vScale = (k, a) => a.map(x => k * x);
const maxDiff = (a, b) => Math.max(0, ...a.map((x, i) => Math.abs(x - b[i])));
const close = (a, b, t = 1e-9) => a.every((x, i) => Math.abs(x - b[i]) <= t * (1 + Math.abs(x) + Math.abs(b[i])));
const R = n => `ℝ<sup>${n}</sup>`;
const sub = (s, i) => `${s}<sub>${i}</sub>`;
const colv = v => mx(v.map(x => [fmt(x)]));

/* matriz dibujada con tabla + CSS; cls(i,j) devuelve una clase de color */
function mx(rows, cls){
  return '<table class="mx">' + rows.map((r, i) => '<tr>' + r.map((x, j) => `<td class="${cls ? (cls(i, j) || '') : ''}">${x}</td>`).join('') + '</tr>').join('') + '</table>';
}
const mxn = (M, cls) => mx(M.map(r => r.map(fmt)), cls);
const eqRow = parts => `<div class="eqscroll"><div class="eq">${parts.join('')}</div></div>`;
const op = s => `<span class="op">${s}</span>`;

/* entradas numéricas */
function matInput(data, rows, cols, onCh, name){
  const t = el('table', 'mx mxin');
  for(let i = 0; i < rows; i++){
    const tr = el('tr');
    for(let j = 0; j < cols; j++){
      const td = el('td'), inp = el('input', 'nin'); inp.type = 'number'; inp.step = 'any'; inp.value = data[i][j]; inp.setAttribute('aria-label', `${name || 'M'} fila ${i+1} columna ${j+1}`);
      inp.addEventListener('input', () => { const v = inp.valueAsNumber; if(Number.isNaN(v)){ inp.classList.add('bad'); data[i][j] = 0; } else { inp.classList.remove('bad'); data[i][j] = v; } onCh(); });
      td.appendChild(inp); tr.appendChild(td);
    }
    t.appendChild(tr);
  }
  return t;
}
function vecInput(arr, labels, onCh){
  const w = el('div', 'flds'); const inputs = [];
  arr.forEach((val, i) => {
    const f = el('label', 'fld', labels[i] + ' = '); const inp = el('input', 'nin'); inp.type = 'number'; inp.step = 'any'; inp.value = val; inp.setAttribute('aria-label', labels[i]);
    inp.addEventListener('input', () => { const v = inp.valueAsNumber; if(Number.isNaN(v)){ inp.classList.add('bad'); arr[i] = 0; } else { inp.classList.remove('bad'); arr[i] = v; } onCh(); });
    f.appendChild(inp); w.appendChild(f); inputs.push(inp);
  });
  w.sync = () => inputs.forEach((inp, i) => { inp.value = arr[i]; inp.classList.remove('bad'); });
  return w;
}
function slider(label, min, max, val, fmtOut, cb){
  const w = el('div', 'sl'), lb = el('span', null, label), inp = el('input'), out = el('output');
  inp.type = 'range'; inp.min = min; inp.max = max; inp.step = 1; inp.value = val; inp.setAttribute('aria-label', label);
  const draw = () => { out.textContent = fmtOut(+inp.value); };
  inp.addEventListener('input', () => { draw(); cb(+inp.value); });
  w.append(lb, inp, out); draw();
  return { el:w, set:v => { inp.value = v; draw(); }, get:() => +inp.value };
}
const chipBtn = (label, on, cb) => { const b = el('button', 'toggle-btn' + (on ? ' active' : ''), label); b.type = 'button'; b.addEventListener('click', () => cb(b)); return b; };
function mkSelect(opts, val, cb, aria){
  const s = el('select'); s.setAttribute('aria-label', aria || 'selector');
  opts.forEach(([v, t]) => { const o = el('option', null, t); o.value = v; if(String(v) === String(val)) o.selected = true; s.appendChild(o); });
  s.addEventListener('change', () => cb(s.value)); return s;
}

/* ---------- cuestionario verdadero/falso ---------- */
function tfQuiz(items){
  const box = el('div', 'viz-col'); box.style.width = '100%';
  items.forEach(it => {
    const row = el('div', 'qrow'); const tx = el('div', 'tx', it.q); const opts = el('div', 'opts'); const fb = el('div', 'fb');
    [['Verdadero', true], ['Falso', false]].forEach(([lab, val]) => {
      const b = el('button', 'toggle-btn', lab); b.type = 'button';
      b.addEventListener('click', () => {
        const ok = val === it.ans;
        opts.querySelectorAll('button').forEach(x => x.classList.remove('good', 'bad'));
        b.classList.add(ok ? 'good' : 'bad');
        fb.innerHTML = (ok ? '<b class="ok">✔ Correcto.</b> ' : '<b class="no">✘ Casi.</b> ') + it.why;
        row.classList.add('done');
      });
      opts.appendChild(b);
    });
    row.append(tx, opts, fb); box.appendChild(row);
  });
  return box;
}

const steps = [];
function goStep(i){ goTo(i); }
function qcards(list){

/* =========================================================
   Aritmética exacta con fracciones (eliminación gaussiana)
========================================================= */
const gcd = (a, b) => { a = Math.abs(a); b = Math.abs(b); while(b){ [a, b] = [b, a % b]; } return a; };
const Fr = (n, d = 1) => { if(d < 0){ n = -n; d = -d; } const g = gcd(n, d) || 1; return { n:n / g, d:d / g }; };
const fadd = (a, b) => Fr(a.n * b.d + b.n * a.d, a.d * b.d);
const fsub = (a, b) => Fr(a.n * b.d - b.n * a.d, a.d * b.d);
const fmul = (a, b) => Fr(a.n * b.n, a.d * b.d);
const fdiv = (a, b) => Fr(a.n * b.d, a.d * b.n);
const fz = a => a.n === 0;
const fstr = a => (a.d === 1 ? String(Math.abs(a.n)) : `${Math.abs(a.n)}/${a.d}`).replace(/^/, a.n < 0 ? '−' : '');
function parseFr(s){
  s = String(s).trim().replace('−', '-').replace(',', '.'); let m;
  if((m = s.match(/^(-?\d+)\/(\d+)$/))){ if(+m[2] === 0) return null; return Fr(+m[1], +m[2]); }
  if((m = s.match(/^(-?)(\d+)(?:\.(\d{1,4}))?$/))){ const dec = m[3] || '', d = Math.pow(10, dec.length), n = +(m[2] + dec); return Fr(m[1] ? -n : n, d); }
  return null;
}
function rref(A, m, n){
  const Rm = A.map(r => r.slice()), piv = []; let r = 0;
  for(let c = 0; c < n && r < m; c++){
    let p = -1; for(let i = r; i < m; i++) if(!fz(Rm[i][c])){ p = i; break; }
    if(p < 0) continue;
    [Rm[r], Rm[p]] = [Rm[p], Rm[r]]; const inv = Rm[r][c]; Rm[r] = Rm[r].map(x => fdiv(x, inv));
    for(let i = 0; i < m; i++) if(i !== r && !fz(Rm[i][c])){ const f = Rm[i][c]; Rm[i] = Rm[i].map((x, j) => fsub(x, fmul(f, Rm[r][j]))); }
    piv.push(c); r++;
  }
  return { R:Rm, piv };
}
/* análisis completo de T(x) = A x, A de m×n con entradas fraccionarias */
function analyze(A, m, n){
  const { R:Rm, piv } = rref(A, m, n), free = []; for(let c = 0; c < n; c++) if(!piv.includes(c)) free.push(c);
  const ker = free.map(f => { const k = Array.from({ length:n }, () => Fr(0)); k[f] = Fr(1); piv.forEach((pc, i) => { k[pc] = Fr(-Rm[i][f].n, Rm[i][f].d); }); return k; });
  const img = piv.map(c => A.map(r => r[c]));
  const rank = piv.length;
  const killed = ker.every(k => A.every(row => fz(row.reduce((s, a, j) => fadd(s, fmul(a, k[j])), Fr(0)))));
  return { m, n, R:Rm, piv, free, ker, img, rank, dimKer:n - rank, inj:rank === n, surj:rank === m, killed };
}
const toFr = M => M.map(r => r.map(x => Fr(x)));

const EX = { 0:['1', '0'], 30:['√3/2', '1/2'], 45:['√2/2', '√2/2'], 60:['1/2', '√3/2'], 90:['0', '1'], 120:['−1/2', '√3/2'], 135:['−√2/2', '√2/2'], 150:['−√3/2', '1/2'], 180:['−1', '0'], 210:['−√3/2', '−1/2'], 225:['−√2/2', '−√2/2'], 240:['−1/2', '−√3/2'], 270:['0', '−1'], 300:['1/2', '−√3/2'], 315:['√2/2', '−√2/2'], 330:['√3/2', '−1/2'] };
const exactCS = deg => EX[((deg % 360) + 360) % 360];
const rotM = deg => { const t = deg * Math.PI / 180, c = Math.cos(t), s = Math.sin(t); return [[c, -s], [s, c]]; };
function piFrac(deg){
  if(deg === 0) return '0'; const g = gcd(deg, 180), n = deg / g, d = 180 / g;
  return d === 1 ? (n === 1 ? 'π' : `${n}π`) : (n === 1 ? `π/${d}` : `${n}π/${d}`);
}
function rotLabel(deg){ return `${deg}° = ${piFrac(deg)} rad`; }
function rotExactM(deg){ const e = exactCS(deg); if(!e) return null; const neg = s => s === '0' ? '0' : s.startsWith('−') ? s.slice(1) : '−' + s; return [[e[0], neg(e[1])], [e[1], e[0]]]; }

    const rows = PRESETS.map(P => { const m = P.A.length, n = P.A[0].length; return { P, ...analyze(toFr(P.A), m, n) }; });
    const T = el('div', 'tbl-wrap');
    T.innerHTML = `<table class="dt"><tr><th>Aplicación</th><th>n → m</th><th>rango</th><th>dim ker</th><th>inyectiva</th><th>sobreyectiva</th><th>¿n = m?</th></tr>${rows.map(r => `<tr><td style="text-align:left">${r.P.name}</td><td>${r.n} → ${r.m}</td><td>${r.rank}</td><td>${r.dimKer}</td><td>${vtag(r.inj)}</td><td>${vtag(r.surj)}</td><td>${r.n === r.m ? (r.inj === r.surj ? '<span class="tv v1">inj ⇔ sobre ✔</span>' : '<span class="tv v0">¡falla!</span>') : '<span class="tv" style="color:var(--muted)">no aplica</span>'}</td></tr>`).join('')}</table>`;
    stage.appendChild(T);
    stage.appendChild(el('p', 'pad-note', 'Las columnas se calculan por eliminación gaussiana exacta a partir de cada matriz. Mira las filas con n ≠ m: la 3ª (ℝ³→ℝ⁴) es inyectiva y no sobreyectiva; la 4ª (derivada P₃→P₂) es sobreyectiva y no inyectiva (ker = constantes). El corolario <b>no</b> se aplica cuando las dimensiones difieren.'));
    /* explorador */
    stage.appendChild(el('div', 'panel-title c1', 'Explorador: elige dimensiones y rango'));
    let n = 3, m = 3, r = 2; const sel = el('div', 'btn-row'), out = el('div');
    const opts = k => Array.from({ length:k }, (_, i) => [i + 1, String(i + 1)]);
    const sn = mkSelect(opts(5), n, x => { n = +x; fix(); }, 'n'), sm = mkSelect(opts(5), m, x => { m = +x; fix(); }, 'm'); let sr = null;
    function fix(){ const mx2 = Math.min(n, m); r = Math.min(r, mx2); sr = remake(); upd(); }
    function remake(){ const old = sel.querySelector('select.rk'); const s = mkSelect(Array.from({ length:Math.min(n, m) + 1 }, (_, i) => [i, String(i)]), r, x => { r = +x; upd(); }, 'rango'); s.classList.add('rk'); if(old) old.replaceWith(s); return s; }
    sel.append(el('span', 'viz-label', 'n = dim V'), sn, el('span', 'viz-label', 'm = dim W'), sm, el('span', 'viz-label', 'rango'));
    const first = mkSelect(Array.from({ length:Math.min(n, m) + 1 }, (_, i) => [i, String(i)]), r, x => { r = +x; upd(); }, 'rango'); first.classList.add('rk'); sel.appendChild(first);
    function upd(){
      const k = n - r, inj = r === n, surj = r === m, both = n === m;
      let h = `<div class="bar">${Array.from({ length:n }, (_, i) => i < k ? '<span class="k">ker</span>' : '<span class="i">Im</span>').join('')}<span style="border:none;background:none;width:24px">→</span>${Array.from({ length:m }, (_, i) => i < r ? '<span class="i">Im</span>' : '<span class="z">·</span>').join('')}</div><div class="viz-label">V = ${R(n)} reparte sus ${n} dimensiones entre ker (${k}) e Im (${r}); en W = ${R(m)} la imagen ocupa ${r} de ${m}</div>`;
      h += `<div class="tagrow"><span class="tag">dim ker = n − rango = ${k}</span><span class="tag ${inj ? 'y' : 'n'}">inyectiva: ${inj ? 'sí' : 'no'}</span><span class="tag ${surj ? 'y' : 'n'}">sobreyectiva: ${surj ? 'sí' : 'no'}</span></div>`;
      let msg;
      if(both) msg = `Como n = m = ${n}: inyectiva (${inj ? 'sí' : 'no'}) ⇔ sobreyectiva (${surj ? 'sí' : 'no'}) <span class="ok">✔ corolario</span>. ${inj ? 'T es biyectiva (invertible).' : 'T no es invertible: pierde dimensión (dim ker = ' + k + ').'}`;
      else if(n > m) msg = `n > m: nunca inyectiva, pues dim ker = n − rango ≥ n − m = ${n - m} > 0. ${surj ? 'Aquí es sobreyectiva (rango máximo).' : 'Aquí tampoco es sobreyectiva.'}`;
      else msg = `n < m: nunca sobreyectiva, pues rango ≤ n < m. ${inj ? 'Aquí es inyectiva (rango máximo).' : 'Aquí tampoco es inyectiva.'}`;
      out.innerHTML = h + `<div class="formula ${both ? 'win' : ''}">${msg}</div>`;
    }
    stage.append(sel, out);
    const det = el('details'); det.innerHTML = `<summary>¿Por qué inyectiva ⇔ ker T = {0}? (solución desplegable)</summary><div class="sol"><p>(⇒) Si T es inyectiva y T(v) = 0 = T(0), entonces v = 0.</p><p>(⇐) Si ker T = {0} y T(u) = T(w), por linealidad T(u − w) = 0, luego u − w = 0 y u = w. ∎ (Las diapositivas solo enuncian la implicación «⇐»; el recíproco también es cierto.)</p><p>Sobreyectiva ⇔ Im T = W ⇔ dim Im T = dim W, pues un subespacio con la misma dimensión que W es W entero.</p></div>`;
    stage.append(det);
    stage.appendChild(el('div', 'panel-title c2', 'Comprueba lo aprendido'));
    stage.appendChild(tfQuiz([
      { q:'Una aplicación lineal T: ℝ³ → ℝ² puede ser inyectiva', ans:false, why:'dim ker = 3 − rango ≥ 3 − 2 = 1, así que el núcleo contiene vectores no nulos.' },
      { q:'Una aplicación lineal T: ℝ² → ℝ³ puede ser sobreyectiva', ans:false, why:'rango ≤ 2 < 3 = dim W: la imagen es a lo sumo un plano dentro de ℝ³.' },
      { q:'Si T: ℝ⁴ → ℝ⁴ es lineal y ker T = {0}, entonces T es sobreyectiva', ans:true, why:'rango = 4 − 0 = 4 = dim W (corolario con dim V = dim W).' },
      { q:'Si T: ℝ³ → ℝ⁴ es inyectiva, entonces es biyectiva', ans:false, why:'Inyectiva da rango 3 < 4: la imagen es un subespacio propio de ℝ⁴. El corolario exige dim V = dim W.' }
    ]));
    upd();
  }
});

/* =========================================================
   PASO 8 · Capa de red neuronal
========================================================= */
const ACT = { id:{ n:'identidad', f:z => z }, relu:{ n:'ReLU', f:z => Math.max(0, z) }, sig:{ n:'sigmoide', f:z => 1 / (1 + Math.exp(-z)) }, tanh:{ n:'tanh', f:Math.tanh } };
steps.push({
  name:'Motivación en IA: una capa de red neuronal', short:'8 Capa de red', shape:'a<sup>R</sup> = f(W a<sup>L</sup> + b) &nbsp;·&nbsp; W ∈ ℝ<sup>m×n</sup>',
  desc:'Una capa que pasa información de n neuronas a m neuronas calcula <b>a<sub>i</sub><sup>R</sup> = f<sub>i</sub>(Σ<sub>j</sub> ω<sub>ij</sub> a<sub>j</sub><sup>L</sup> + b<sub>i</sub>)</b>: una <b>aplicación lineal</b> (la matriz W, de tamaño m×n) más un <b>sesgo</b> b más una <b>activación</b> f. Edita W, b y la entrada. (Aquí f<sub>i</sub> es la activación, no la aplicación lineal de antes.)',
  render(stage){
    const W = [[1, -2, 0.5], [0, 1, 1]], b = [0.5, -1], a = [1, 2, 2]; let act = 'relu';
    const row = el('div', 'viz-row'), c1 = el('div', 'viz-col'), c2 = el('div', 'viz-col'), svgBox = el('div'), out = el('div'), chk = el('div');
    c1.append(el('div', 'panel-title c1', 'W (2×3)'), matInput(W, 2, 3, upd, 'W'), el('div', 'panel-title c2', 'Sesgo b'), vecInput(b, ['b₁', 'b₂'], upd), el('div', 'panel-title c3', 'Entrada a^L'), vecInput(a, ['a₁', 'a₂', 'a₃'], upd));
    const sel = el('div', 'btn-row'); sel.append(el('span', 'viz-label', 'activación f ='), mkSelect(Object.keys(ACT).map(k => [k, ACT[k].n]), act, x => { act = x; upd(); }, 'función de activación')); c1.append(sel);
    c2.append(svgBox); row.append(c1, c2);
    function upd(){
      const F = ACT[act].f, Wa = matVec(W, a), z = vAdd(Wa, b), o = z.map(F);
      /* dibujo */
      const inY = [40, 100, 160], outY = [70, 130], ix = 40, ox = 260; let s = '';
      for(let i = 0; i < 2; i++) for(let j = 0; j < 3; j++){ const w = W[i][j], col = w >= 0 ? '#E55015' : '#F472B6'; s += `<line x1="${ix}" y1="${inY[j]}" x2="${ox}" y2="${outY[i]}" stroke="${col}" stroke-width="${Math.min(5, 0.8 + 1.4 * Math.abs(w))}" opacity=".75"/>`; const t = 0.28 + 0.1 * i; s += `<text x="${ix + (ox - ix) * t}" y="${inY[j] + (outY[i] - inY[j]) * t - 4}" fill="#E7ECF5" font-size="10">ω${i+1}${j+1}=${fmt(w)}</text>`; }
      a.forEach((x, j) => { s += `<circle cx="${ix}" cy="${inY[j]}" r="17" fill="#17233A" stroke="#5EEAD4" stroke-width="2"/><text x="${ix}" y="${inY[j] + 4}" fill="#E7ECF5" font-size="11" text-anchor="middle">${fmt(x)}</text><text x="${ix - 24}" y="${inY[j] + 4}" fill="#8B96AD" font-size="10" text-anchor="end">a${j+1}</text>`; });
      o.forEach((x, i) => { s += `<circle cx="${ox}" cy="${outY[i]}" r="19" fill="rgba(229,80,21,.25)" stroke="#E55015" stroke-width="2"/><text x="${ox}" y="${outY[i] + 4}" fill="#E7ECF5" font-size="11" text-anchor="middle">${fmt(x)}</text><text x="${ox + 26}" y="${outY[i] + 4}" fill="#8B96AD" font-size="10">a${i+1}ᴿ</text>`; });
      svgBox.innerHTML = `<svg viewBox="0 0 320 200" width="100%" style="max-width:360px" role="img" aria-label="Capa de 3 neuronas a 2 neuronas">${s}</svg>`;
      let h = '';
      for(let i = 0; i < 2; i++) h += `<div class="eqscroll"><div class="eq">${op(`neurona ${i+1}:`)}<span>z<sub>${i+1}</sub> = ${[0, 1, 2].map(j => `${fmt(W[i][j])}·${fmt(a[j])}`).join(' + ')} + ${fmt(b[i])} = <b style="color:var(--cyan)">${fmt(z[i])}</b></span>${op('→')}<span>a<sub>${i+1}</sub><sup>R</sup> = ${ACT[act].n}(${fmt(z[i])}) = <b style="color:var(--viu)">${fmt(o[i])}</b></span></div></div>`;
      h += eqRow([`<span class="nm">Wa</span>`, op('='), colv(Wa), op('+'), `<span class="nm">b</span>`, op('='), colv(b), op('= z ='), colv(z), op(`→ ${ACT[act].n} →`), colv(o)]);
      const Wa1 = W.map((r, i) => [...r, b[i]]); const ah = [...a, 1];
      h += eqRow([`<span class="nm o">[W | b]</span>`, op('='), mxn(Wa1, (i, j) => j === 3 ? 'c2' : ''), op('·'), colv(ah), op('='), colv(matVec(Wa1, ah)), op(close(matVec(Wa1, ah), z) ? '= z ✔' : '≠ z')]);
      out.innerHTML = h;
      /* comprobación de linealidad */
      const u1 = [1, 0, 2], u2 = [0, 1, -1], ka = 2, kb = 3, u = vAdd(vScale(ka, u1), vScale(kb, u2));
      const maps = [['L(x) = Wx', x => matVec(W, x), 'lineal'], ['A(x) = Wx + b', x => vAdd(matVec(W, x), b), 'afín (lineal solo si b = 0)'], [`N(x) = ${ACT[act].n}(Wx + b)`, x => vAdd(matVec(W, x), b).map(F), 'no lineal en general']];
      let t = `<table class="dt"><tr><th>aplicación</th><th>f(2u₁+3u₂)</th><th>2f(u₁)+3f(u₂)</th><th>¿coinciden?</th></tr>`;
      maps.forEach(([nm, f]) => { const l = f(u), r = vAdd(vScale(ka, f(u1)), vScale(kb, f(u2))); t += `<tr><td style="text-align:left">${nm}</td><td>${vec(l)}</td><td>${vec(r)}</td><td>${vtag(close(l, r))}</td></tr>`; });
      t += '</table>';
      const L0 = vAdd(matVec(W, [0, 0, 0]), b);
      const W2 = [[1, 1], [-1, 2]], two = matVec(W2, Wa), oneM = matVec(matMul(W2, W), a);
      chk.innerHTML = `<div class="panel-title c3">¿Es lineal? Prueba con u₁ = (1,0,2), u₂ = (0,1,−1), a = 2, b = 3</div><div class="tbl-wrap">${t}</div><div class="formula">Una aplicación lineal cumple T(0) = 0. Aquí A(0) = b = ${vec(L0)} ${close(L0, [0, 0]) ? '= 0 → pasa' : '≠ 0 → <span class="no">x ↦ Wx + b es afín, no lineal</span>'}.<br>Sin activación ni sesgo, dos capas se funden en una: W₂(W a) = ${vec(two)} y (W₂W) a = ${vec(oneM)} ${close(two, oneM) ? '<span class="ok">✔ (composición = producto de matrices)</span>' : ''}</div>`;
    }
    stage.append(row, out, chk);
    stage.appendChild(el('p', 'pad-note', '<b>Moraleja:</b> W a es lineal; W a + b es <b>afín</b> (se vuelve lineal en una dimensión más, usando la matriz ampliada [W | b] sobre (a, 1)); y la <b>activación no lineal</b> es lo que impide que apilar capas equivalga a una sola. Entrenar una red es, en gran parte, elegir bien las entradas de W y b.'));
    upd();
  }
});

/* =========================================================
   PASO 9 · Resumen y código
========================================================= */
const pyF = x => Number.isInteger(x) ? x.toFixed(1) : String(x);
const pyL = (a, f) => '[' + a.map(x => (f ? pyF(x) : String(x))).join(', ') + ']';
steps.push({
  name:'Resumen y código', short:'9 Resumen', shape:null,
  desc:'Una aplicación lineal se determina por la imagen de la base y se codifica en una matriz; su núcleo y su imagen reparten las dimensiones de V. Los resultados del bloque de Python los calcula la página con las mismas matrices.',
  render(stage){
    const T = el('div', 'tbl-wrap'); T.innerHTML = `<table class="dt"><tr><th>Concepto</th><th>Definición / fórmula</th><th>Cómo se calcula</th></tr>
      <tr><td>Lineal</td><td style="text-align:left">f(au₁+bu₂) = af(u₁)+bf(u₂)</td><td style="text-align:left">Comprobar ∀ u₁, u₂, a, b</td></tr>
      <tr><td>M_f</td><td style="text-align:left">f(v) = M_f v, columnas f(e_j)</td><td style="text-align:left">Aplicar f a la base canónica</td></tr>
      <tr><td>Composición</td><td style="text-align:left">M_{g∘f} = M_g M_f</td><td style="text-align:left">Producto de matrices (orden: g a la izquierda)</td></tr>
      <tr><td>ker T</td><td style="text-align:left">{v : T(v) = 0} ⊆ V</td><td style="text-align:left">Resolver Ax = 0</td></tr>
      <tr><td>Im T, rango</td><td style="text-align:left">{T(v)} ⊆ W, dim Im T</td><td style="text-align:left">Columnas con pivote de A</td></tr>
      <tr><td>Dimensión</td><td style="text-align:left">dim V = dim ker T + dim Im T</td><td style="text-align:left">n = (n − rango) + rango</td></tr>
      <tr><td>Inj. / sobre.</td><td style="text-align:left">ker = {0} / rango = dim W</td><td style="text-align:left">Si dim V = dim W son equivalentes</td></tr></table>`;
    stage.appendChild(T);
    stage.appendChild(el('div', 'panel-title c1', 'En Python: matriz, rango, giros y una capa de red'));
    const Mf = PRESETS[2].A, v = [1, 2, 3], Wn = [[1, -2, 0.5], [0, 1, 1]], bn = [0.5, -1], an = [1, 2, 2];
    const code = `import numpy as np

# 1) matriz de f(x,y,z) = (x+y, y-z, 2x+y+z, 3z) y su rango
Mf = np.array(${'[' + Mf.map(r => pyL(r)).join(', ') + ']'})
v = np.array(${pyL(v)})
print((Mf @ v).tolist())
r = np.linalg.matrix_rank(Mf)
print(r, Mf.shape[1] - r)            # rango y dim ker

# 2) composicion de rotaciones: f_(pi/3) o f_(pi/6)
def R(t):
    return np.array([[np.cos(t), -np.sin(t)], [np.sin(t), np.cos(t)]])
print((np.round(R(np.pi/3) @ R(np.pi/6), 6) + 0.0).tolist())

# 3) capa 3 -> 2: W a + b y despues ReLU
W = np.array(${'[' + Wn.map(r => pyL(r, true)).join(', ') + ']'})
b = np.array(${pyL(bn, true)})
a = np.array(${pyL(an)})
z = W @ a + b
print(z.tolist(), np.maximum(0, z).tolist())`;
    stage.appendChild(codeBox(code));
    stage.appendChild(el('div', 'viz-label', 'Salida del programa (calculada aquí con las mismas reglas):'));
    const p1 = matVec(Mf, v), rk = analyze(toFr(Mf), 4, 3).rank, P = matMul(rotM(60), rotM(30)).map(r => r.map(x => { const q = Math.round(x * 1e6) / 1e6; return q === 0 ? 0 : q; }));
    const z = vAdd(matVec(Wn, an), bn), zr = z.map(x => Math.max(0, x));
    stage.appendChild(codeBox(`${pyL(p1)}\n${rk} ${3 - rk}\n[${P.map(r => pyL(r, true)).join(', ')}]\n${pyL(z, true)} ${pyL(zr, true)}`));
    stage.appendChild(el('div', 'panel-title c3', 'Errores frecuentes'));
    const errs = el('div', 'bio-text'); errs.innerHTML = `<p><b>1.</b> Creer que x ↦ Wx + b es lineal: con b ≠ 0 es <i>afín</i> (manda 0 a b). Toda aplicación lineal cumple T(0) = 0.</p>
      <p><b>2.</b> «Comprobar» la linealidad con un ejemplo numérico: un contraejemplo la refuta, pero ningún número de aciertos la demuestra (y con a + b = 1 las afines parecen lineales).</p>
      <p><b>3.</b> Invertir el orden de la composición: M_{g∘f} = M_g M_f (primero actúa f, a la derecha). M_f M_g puede no existir o ser otra aplicación.</p>
      <p><b>4.</b> Confundir espacios: ker T vive en V (el dominio) e Im T en W (el codominio). Además dim V = dim ker + dim Im, no dim W.</p>
      <p><b>5.</b> Aplicar «inyectiva ⇔ sobreyectiva» cuando dim V ≠ dim W: ℝ³→ℝ⁴ puede ser inyectiva sin ser sobreyectiva.</p>
      <p><b>6.</b> Tomar como base de Im T las filas o columnas de la forma escalonada R: hay que usar las columnas <i>originales</i> de A con pivote.</p>
      <p><b>7.</b> Medir θ en grados dentro de cos y sen: las fórmulas exigen radianes (30° = π/6).</p>`;
    stage.appendChild(errs); stage.appendChild(qcards(QUESTIONS));
  }
});

/* =========================================================
   Motor de navegación (idéntico en todas las actividades)
========================================================= */
let current = 0;
function renderTrail(){
  const tr = $('#trail'); tr.innerHTML = '';
  steps.forEach((s, i) => { const b = el('button', null, s.short); b.type = 'button'; b.addEventListener('click', () => goTo(i)); tr.appendChild(b); });
}
function goTo(i){
  current = i;
  clearTimers();
  const s = steps[current];
  $('#stepCount').textContent = current === 0 ? 'Introducción' : `Paso ${current} de ${steps.length - 1}`;
  $('#stepTitle').textContent = s.name;
  $('#stepDesc').innerHTML = s.desc;
  const chip = $('#shapeChip');
  if(s.shape){ chip.style.display = ''; chip.innerHTML = `<b>${s.shape}</b>`; } else chip.style.display = 'none';
  const stage = $('#stage'); stage.innerHTML = '';
  s.render(stage);
  const btns = document.querySelectorAll('.trail button');
  btns.forEach((b, idx) => b.classList.toggle('active', idx === current));
  if(btns[current]) btns[current].scrollIntoView({ block:'nearest', inline:'center' });
  $('#prevBtn').disabled = current === 0;
  $('#nextBtn').textContent = current === steps.length - 1 ? 'Volver al inicio ↺' : 'Siguiente →';
  window.scrollTo(0, 0);
}
$('#prevBtn').addEventListener('click', () => { if(current > 0) goTo(current - 1); });
$('#nextBtn').addEventListener('click', () => goTo(current === steps.length - 1 ? 0 : current + 1));
document.addEventListener('keydown', e => {
  if(e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT' || e.target.tagName === 'TEXTAREA')) return;
  if(e.key === 'ArrowRight') $('#nextBtn').click();
  if(e.key === 'ArrowLeft') $('#prevBtn').click();
});
renderTrail(); goTo(0);
</script>
