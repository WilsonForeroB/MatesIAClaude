<script>
/* =========================================================
   Utilidades generales
========================================================= */
const $ = s => document.querySelector(s);
let timers = [];
function clearTimers(){ timers.forEach(t => clearInterval(t)); timers = []; }
function el(tag, cls, html){ const e = document.createElement(tag); if(cls) e.className = cls; if(html != null) e.innerHTML = html; return e; }

function py(code){
  return code.replace(/&/g, '&amp;').replace(/</g, '&lt;').split('\n').map(l => {
    const k = l.indexOf('#'); let body = l, cm = '';
    if(k >= 0){ body = l.slice(0, k); cm = '<span class="cm">' + l.slice(k) + '</span>'; }
    body = body.replace(/\b(import|from|as|print|def|return|not|and|or|for|in)\b/g, '<span class="kw">$1</span>');
    return body + cm;
  }).join('\n');
}
function codeBox(code){ const p = el('pre', 'code'); p.innerHTML = py(code); return p; }

/* ---------- formato ---------- */
const SUB = ['₀','₁','₂','₃','₄','₅','₆','₇','₈','₉'], SUP = ['⁰','¹','²','³','⁴','⁵','⁶','⁷','⁸','⁹'];
const subN = i => String(i).split('').map(c => SUB[+c]).join('');
const supN = i => String(i).split('').map(c => SUP[+c]).join('');
function fmt(x, d = 3){
  if(!isFinite(x)) return String(x);
  let r = Math.round(x * 10 ** d) / 10 ** d; if(r === 0) r = 0;
  return String(r).replace('-', '−');
}
const fmtIn = x => String(Math.round(x * 1e6) / 1e6);
const vecS = a => '(' + a.map(x => fmt(x)).join(', ') + ')';
const pyF = x => { let s = String(x); if(Number.isInteger(x) && !/e/.test(s)) s = x.toFixed(1); return s.replace(/e([+-])(\d)$/, 'e$10$2'); };
const pyL = a => '[' + a.map(x => Number.isInteger(x) ? String(x) : pyF(x)).join(', ') + ']';

/* ---------- álgebra de vectores (todo lo calcula JS) ---------- */
const dot  = (a, b) => a.reduce((s, x, i) => s + x * b[i], 0);
const add  = (a, b) => a.map((x, i) => x + b[i]);
const sub  = (a, b) => a.map((x, i) => x - b[i]);
const scl  = (k, a) => a.map(x => k * x);
const n1   = a => a.reduce((s, x) => s + Math.abs(x), 0);
const n2   = a => Math.sqrt(dot(a, a));
const ninf = a => Math.max(...a.map(Math.abs));
const proj = (u, v) => scl(dot(u, v) / dot(v, v), v);   /* exige v ≠ 0 */
const ort  = (u, v) => sub(u, proj(u, v));
const isZero = a => a.every(x => x === 0);
const close = (a, b, tol = 1e-9) => Math.abs(a - b) <= tol * Math.max(1, Math.abs(a), Math.abs(b));
const closeV = (a, b) => a.every((x, i) => close(x, b[i]));
const sameV = (a, b) => a.length === b.length && a.every((x, i) => x === b[i]);
const deg = r => r * 180 / Math.PI;
const median = a => { const s = a.slice().sort((x, y) => x - y), m = s.length >> 1; return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2; };
const mean = a => a.reduce((s, x) => s + x, 0) / a.length;
const ck = ok => ok ? '<span class="ok">✔</span>' : '<span class="no">✘</span>';

/* ---------- widgets ---------- */
function numInput(val, cb, label, cls){
  const i = el('input', 'num' + (cls ? ' ' + cls : '')); i.type = 'number'; i.step = 'any'; i.value = fmtIn(val); i.setAttribute('aria-label', label || 'valor');
  i.addEventListener('input', () => { const x = parseFloat(i.value); if(isFinite(x)) cb(x); });
  return i;
}
/* editor de un vector de n componentes; edita el array `arr` en su sitio */
function vecEditor(name, arr, n, cb, color){
  const w = el('div', 'vedit'); w.appendChild(el('span', null, `<b style="color:${color || 'var(--text)'}">${name}</b> = (`));
  const ins = [];
  for(let i = 0; i < n; i++){
    const inp = numInput(arr[i], x => { arr[i] = x; cb(); }, `${name}, componente ${i + 1}`); ins.push(inp); w.appendChild(inp);
    if(i < n - 1) w.appendChild(el('span', null, ','));
  }
  w.appendChild(el('span', null, ')'));
  return { el: w, refresh: () => ins.forEach((inp, i) => { if(document.activeElement !== inp) inp.value = fmtIn(arr[i]); }) };
}
function slider(label, min, max, step, val, cb, unit){
  const w = el('div', 'rng'); const r = el('input'); r.type = 'range'; r.min = min; r.max = max; r.step = step; r.value = val; r.setAttribute('aria-label', label);
  const o = el('b', null, fmt(val)); w.append(el('span', null, label), r, o);
  r.addEventListener('input', () => { const x = parseFloat(r.value); o.textContent = fmt(x) + (unit || ''); cb(x); });
  return { el: w, set: x => { r.value = x; o.textContent = fmt(x) + (unit || ''); }, out: o };
}
const chipBtn = (label, on, cb) => { const b = el('button', 'toggle-btn' + (on ? ' active' : ''), label); b.type = 'button'; b.addEventListener('click', () => cb(b)); return b; };
const statBox = (l, v, c) => `<div class="stat ${c || ''}"><span class="l">${l}</span><span class="v">${v}</span></div>`;

/* ---------- plano 2D con puntos arrastrables ---------- */
const C1 = '#E55015', C2 = '#5EEAD4', C3 = '#F472B6', MU = '#8B96AD', TX = '#E7ECF5';
function arrow(P, x0, y0, x1, y1, col, w, dash){
  const ax = P.X(x0), ay = P.Y(y0), bx = P.X(x1), by = P.Y(y1), L = Math.hypot(bx - ax, by - ay);
  if(L < 2) return `<circle cx="${bx}" cy="${by}" r="3.5" fill="${col}"/>`;
  const ux = (bx - ax) / L, uy = (by - ay) / L, h = Math.min(11, L * 0.5), px = -uy, py2 = ux;
  const sx = bx - ux * h * 0.8, sy = by - uy * h * 0.8;
  return `<line x1="${ax}" y1="${ay}" x2="${sx}" y2="${sy}" stroke="${col}" stroke-width="${w || 3}" stroke-linecap="round"${dash ? ' stroke-dasharray="6 5"' : ''}/>` +
    `<polygon points="${bx},${by} ${bx - ux * h + px * h * 0.45},${by - uy * h + py2 * h * 0.45} ${bx - ux * h - px * h * 0.45},${by - uy * h - py2 * h * 0.45}" fill="${col}"/>`;
}
const seg = (P, x0, y0, x1, y1, col, w, dash) => `<line x1="${P.X(x0)}" y1="${P.Y(y0)}" x2="${P.X(x1)}" y2="${P.Y(y1)}" stroke="${col}" stroke-width="${w || 1.5}"${dash ? ' stroke-dasharray="4 4"' : ''}/>`;
const txt = (P, x, y, t, col, size, anchor, dx, dy) => `<text x="${P.X(x) + (dx || 0)}" y="${P.Y(y) + (dy || 0)}" fill="${col || TX}" font-size="${size || 12}" text-anchor="${anchor || 'middle'}">${t}</text>`;

function makePlane(R, S, draw, handles, onMove, aria){
  const wrap = el('div', 'plane'); wrap.style.maxWidth = S + 'px';
  const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  svg.setAttribute('viewBox', `0 0 ${S} ${S}`); svg.setAttribute('width', '100%'); svg.setAttribute('role', 'img'); svg.setAttribute('aria-label', aria || 'Plano cartesiano');
  svg.style.touchAction = 'none'; wrap.appendChild(svg);
  const k = S / (2 * R), P = { X: x => S / 2 + x * k, Y: y => S / 2 - y * k, k, R, S };
  function render(){
    let s = '';
    for(let i = -Math.floor(R); i <= Math.floor(R); i++){
      if(i === 0) continue;
      s += `<line x1="${P.X(i)}" y1="0" x2="${P.X(i)}" y2="${S}" stroke="#1b2740" stroke-width="1"/><line x1="0" y1="${P.Y(i)}" x2="${S}" y2="${P.Y(i)}" stroke="#1b2740" stroke-width="1"/>`;
      if(i % 2 === 0) s += `<text x="${P.X(i)}" y="${P.Y(0) + 12}" fill="#5d6b88" font-size="9" text-anchor="middle">${i}</text><text x="${P.X(0) - 4}" y="${P.Y(i) + 3}" fill="#5d6b88" font-size="9" text-anchor="end">${i}</text>`;
    }
    s += `<line x1="0" y1="${P.Y(0)}" x2="${S}" y2="${P.Y(0)}" stroke="#3a4a6b" stroke-width="1.5"/><line x1="${P.X(0)}" y1="0" x2="${P.X(0)}" y2="${S}" stroke="#3a4a6b" stroke-width="1.5"/>`;
    s += draw(P);
    handles.forEach(h => { const p = h.get(); if(p) s += `<circle cx="${P.X(p[0])}" cy="${P.Y(p[1])}" r="9" fill="${h.color}" fill-opacity=".25" stroke="${h.color}" stroke-width="2" style="cursor:grab"/>`; });
    svg.innerHTML = s;
  }
  let drag = null;
  const toMath = e => { const r = svg.getBoundingClientRect(); return [((e.clientX - r.left) * S / r.width - S / 2) / k, -((e.clientY - r.top) * S / r.height - S / 2) / k]; };
  svg.addEventListener('pointerdown', e => {
    const [mx, my] = toMath(e); let best = null, bd = 1e9;
    handles.forEach(h => { const p = h.get(); if(!p) return; const d = Math.hypot(p[0] - mx, p[1] - my) * k; if(d < bd){ bd = d; best = h; } });
    if(best && bd < 24){ drag = best; try{ svg.setPointerCapture(e.pointerId); }catch(_){} e.preventDefault(); }
  });
  svg.addEventListener('pointermove', e => {
    if(!drag) return; let [mx, my] = toMath(e); const st = 0.5;
    mx = Math.max(-R, Math.min(R, Math.round(mx / st) * st)); my = Math.max(-R, Math.min(R, Math.round(my / st) * st));
    drag.set(mx, my); if(onMove) onMove();
  });
  ['pointerup', 'pointercancel'].forEach(ev => svg.addEventListener(ev, () => { drag = null; }));
  return { el: wrap, render };
}

function tfQuiz(items){
  const box = el('div', 'viz-col'); box.style.width = '100%';
  items.forEach(it => {
    const row = el('div', 'qrow'); const tx = el('div', 'tx', it.q); const opts = el('div', 'opts'); const fb = el('div', 'fb');
    [['Verdadero', true], ['Falso', false]].forEach(([lab, val]) => {
      const b = el('button', 'toggle-btn', lab); b.type = 'button';
      b.addEventListener('click', () => {
        const ok = val === it.ans;
        opts.querySelectorAll('button').forEach(x => x.classList.remove('good', 'bad'));
        b.classList.add(ok ? 'good' : 'bad');
        fb.innerHTML = (ok ? '<b class="ok">✔ Correcto.</b> ' : '<b class="no">✘ Casi.</b> ') + it.why;
        row.classList.add('done');
      });
      opts.appendChild(b);
    });
    row.append(tx, opts, fb); box.appendChild(row);
  });
  return box;
}

  const uv = dot(u, v), th = deg(Math.acos(Math.max(-1, Math.min(1, uv / (n2(u) * n2(v))))));
  res.push({ n:'u + v = v + u', l:vecS(add(u, v)), r:vecS(add(v, u)), ok:closeV(add(u, v), add(v, u)), err:Math.max(...add(u, v).map((x, i) => Math.abs(x - add(v, u)[i]))) });
  res.push({ n:'u · v = v · u', l:fmt(uv, 4), r:fmt(dot(v, u), 4), ok:close(uv, dot(v, u)), err:Math.abs(uv - dot(v, u)) });
  const l3 = dot(u, add(v, w)), r3 = dot(u, v) + dot(u, w);
  res.push({ n:'u · (v + w) = u·v + u·w', l:fmt(l3, 4), r:fmt(r3, 4), ok:close(l3, r3), err:Math.abs(l3 - r3) });
  const l4 = dot(scl(a, u), v), r4 = a * dot(u, v);
  res.push({ n:'(a·u) · v = a · (u·v)', l:fmt(l4, 4), r:fmt(r4, 4), ok:close(l4, r4), err:Math.abs(l4 - r4) });
  const l5 = dot(v, v), r5 = n2(v) ** 2;
  res.push({ n:'v · v = ‖v‖₂²', l:fmt(l5, 4), r:fmt(r5, 4), ok:close(l5, r5), err:Math.abs(l5 - r5) });
  const o6 = Math.abs(uv) <= 1e-9 * (1 + n2(u) * n2(v)), p6 = Math.abs(th - 90) <= 1e-6;
  res.push({ n:'6a. u · v = 0 ⇔ θ = 90° (par aleatorio)', l:`u·v = ${fmt(uv, 4)} → ${o6 ? 'es 0' : 'no es 0'}`, r:`θ = ${fmt(th, 2)}° → ${p6 ? 'es 90°' : 'no es 90°'}`, ok:o6 === p6, err:0 });
  const og = ort(u, v);   /* par construido: v y ort_v(u) */
  if(isZero(og) || n2(og) < 1e-9 * (1 + n2(u))){
    res.push({ n:'6b. u · v = 0 ⇔ θ = 90° (par construido v, ort_v(u))', l:'ort_v(u) = 0 (u ∥ v)', r:'el vector cero es ortogonal; θ no definido', ok:true, err:0 });
  } else {
    const d6 = dot(v, og), t6 = deg(Math.acos(Math.max(-1, Math.min(1, d6 / (n2(v) * n2(og))))));
    res.push({ n:'6b. u · v = 0 ⇔ θ = 90° (par construido v, ort_v(u))', l:`v·ort = ${Math.abs(d6) < 1e-12 ? '0' : d6.toExponential(1)} ≈ 0`, r:`θ = ${fmt(t6, 4)}°`, ok:Math.abs(d6) <= 1e-9 * (1 + n2(v) * n2(og)) && Math.abs(t6 - 90) <= 1e-6, err:Math.abs(d6) });
  }
  const l7 = dot(v, u), r7 = dot(v, proj(u, v));
  res.push({ n:'v · u = v · proy_v(u)  (v ≠ 0)', l:fmt(l7, 4), r:fmt(r7, 4), ok:close(l7, r7), err:Math.abs(l7 - r7) });
  const l8 = dot(og, v);
  res.push({ n:'ort_v(u) · v = 0  (v ≠ 0)', l:Math.abs(l8) < 1e-12 ? '0' : l8.toExponential(1), r:'0', ok:Math.abs(l8) <= 1e-9 * (1 + n2(og) * n2(v)), err:Math.abs(l8) });
  return res;
}
steps.push({
  name:'Las ocho propiedades, comprobadas con números aleatorios', short:'8 Propiedades', shape:'Para u, v, w ∈ ℝⁿ y a ∈ ℝ',
  desc:'Las propiedades del producto escalar no se creen: se <b>comprueban</b>. La página genera vectores aleatorios, evalúa los dos lados de cada igualdad y marca ✔ si coinciden (con tolerancia de redondeo). También puedes lanzar 1000 casos de golpe. Un ejemplo no demuestra una propiedad, pero un contraejemplo sí la tumbaría.',
  render(stage){
    let n = 3, u, v, w, a;
    const chips = el('div', 'btn-row'), act = el('div', 'btn-row'), data = el('div', 'formula'), tb = el('div', 'tbl-wrap'), sum = el('div', 'formula'), big = el('div', 'formula');
    const rnd = () => Math.floor(Math.random() * 11) - 5;
    const rvec = () => { let x; do { x = Array.from({ length:n }, rnd); } while(isZero(x)); return x; };
    function fresh(){ u = rvec(); v = rvec(); w = Array.from({ length:n }, rnd); a = (Math.floor(Math.random() * 13) - 6) / 2; upd(); }
    function upd(){
      chips.querySelectorAll('button').forEach(b => b.classList.toggle('active', b._n === n));
      data.innerHTML = `u = ${vecS(u)} · v = ${vecS(v)} · w = ${vecS(w)} · a = ${fmt(a)}`;
      const R = checkProps(u, v, w, a), good = R.filter(r => r.ok).length;
      tb.innerHTML = `<table class="dt"><tr><th>propiedad</th><th>lado izquierdo</th><th>lado derecho</th><th></th></tr>${R.map(r => `<tr class="${r.ok ? '' : 'bad'}"><td class="l">${r.n}</td><td>${r.l}</td><td>${r.r}</td><td>${ck(r.ok)}</td></tr>`).join('')}</table>`;
      sum.innerHTML = `Comprobaciones superadas: <span class="${good === R.length ? 'ok' : 'no'}">${good} de ${R.length}</span>`; sum.classList.toggle('win', good === R.length);
    }
    for(let q = 2; q <= 5; q++){ const b = chipBtn('n = ' + q, q === n, () => { n = q; fresh(); }); b._n = q; chips.appendChild(b); }
    act.append(chipBtn('Nuevos vectores aleatorios', false, fresh), chipBtn('Comprobar 1000 casos', false, () => {
      let fails = 0, maxE = 0, tot = 0; const per = {};
      for(let i = 0; i < 1000; i++){
        const nn = 2 + Math.floor(Math.random() * 4), rv = () => { let x; do { x = Array.from({ length:nn }, () => Math.floor(Math.random() * 21) - 10); } while(isZero(x)); return x; };
        const R = checkProps(rv(), rv(), Array.from({ length:nn }, () => Math.floor(Math.random() * 21) - 10), (Math.floor(Math.random() * 25) - 12) / 4);
        R.forEach(r => { tot++; maxE = Math.max(maxE, r.err); if(!r.ok){ fails++; per[r.n] = (per[r.n] || 0) + 1; } });
      }
      big.innerHTML = `1000 casos (dimensión 2 a 5, vectores y escalar aleatorios) × ${tot / 1000} comprobaciones = ${tot}<br>Fallos: <span class="${fails ? 'no' : 'ok'}">${fails}</span> · error de redondeo máximo observado: ${maxE.toExponential(1)}${fails ? '<br>' + Object.keys(per).map(k => k + ': ' + per[k]).join(' · ') : ''}`; big.classList.toggle('win', fails === 0);
    }));
    stage.append(chips, act, data, tb, sum, big);
    stage.appendChild(el('p', 'pad-note', '<b>Notas:</b> la propiedad 6 es en el fondo la definición de ortogonalidad: para vectores no nulos, u·v = 0 equivale a θ = 90° porque cos θ = u·v/(‖u‖‖v‖). Las propiedades 7 y 8 solo tienen sentido si v ≠ 0 (aquí se garantiza al generar). Con vectores aleatorios, 6a rara vez es «ortogonal» (≈ 2–4 % de los pares); por eso 6b construye un par ortogonal a propósito.'));
    fresh();
  }
});

/* =========================================================
   PASO 9 · resumen y código
========================================================= */
steps.push({
  name:'Resumen y código', short:'9 Resumen', shape:null,
  desc:'Un vector es una lista ordenada de n reales; se suma y se escala componente a componente; sus normas miden tamaño o error; el producto escalar da ángulo y ortogonalidad; la proyección descompone un vector en una parte paralela y otra ortogonal. Los números de abajo los calcula la página.',
  render(stage){
    const U = [2, -1, 0], W = [-3, -2, 1];
    const T = el('div', 'tbl-wrap'), uw = dot(U, W), cosv = uw / (n2(U) * n2(W)), pj = proj(U, W), og = ort(U, W);
    T.innerHTML = `<table class="dt"><tr><th>concepto</th><th>fórmula</th><th>con u = ${vecS(U)}, w = ${vecS(W)}</th></tr>
      <tr><td class="l">suma</td><td class="l">u + w</td><td>${vecS(add(U, W))}</td></tr>
      <tr><td class="l">producto por escalar</td><td class="l">2·u</td><td>${vecS(scl(2, U))}</td></tr>
      <tr><td class="l">norma 1</td><td class="l">Σ|wᵢ|</td><td>${fmt(n1(W))}</td></tr>
      <tr><td class="l">norma 2</td><td class="l">√(Σ wᵢ²)</td><td>√${fmt(dot(W, W))} ≈ ${fmt(n2(W), 4)}</td></tr>
      <tr><td class="l">norma ∞</td><td class="l">máx |wᵢ|</td><td>${fmt(ninf(W))}</td></tr>
      <tr><td class="l">producto escalar</td><td class="l">Σ uᵢwᵢ</td><td>${fmt(uw)}</td></tr>
      <tr><td class="l">ángulo</td><td class="l">cos θ = u·w/(‖u‖‖w‖)</td><td>${fmt(cosv, 4)} → ${fmt(deg(Math.acos(cosv)), 2)}°</td></tr>
      <tr><td class="l">proyección</td><td class="l">(u·w)/(w·w)·w</td><td>${vecS(pj.map(x => Math.round(x * 1e4) / 1e4))}</td></tr>
      <tr><td class="l">componente ortogonal</td><td class="l">u − proy_w(u)</td><td>${vecS(og.map(x => Math.round(x * 1e4) / 1e4))}</td></tr></table>`;
    stage.appendChild(T);
    stage.appendChild(el('div', 'panel-title c1', 'En Python con NumPy'));
    stage.appendChild(codeBox(`import numpy as np

u = np.array([2, -1, 0])
w = np.array([-3, -2, 1])

print((u + w).tolist(), (2 * u).tolist())          # suma y producto por escalar
print(np.linalg.norm(w, 1), np.linalg.norm(w), np.linalg.norm(w, np.inf))
print(u @ w)                                       # producto escalar
cos = (u @ w) / (np.linalg.norm(u) * np.linalg.norm(w))
print(round(float(np.degrees(np.arccos(cos))), 2)) # ángulo en grados
proj = (u @ w) / (w @ w) * w                       # proy_w(u), exige w != 0
ort = u - proj
print(proj.tolist(), ort.tolist())
print(np.isclose(ort @ w, 0))                      # ort_w(u) es ortogonal a w`));
    stage.appendChild(el('div', 'viz-label', 'Salida del programa (calculada aquí con las mismas operaciones en coma flotante):'));
    const ang = Math.round(deg(Math.acos(cosv)) * 100) / 100;
    stage.appendChild(codeBox([
      `${pyL(add(U, W))} ${pyL(scl(2, U))}`,
      `${pyF(n1(W))} ${pyF(n2(W))} ${pyF(ninf(W))}`,
      `${uw}`,
      `${pyF(ang)}`,
      `${pyL(pj)} ${pyL(og)}`,
      `${Math.abs(dot(og, W)) <= 1e-8 ? 'True' : 'False'}`
    ].join('\n')));
    stage.appendChild(el('div', 'panel-title c3', 'Errores frecuentes'));
    const pj2 = proj(W, U), errs = el('div', 'bio-text');
    errs.innerHTML = `<p><b>1.</b> Olvidar el valor absoluto en la norma 1: ‖(3, −4)‖₁ = ${n1([3, -4])}, no ${3 + (-4)}.</p>
      <p><b>2.</b> Creer que u · w es un vector: es un <i>número</i>. Con los vectores de arriba, u · w = ${uw}; el producto componente a componente (${vecS(U.map((x, i) => x * W[i]))}) es solo un paso intermedio.</p>
      <p><b>3.</b> Confundir proy_w(u) con proy_u(w): son vectores distintos (${vecS(pj.map(x => Math.round(x * 1e3) / 1e3))} frente a ${vecS(pj2.map(x => Math.round(x * 1e3) / 1e3))}), porque el primero es múltiplo de w y el segundo de u.</p>
      <p><b>4.</b> Proyectar sobre v = 0, o hablar del ángulo con un vector nulo: se divide entre 0. El vector cero es ortogonal a todos (u · 0 = 0) pero no tiene dirección.</p>
      <p><b>5.</b> Pensar que E = (1/n)‖v̂ − v‖₂ es el RMSE: el RMSE es ‖v̂ − v‖₂ / √n. Con la norma 1 sí es el error absoluto medio.</p>
      <p><b>6.</b> Tomar u · v = ‖u‖‖v‖ olvidando el cos θ: para u, v ≠ 0 solo coinciden si θ = 0 (misma dirección y sentido).</p>
      <p><b>7.</b> Tratar la ortogonalidad como un dato geométrico sin comprobarla: para saber si dos vectores son perpendiculares basta calcular u · v y ver si es 0 (con tolerancia en coma flotante, <code>np.isclose</code>).</p>`;
    stage.appendChild(errs); stage.appendChild(qcards(QUESTIONS));
  }
});

/* =========================================================
   Motor de navegación (idéntico en todas las actividades)
========================================================= */
let current = 0;
function renderTrail(){
  const tr = $('#trail'); tr.innerHTML = '';
  steps.forEach((s, i) => { const b = el('button', null, s.short); b.type = 'button'; b.addEventListener('click', () => goTo(i)); tr.appendChild(b); });
}
function goTo(i){
  current = i;
  clearTimers();
  const s = steps[current];
  $('#stepCount').textContent = current === 0 ? 'Introducción' : `Paso ${current} de ${steps.length - 1}`;
  $('#stepTitle').textContent = s.name;
  $('#stepDesc').innerHTML = s.desc;
  const chip = $('#shapeChip');
  if(s.shape){ chip.style.display = ''; chip.innerHTML = `<b>${s.shape}</b>`; } else chip.style.display = 'none';
  const stage = $('#stage'); stage.innerHTML = '';
  s.render(stage);
  const btns = document.querySelectorAll('.trail button');
  btns.forEach((b, idx) => b.classList.toggle('active', idx === current));
  if(btns[current]) btns[current].scrollIntoView({ block:'nearest', inline:'center' });
  $('#prevBtn').disabled = current === 0;
  $('#nextBtn').textContent = current === steps.length - 1 ? 'Volver al inicio ↺' : 'Siguiente →';
  window.scrollTo(0, 0);
}
$('#prevBtn').addEventListener('click', () => { if(current > 0) goTo(current - 1); });
$('#nextBtn').addEventListener('click', () => goTo(current === steps.length - 1 ? 0 : current + 1));
document.addEventListener('keydown', e => {
  if(e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT')) return;
  if(e.key === 'ArrowRight') $('#nextBtn').click();
  if(e.key === 'ArrowLeft') $('#prevBtn').click();
});
renderTrail(); goTo(0);
</script>
