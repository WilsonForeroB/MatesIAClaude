<script>
/* =========================================================
   Utilidades de interfaz
========================================================= */
const $ = s => document.querySelector(s);
let timers = [];
function clearTimers(){ timers.forEach(t => clearInterval(t)); timers = []; }
function el(tag, cls, html){ const e = document.createElement(tag); if(cls) e.className = cls; if(html != null) e.innerHTML = html; return e; }

function py(code){
  return code.replace(/&/g, '&amp;').replace(/</g, '&lt;').split('\n').map(l => {
    const k = l.indexOf('#'); let body = l, cm = '';
    if(k >= 0){ body = l.slice(0, k); cm = '<span class="cm">' + l.slice(k) + '</span>'; }
    body = body.replace(/\b(import|from|as|print|def|return|not|and|or|for|in)\b/g, '<span class="kw">$1</span>');
    return body + cm;
  }).join('\n');
}
function codeBox(code){ const p = el('pre', 'code'); p.innerHTML = py(code); return p; }
const vtag = x => `<span class="tv v${x ? 1 : 0}">${x ? '✔' : '✘'}</span>`;

function tfQuiz(items){
  const box = el('div', 'viz-col'); box.style.width = '100%';
  items.forEach(it => {
    const row = el('div', 'qrow'); const tx = el('div', 'tx', it.q); const opts = el('div', 'opts'); const fb = el('div', 'fb');
    [['Verdadero', true], ['Falso', false]].forEach(([lab, val]) => {
      const b = el('button', 'toggle-btn', lab); b.type = 'button';
      b.addEventListener('click', () => {
        const ok = val === it.ans;
        opts.querySelectorAll('button').forEach(x => x.classList.remove('good', 'bad'));
        b.classList.add(ok ? 'good' : 'bad');
        fb.innerHTML = (ok ? '<b class="ok">✔ Correcto.</b> ' : '<b class="no">✘ Casi.</b> ') + it.why;
        row.classList.add('done');
      });
      opts.appendChild(b);
    });
    row.append(tx, opts, fb); box.appendChild(row);
  });
  return box;
}

const steps = [];
function goStep(i){ goTo(i); }
function qcards(list){
  const g = el('div', 'qgrid');
  list.forEach(([n, h, p, to]) => { const c = el('div', 'qcard', `<div class="n">${n}</div><h3>${h}</h3><p>${p}</p>`); c.tabIndex = 0; c.addEventListener('click', () => goStep(to)); c.addEventListener('keydown', e => { if(e.key === 'Enter') goStep(to); }); g.appendChild(c); });
  return g;
}
const chipBtn = (label, on, cb) => { const b = el('button', 'toggle-btn' + (on ? ' active' : ''), label); b.type = 'button'; b.addEventListener('click', () => cb(b)); return b; };

/* =========================================================
   Aritmética exacta con fracciones (BigInt): sin errores de redondeo
========================================================= */
const gcdB = (a, b) => { a = a < 0n ? -a : a; b = b < 0n ? -b : b; while(b){ [a, b] = [b, a % b]; } return a; };
const Q = (n, d = 1n) => { n = BigInt(n); d = BigInt(d); if(d < 0n){ n = -n; d = -d; } const g = gcdB(n, d) || 1n; return { n:n / g, d:d / g }; };
const qadd = (a, b) => Q(a.n * b.d + b.n * a.d, a.d * b.d);
const qsub = (a, b) => Q(a.n * b.d - b.n * a.d, a.d * b.d);
const qmul = (a, b) => Q(a.n * b.n, a.d * b.d);
const qdiv = (a, b) => Q(a.n * b.d, a.d * b.n);            // b ≠ 0 (se comprueba antes)
const qneg = a => Q(-a.n, a.d);
const qz = a => a.n === 0n;
const qeq = (a, b) => a.n === b.n && a.d === b.d;
const Z = Q(0), U = Q(1);
const qpow = (a, k) => { let r = U; for(let i = 0; i < k; i++) r = qmul(r, a); return r; };
const qsa = a => a.d === 1n ? a.n.toString() : a.n + '/' + a.d;      // ASCII (para Python y para los inputs)
const qs = a => qsa(a).replace('-', '−');                           // para mostrar
const qp = a => a.n < 0n ? '(' + qs(a) + ')' : qs(a);               // entre paréntesis si es negativo
function parseQ(t){
  t = String(t).trim().replace(/[−–]/g, '-').replace(',', '.');
  const m = /^([+-]?)(\d+)(?:\.(\d+))?(?:\s*\/\s*(\d+))?$/.exec(t); if(!m) return null;
  let n = BigInt(m[2] + (m[3] || '')), d = 10n ** BigInt((m[3] || '').length);
  if(m[4]){ const k = BigInt(m[4]); if(k === 0n) return null; d *= k; }
  if(m[1] === '-') n = -n; return Q(n, d);
}

/* matrices = arrays de arrays de Q */
const dims = A => [A.length, A[0].length];
const mk = (r, c, f) => Array.from({ length:r }, (_, i) => Array.from({ length:c }, (_, j) => f(i, j)));
const toM = rows => rows.map(r => r.map(x => Q(x)));
const mI = n => mk(n, n, (i, j) => i === j ? U : Z);
const mT = A => mk(A[0].length, A.length, (i, j) => A[j][i]);
const mAdd = (A, B) => mk(A.length, A[0].length, (i, j) => qadd(A[i][j], B[i][j]));
const mSub = (A, B) => mk(A.length, A[0].length, (i, j) => qsub(A[i][j], B[i][j]));
const mScale = (k, A) => mk(A.length, A[0].length, (i, j) => qmul(k, A[i][j]));
const mMul = (A, B) => mk(A.length, B[0].length, (i, j) => A[i].reduce((s, _, k) => qadd(s, qmul(A[i][k], B[k][j])), Z));
const mEq = (A, B) => A.length === B.length && A[0].length === B[0].length && A.every((r, i) => r.every((x, j) => qeq(x, B[i][j])));
const mZero = (r, c) => mk(r, c, () => Z);
const minorM = (A, i, j) => A.filter((_, r) => r !== i).map(r => r.filter((_, c) => c !== j));
function det(A){                                                   // desarrollo recurrente por la 1.ª fila (como en la definición)
  const n = A.length; if(n === 1) return A[0][0];
  let s = Z;
  for(let j = 0; j < n; j++){ if(qz(A[0][j])) continue; const t = qmul(A[0][j], det(minorM(A, 0, j))); s = j % 2 ? qsub(s, t) : qadd(s, t); }
  return s;
}
const cof = (A, i, j) => { const d = det(minorM(A, i, j)); return (i + j) % 2 ? qneg(d) : d; };
const cofM = A => mk(A.length, A.length, (i, j) => cof(A, i, j));
const adjM = A => mT(cofM(A));
const invM = A => { const d = det(A); return qz(d) ? null : mScale(qdiv(U, d), adjM(A)); };
function expand(A, mode, k){                                       // desarrollo por la fila k o la columna k
  let s = Z;
  for(let t = 0; t < A.length; t++){
    const i = mode === 'row' ? k : t, j = mode === 'row' ? t : k;
    if(qz(A[i][j])) continue; s = qadd(s, qmul(A[i][j], cof(A, i, j)));
  }
  return s;
}
function rref(A){                                                  // Gauss-Jordan exacto
  const R = A.map(r => r.slice()), m = R.length, n = R[0].length, piv = []; let r = 0;
  for(let c = 0; c < n && r < m; c++){
    let p = -1; for(let i = r; i < m; i++) if(!qz(R[i][c])){ p = i; break; }
    if(p < 0) continue;
    [R[r], R[p]] = [R[p], R[r]];
    const iv = qdiv(U, R[r][c]); R[r] = R[r].map(x => qmul(x, iv));
    for(let i = 0; i < m; i++) if(i !== r && !qz(R[i][c])){ const f = R[i][c]; R[i] = R[i].map((x, j) => qsub(x, qmul(f, R[r][j]))); }
    piv.push(c); r++;
  }
  return { R, piv, rank:piv.length };
}

/* matriz editable (acepta enteros, decimales y fracciones tipo 3/2) */
function matInput(r, c, init, cb){
  let data = mk(r, c, (i, j) => init && init[i] && init[i][j] != null ? String(init[i][j]) : '0');
  const w = el('div', 'mxw'), t = el('table', 'mx'); let cells = [];

  function build(){
    t.innerHTML = ''; cells = [];
    data.forEach((row, i) => { const tr = el('tr'); cells.push([]); row.forEach((v, j) => {
      const td = el('td'), inp = el('input', 'cell'); inp.type = 'text'; inp.value = v; inp.autocomplete = 'off'; inp.spellcheck = false;
      inp.setAttribute('aria-label', `fila ${i + 1}, columna ${j + 1}`);
      inp.addEventListener('input', () => { data[i][j] = inp.value; mark(inp); cb && cb(); });
      inp.addEventListener('focus', () => inp.select());
      td.appendChild(inp); tr.appendChild(td); cells[i].push(inp); mark(inp); }); t.appendChild(tr); });
  }
  const api = {
    el:w,
    get:() => data.map(row => row.map(v => parseQ(v) || Z)),
    bad:() => data.flat().filter(v => parseQ(v) === null).length,
    set(vals){ data = vals.map(rw => rw.map(v => typeof v === 'object' ? qsa(v) : String(v))); build(); cb && cb(); },
    resize(r2, c2){ data = mk(r2, c2, (i, j) => data[i] && data[i][j] != null ? data[i][j] : '0'); build(); },
    tag(f){ cells.forEach((row, i) => row.forEach((inp, j) => { inp.parentNode.className = (f && f(i, j)) || ''; })); }
  };
  build(); return api;
}
function dimSel(lab, min, max, val, cb){

}

/* ---------- PASO 5: inversa ---------- */
steps.push({

  desc:'Una matriz cuadrada A es <b>invertible</b> (o <b>regular</b>) si existe B con A·B = B·A = I<sub>n</sub>. Entonces B se llama <b>A⁻¹</b>. Escribe una B candidata y la página calcula ambos productos y los compara con la identidad.',

/* ---------- PASO 6: determinante por cofactores ---------- */
steps.push({

  render(stage){

      rt.appendChild(blk(`Aᵗ (${n}×${m})`, matView(T)));
      const pivs = E.piv.length ? E.piv.map(c => `c<sub>${c + 1}</sub>`).join(', ') : '—';
      let t = `rango(A) = <b>${E.rank}</b> · columnas pivote (independientes): ${pivs} · rango(Aᵗ) = <b>${ET.rank}</b> ${vtag(E.rank === ET.rank)}`;
      if(m === n){
        const d = det(M), c1 = !qz(d), c2 = E.rank === n;
        t += `<br>det(A) = <b>${qs(d)}</b> → det ≠ 0: ${vtag(c1)} · rango = n (${n}): ${vtag(c2)} → <span class="${c1 ? 'ok' : 'no'}">A ${c1 ? 'es regular (tiene inversa)' : 'NO es regular (singular)'}</span> · las dos condiciones coinciden ${vtag(c1 === c2)}`;
        out.classList.toggle('win', c1);
      } else { t += `<br>A no es cuadrada (${m}×${n}): no tiene determinante ni inversa. Siempre se cumple rango(A) ≤ min(m, n) = ${Math.min(m, n)}.`; out.classList.remove('win'); }
      out.innerHTML = t;
      stats.innerHTML = `<div class="stat c1"><span class="l">rango</span><span class="v">${E.rank}</span></div><div class="stat c2"><span class="l">columnas dependientes</span><span class="v">${n - E.rank}</span></div><div class="stat c3"><span class="l">min(m, n)</span><span class="v">${Math.min(m, n)}</span></div>`;
    }
    const dr = el('div', 'btn-row'); const dg = el('div', 'dgrp'); dg.append(mS.el, nS.el); dr.appendChild(dg);
    const row = el('div', 'viz-row'); row.append(blk('A (columnas pivote en rosa)', A.el), rr, rt);
    stage.append(pre, dr, row, out, stats, warn);
    stage.appendChild(el('p', 'pad-note', 'El rango por columnas y por filas coincide, por eso rango(Aᵗ) = rango(A). Una matriz cuadrada con una columna que es combinación de las demás tiene rango menor que n, det = 0 y no es invertible.'));
    stage.appendChild(el('div', 'panel-title c2', 'Comprueba lo aprendido'));
    stage.appendChild(tfQuiz([
      { q:'Una matriz 4×4 con rango 3 es regular', ans:(3 === 4), why:'Para ser regular necesita rango = n = 4 (equivalentemente det ≠ 0).' },
      { q:'Si det(A) = 0 para A cuadrada, entonces el rango es menor que n', ans:true, why:'Es el teorema: A regular ⇔ rango n; si no es regular, el rango es < n.' },
      { q:'La traspuesta de una matriz 2×3 es una matriz 3×2', ans:(dims(mT(toM([[1, 2, 3], [4, 5, 6]]))).join('x') === '3x2'), why:'Aᵗ intercambia filas y columnas: de m×n pasa a n×m.' }
    ]));
    upd();
  }
});

/* ---------- PASO 9: inversa por adjunta ---------- */
steps.push({
  name:'Inversa por la matriz adjunta', short:'9 Adjunta', shape:'A⁻¹ = adj(A) / det(A), adj(A) = Cᵗ',
  desc:'Si A es regular, <b>A⁻¹ = (1/det A)·adj(A)</b>, donde la adjunta es la <b>traspuesta de la matriz de cofactores</b> C, con C(i,j) = (−1)<sup>i+j</sup>·det(A<sub>ij</sub>). Haz clic en una celda de C para ver su cálculo (y dónde acaba en adj(A) tras trasponer). Después la página comprueba A·A⁻¹ = I.',
  render(stage){
    let n = 3, sel = [0, 0];
    const A = matInput(3, 3, [[2, 1, 3], [0, -1, 4], [1, 0, 2]], () => upd());
    const nS = dimSel('n', 2, 4, 3, v => { n = v; A.resize(n, n); upd(); });
    const pre = presetBtns([['det = 3', () => { n = 3; nS.set(3); A.resize(3, 3); A.set([[2, 1, 3], [0, -1, 4], [1, 0, 2]]); }], ['det = 1 (inversa entera)', () => { n = 3; nS.set(3); A.resize(3, 3); A.set([[1, 2, 3], [0, 1, 4], [5, 6, 0]]); }], ['Singular de la clase', () => { n = 3; nS.set(3); A.resize(3, 3); A.set([[-2, -1, 1], [0, 1, 0], [-6, -2, 3]]); }], ['Aleatoria', () => { A.set(mk(n, n, randInt)); }]]);
    const rC = el('div', 'mcol'), rAdj = el('div', 'mcol'), rInv = el('div', 'mcol'), det1 = el('div', 'formula'), out = el('div', 'formula'), chk = el('div', 'viz-row'), chkOut = el('div', 'formula'), warn = el('div', 'pad-note');
    function upd(){
      const M = A.get(), d = det(M), C = cofM(M), Ad = mT(C), reg = !qz(d); warn.innerHTML = badNote(A);
      if(sel[0] >= n || sel[1] >= n) sel = [0, 0]; const [i, j] = sel;
      A.tag((r, c) => r === i || c === j ? (r === i && c === j ? 'sel' : '') : '');
      rC.innerHTML = ''; rAdj.innerHTML = ''; rInv.innerHTML = ''; chk.innerHTML = '';
      rC.appendChild(blk('C: cofactores (clic)', matView(C, { cls:(r, c) => r === i && c === j ? 'sel' : '', onCell:(r, c) => { sel = [r, c]; upd(); } })));
      rAdj.appendChild(blk('adj(A) = Cᵗ', matView(Ad, { cls:(r, c) => r === j && c === i ? 'sel' : '' })));
      const mn = minorM(M, i, j), dm = det(mn);
      det1.innerHTML = `${sb('C', i, j)} = (−1)<sup>${i + 1}+${j + 1}</sup>·det(${sb('A', i, j)}) = ${(i + j) % 2 ? '−1' : '+1'}·det(${n === 2 ? '[' + qs(mn[0][0]) + ']' : '[' + mn.map(r => r.map(qs).join(' ')).join(' ; ') + ']'}) = ${(i + j) % 2 ? '−1' : '+1'}·${qp(dm)} = <b>${qs(C[i][j])}</b> → pasa a la posición (${j + 1}, ${i + 1}) de adj(A)`;
      det1.classList.add('win');
      if(reg){
        const Inv = mScale(qdiv(U, d), Ad), P = mMul(M, Inv), P2 = mMul(Inv, M), I = mI(n), ok = mEq(P, I) && mEq(P2, I);
        rInv.appendChild(blk(`A⁻¹ = (1/${qs(d)})·adj(A)`, matView(Inv)));
        out.innerHTML = `det(A) = <b>${qs(d)}</b> ≠ 0 → <span class="ok">A es regular</span> y A⁻¹ = adj(A)/det(A).`; out.classList.add('win');
        chk.append(blk('A·A⁻¹', matView(P, { cls:(r, c) => qeq(P[r][c], I[r][c]) ? 'on' : 'bad' })), opEl('y'), blk('A⁻¹·A', matView(P2, { cls:(r, c) => qeq(P2[r][c], I[r][c]) ? 'on' : 'bad' })));
        chkOut.innerHTML = `A·A⁻¹ = I y A⁻¹·A = I: ${vtag(ok)}`; chkOut.classList.toggle('win', ok);
      } else {
        const P = mMul(M, Ad), D = mScale(d, mI(n));
        out.innerHTML = `det(A) = <b>${qs(d)}</b> → <span class="no">A no es regular: no hay A⁻¹</span> (no se puede dividir entre 0).`; out.classList.remove('win');
        chk.append(blk('A·adj(A)', matView(P)), opEl('='), blk('det(A)·I', matView(D)));
        chkOut.innerHTML = `Aun así A·adj(A) = det(A)·I: ${vtag(mEq(P, D))} (aquí es la matriz nula).`; chkOut.classList.remove('win');
      }
    }
    const dr = el('div', 'btn-row'); dr.appendChild(nS.el);
    const row = el('div', 'viz-row'); row.append(blk('A', A.el), opEl('→'), rC, opEl('ᵗ→'), rAdj, opEl('→'), rInv);
    stage.append(pre, dr, row, det1, out, chk, chkOut, warn);
    stage.appendChild(el('p', 'pad-note', '<b>Para 2×2</b> la fórmula es directa: si A = [[a,b],[c,d]] y ad−bc ≠ 0, entonces A⁻¹ = (1/(ad−bc))·[[d,−b],[−c,a]]. Para matrices grandes este método es costoso (muchos determinantes); en la práctica se usa eliminación gaussiana, pero la fórmula es útil para razonar.'));
    stage.appendChild(el('div', 'panel-title c2', 'Comprueba lo aprendido'));
    const P2 = toM([[4, 7], [2, 6]]), I2 = invM(P2);
    stage.appendChild(tfQuiz([
      { q:'adj(A) es la matriz de cofactores sin trasponer', ans:false, why:'adj(A) = Cᵗ: hay que trasponer la matriz de cofactores.' },
      { q:`La inversa de [[4,7],[2,6]] tiene como entrada (1,1) el valor ${qs(I2[0][0])}`, ans:true, why:`det = 24 − 14 = ${qs(det(P2))}; A⁻¹ = (1/${qs(det(P2))})·[[6,−7],[−2,4]], y su entrada (1,1) es 6/${qs(det(P2))} = ${qs(I2[0][0])}.` },
      { q:'Una matriz con det(A) = 0 puede tener inversa si sus entradas son grandes', ans:false, why:'No: det = 0 significa matriz no regular, sea cual sea el tamaño de las entradas.' }
    ]));
    upd();
  }
});

/* ---------- PASO 10: resumen ---------- */
steps.push({
  name:'Resumen y código', short:'10 Resumen', shape:null,
  desc:'Cada fila de la tabla se comprueba con una matriz de ejemplo, usando las mismas rutinas exactas de la página. Debajo, el código Python equivalente y su salida.',
  render(stage){
    const A = toM([[2, 1, 3], [0, -1, 4], [1, 0, 2]]), B = toM([[1, 2, 0], [0, 1, 1], [3, 0, 1]]), n = 3;
    const dA = det(A), dB = det(B), AB = mMul(A, B), K = Q(2);
    const rows = [
      ['det(A·B) = det(A)·det(B)', `${qs(det(AB))} = ${qs(dA)}·${qs(dB)}`, qeq(det(AB), qmul(dA, dB))],
      ['A·B = B·A', 'el producto no conmuta', mEq(AB, mMul(B, A))],
      ['(A·B)ᵗ = Bᵗ·Aᵗ (orden invertido)', 'traspuesta del producto', mEq(mT(AB), mMul(mT(B), mT(A)))],
      ['(A·B)⁻¹ = B⁻¹·A⁻¹ (orden invertido)', 'A y B regulares', mEq(invM(AB), mMul(invM(B), invM(A)))],
      ['det(Aᵗ) = det(A)', `${qs(det(mT(A)))} = ${qs(dA)}`, qeq(det(mT(A)), dA)],
      ['det(2A) = 2·det(A)', `${qs(det(mScale(K, A)))} vs ${qs(qmul(K, dA))}`, qeq(det(mScale(K, A)), qmul(K, dA))],
      ['det(2A) = 2ⁿ·det(A)', `${qs(det(mScale(K, A)))} = ${qs(qpow(K, n))}·${qs(dA)}`, qeq(det(mScale(K, A)), qmul(qpow(K, n), dA))],
      ['det(A+B) = det(A)+det(B)', `${qs(det(mAdd(A, B)))} vs ${qs(qadd(dA, dB))}`, qeq(det(mAdd(A, B)), qadd(dA, dB))],
      ['A·adj(A) = det(A)·I', 'identidad de la adjunta', mEq(mMul(A, adjM(A)), mScale(dA, mI(n)))],
      ['det(A) ≠ 0 ⇔ rango(A) = n', `det = ${qs(dA)}, rango = ${rref(A).rank}`, (!qz(dA)) === (rref(A).rank === n)]
    ];
    const T = el('div', 'tbl-wrap'); T.innerHTML = `<table class="dt"><tr><th>Propiedad</th><th>En el ejemplo</th><th>¿Se cumple?</th></tr>${rows.map(r => `<tr><td class="l">${r[0]}</td><td>${r[1]}</td><td>${vtag(r[2])}</td></tr>`).join('')}</table>`;
    const fmtL = M => '[' + M.map(r => '[' + r.map(qsa).join(', ') + ']').join(', ') + ']';
    stage.appendChild(el('div', 'viz-label', `Ejemplo: A = ${fmtL(A)} (det ${qs(dA)}), B = ${fmtL(B)} (det ${qs(dB)})`));
    stage.appendChild(T);

    /* código: los datos del programa salen de las mismas matrices que el resto de la página */
    const CL1 = toM([[1, 0], [-1, 2]]), CL2 = toM([[0, 1], [-3, 4]]);
    const D = toM([[2, 0, 0], [0, 3, 0], [0, 0, 5]]), E = toM([[1, 0, 3], [0, 4, 5], [3, 5, 6]]);
    const G = mk(5, 5, () => Z); [[1, 2], [1, 3], [2, 4], [3, 4], [3, 5], [4, 5]].forEach(([i, j]) => { G[i - 1][j - 1] = U; G[j - 1][i - 1] = U; });
    const code = `import sympy as sp                      # álgebra simbólica exacta (paquete oficial de PyPI)

A = sp.Matrix(${fmtL(CL1)})
B = sp.Matrix(${fmtL(CL2)})
print((A * B).tolist())                  # A·B
print((B * A).tolist())                  # B·A: distinto

M = sp.Matrix(${fmtL(A)})
print(M.det(), M.rank())                 # determinante y rango
print(M.adjugate().tolist())             # adj(M) = traspuesta de cofactores
print(M.inv().tolist())                  # inversa exacta
print(M * M.inv() == sp.eye(3))          # comprobación M·M⁻¹ = I

D = sp.Matrix(${fmtL(D)})
E = sp.Matrix(${fmtL(E)})
print((4 * D * E).det())                 # det(4·D·E) = 4**3 · det(D) · det(E)

G = sp.Matrix(${fmtL(G)})   # adyacencia del grafo de 5 vértices
print(G == G.T, G.det())                 # simétrica; determinante`;
    stage.appendChild(el('div', 'panel-title c1', 'En Python: operaciones, determinante, adjunta e inversa'));
    stage.appendChild(codeBox(code));
    stage.appendChild(el('div', 'viz-label', 'Salida del programa (calculada aquí con las mismas reglas):'));
    const invA = invM(A), inv0 = invA.map(r => r.map(qsa));
    const outp = [fmtL(mMul(CL1, CL2)), fmtL(mMul(CL2, CL1)), `${qsa(dA)} ${rref(A).rank}`, fmtL(adjM(A)), fmtL(invA), String(mEq(mMul(A, invA), mI(3)) ? 'True' : 'False'), qsa(det(mScale(Q(4), mMul(D, E)))), `${mEq(G, mT(G)) ? 'True' : 'False'} ${qsa(det(G))}`];
    stage.appendChild(codeBox(outp.join('\n')));
    stage.appendChild(el('p', 'pad-note', 'Fíjate: la adyacencia G = Gᵗ (simétrica) y det(4·D·E) coincide con 4³·30·(−37). Con matrices numéricas grandes se usa NumPy (coma flotante), cuyos determinantes pueden arrastrar pequeños errores de redondeo; aquí se usa aritmética exacta.'));
    stage.appendChild(el('div', 'panel-title c3', 'Errores frecuentes'));
    const errs = el('div', 'bio-text'); errs.innerHTML = `<p><b>1.</b> Sumar matrices de distinto tamaño, o multiplicar sin comprobar que columnas de A = filas de B.</p>
      <p><b>2.</b> Suponer A·B = B·A. Además A·B puede existir y B·A no, y de A·B = 0 no se deduce A = 0 ni B = 0.</p>
      <p><b>3.</b> Escribir det(kA) = k·det(A): lo correcto es kⁿ·det(A). Y det(A+B) no es det(A)+det(B).</p>
      <p><b>4.</b> Equivocarse con el signo (−1)<sup>i+j</sup> del cofactor, o <i>olvidar trasponer</i> C al formar adj(A).</p>
      <p><b>5.</b> Invertir mal el orden: (A·B)⁻¹ = B⁻¹·A⁻¹ y (A·B)ᵗ = Bᵗ·Aᵗ.</p>
      <p><b>6.</b> Decir que una matriz «casi singular» (det pequeño) es singular: solo det = 0 exacto lo es; el valor del determinante depende de la escala (det(kA) = kⁿdet(A)).</p>
      <p><b>7.</b> En la matriz de adyacencia, mezclar convenciones del bucle (1 o 2) o esperar simetría en un grafo dirigido.</p>`;
    stage.appendChild(errs); stage.appendChild(qcards(QUESTIONS));
  }
});

/* =========================================================
   Motor de navegación (idéntico en todas las actividades)
========================================================= */
let current = 0;
function renderTrail(){
  const tr = $('#trail'); tr.innerHTML = '';
  steps.forEach((s, i) => { const b = el('button', null, s.short); b.type = 'button'; b.addEventListener('click', () => goTo(i)); tr.appendChild(b); });
}
function goTo(i){
  current = i;
  clearTimers();
  const s = steps[current];
  $('#stepCount').textContent = current === 0 ? 'Introducción' : `Paso ${current} de ${steps.length - 1}`;
  $('#stepTitle').textContent = s.name;
  $('#stepDesc').innerHTML = s.desc;
  const chip = $('#shapeChip');
  if(s.shape){ chip.style.display = ''; chip.innerHTML = `<b>${s.shape}</b>`; } else chip.style.display = 'none';
  const stage = $('#stage'); stage.innerHTML = '';
  s.render(stage);
  const btns = document.querySelectorAll('.trail button');
  btns.forEach((b, idx) => b.classList.toggle('active', idx === current));
  if(btns[current]) btns[current].scrollIntoView({ block:'nearest', inline:'center' });
  $('#prevBtn').disabled = current === 0;
  $('#nextBtn').textContent = current === steps.length - 1 ? 'Volver al inicio ↺' : 'Siguiente →';
  window.scrollTo(0, 0);
}
$('#prevBtn').addEventListener('click', () => { if(current > 0) goTo(current - 1); });
$('#nextBtn').addEventListener('click', () => goTo(current === steps.length - 1 ? 0 : current + 1));
document.addEventListener('keydown', e => {
  if(e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT')) return;
  if(e.key === 'ArrowRight') $('#nextBtn').click();
  if(e.key === 'ArrowLeft') $('#prevBtn').click();
});
renderTrail(); goTo(0);
</script>
