<script>
/* =========================================================
   Utilidades de interfaz
========================================================= */
const $ = s => document.querySelector(s);
let timers = [];
function clearTimers(){ timers.forEach(t => clearInterval(t)); timers = []; }
function el(tag, cls, html){ const e = document.createElement(tag); if(cls) e.className = cls; if(html != null) e.innerHTML = html; return e; }
const vtag = x => `<span class="tv v${x ? 1 : 0}">${x ? '✓' : '✗'}</span>`;

function py(code){
  return code.replace(/&/g, '&amp;').replace(/</g, '&lt;').split('\n').map(l => {
    const k = l.indexOf('#'); let body = l, cm = '';
    if(k >= 0){ body = l.slice(0, k); cm = '<span class="cm">' + l.slice(k) + '</span>'; }
    body = body.replace(/\b(import|from|as|print|def|return|not|and|or|for|in)\b/g, '<span class="kw">$1</span>');
    return body + cm;
  }).join('\n');
}
function codeBox(code){ const p = el('pre', 'code'); p.innerHTML = py(code); return p; }

/* =========================================================
   MOTOR DE ÁLGEBRA LINEAL (todo lo que se muestra se calcula aquí)
========================================================= */
const MINUS = '−', TOL = 1e-9;
const SUPD = { '0':'⁰','1':'¹','2':'²','3':'³','4':'⁴','5':'⁵','6':'⁶','7':'⁷','8':'⁸','9':'⁹','-':'⁻' };
const sup = n => String(n).split('').map(c => SUPD[c] || c).join('');
const gcd = (a, b) => { a = Math.abs(a); b = Math.abs(b); while(b){ [a, b] = [b, a % b]; } return a; };
const snap = x => Math.abs(x - Math.round(x)) < TOL ? Math.round(x) : x;

/* número → texto (entero, fracción p/q con q ≤ 12 o decimal) */
function fmt(x, dec = 4){
  if(!isFinite(x)) return String(x);
  if(Math.abs(x) < TOL) return '0';
  const sg = x < 0 ? MINUS : '', a = Math.abs(x);
  if(Math.abs(a - Math.round(a)) < TOL) return sg + Math.round(a);
  for(let q = 2; q <= 12; q++){ const p = Math.round(a * q); if(Math.abs(a - p / q) < TOL) return sg + p + '/' + q; }
  return sg + a.toFixed(dec).replace(/0+$/, '').replace(/\.$/, '');
}
function fmtD(x, dec = 3){
  if(Math.abs(x) < 0.5 * Math.pow(10, -dec)) return '0';
  return (x < 0 ? MINUS : '') + Math.abs(x).toFixed(dec).replace(/0+$/, '').replace(/\.$/, '');
}
/* complejos */
const cx = (re, im = 0) => ({ re, im });
const cadd = (a, b) => cx(a.re + b.re, a.im + b.im);
const csub = (a, b) => cx(a.re - b.re, a.im - b.im);
const cmul = (a, b) => cx(a.re * b.re - a.im * b.im, a.re * b.im + a.im * b.re);
const cabs = a => Math.hypot(a.re, a.im);
function fmtC(z){
  if(Math.abs(z.im) < TOL) return fmt(z.re);
  const ims = Math.abs(Math.abs(z.im) - 1) < TOL ? 'i' : fmt(Math.abs(z.im)) + 'i';
  if(Math.abs(z.re) < TOL) return (z.im < 0 ? MINUS : '') + ims;
  return fmt(z.re) + (z.im < 0 ? ' ' + MINUS + ' ' : ' + ') + ims;
}
const cell = x => typeof x === 'number' ? fmt(x) : (x && typeof x === 'object' ? fmtC(x) : String(x));

/* matrices (arrays de filas) */
const zeros = n => Array.from({ length:n }, () => Array(n).fill(0));
const ident = n => Array.from({ length:n }, (_, i) => Array.from({ length:n }, (_, j) => i === j ? 1 : 0));
const mmul = (A, B) => A.map(r => B[0].map((_, j) => r.reduce((s, a, k) => s + a * B[k][j], 0)));
const mvec = (A, v) => A.map(r => r.reduce((s, a, k) => s + a * v[k], 0));
const mshift = (A, l) => A.map((r, i) => r.map((a, j) => a - (i === j ? l : 0)));
const mpow = (A, k) => { let R = ident(A.length); for(let i = 0; i < k; i++) R = mmul(R, A); return R; };
const tr = A => A.reduce((s, r, i) => s + r[i], 0);
const diagM = d => d.map((x, i) => d.map((_, j) => i === j ? x : 0));
const colsToM = cols => cols[0].map((_, i) => cols.map(c => c[i]));
const maxAbsDiff = (A, B) => Math.max(...A.map((r, i) => Math.max(...r.map((x, j) => Math.abs(x - B[i][j])))));
function det(A){
  const n = A.length;
  if(n === 1) return A[0][0];
  if(n === 2) return A[0][0] * A[1][1] - A[0][1] * A[1][0];
  let s = 0;
  for(let j = 0; j < n; j++){ s += (j % 2 ? -1 : 1) * A[0][j] * det(A.slice(1).map(r => r.filter((_, k) => k !== j))); }
  return s;
}
/* forma escalonada reducida con pivote parcial */
function rref(M, tol = 1e-8){
  const A = M.map(r => r.slice()), m = A.length, n = A[0].length, piv = []; let r = 0;
  for(let c = 0; c < n && r < m; c++){
    let p = r; for(let i = r + 1; i < m; i++) if(Math.abs(A[i][c]) > Math.abs(A[p][c])) p = i;
    if(Math.abs(A[p][c]) < tol) continue;
    [A[r], A[p]] = [A[p], A[r]];
    const d = A[r][c]; A[r] = A[r].map(x => x / d);
    for(let i = 0; i < m; i++) if(i !== r){ const f = A[i][c]; if(f !== 0) A[i] = A[i].map((x, j) => x - f * A[r][j]); }
    piv.push(c); r++;
  }
  return { R:A, piv };
}
const rank = M => rref(M).piv.length;
function nullspace(M){
  const n = M[0].length, { R, piv } = rref(M), out = [];
  for(let f = 0; f < n; f++){
    if(piv.includes(f)) continue;
    const v = Array(n).fill(0); v[f] = 1; piv.forEach((c, i) => { v[c] = -R[i][f]; });
    out.push(v);
  }
  return out;
}
function inv(M){
  const n = M.length, I = ident(n), { R, piv } = rref(M.map((r, i) => [...r, ...I[i]]));
  if(piv.length < n || piv[n - 1] !== n - 1) return null;
  return R.map(r => r.slice(n));
}
/* vector «bonito»: enteros primos entre sí, primer componente no nulo positivo */
function niceVec(v){
  for(let k = 1; k <= 60; k++){
    const w = v.map(x => x * k);
    if(w.every(x => Math.abs(x - Math.round(x)) < 1e-7)){
      const g = w.reduce((g, x) => gcd(g, Math.round(x)), 0) || 1;
      let u = w.map(x => Math.round(x) / g); const f = u.find(x => x !== 0);
      if(f < 0) u = u.map(x => -x);
      return u.map(x => x === 0 ? 0 : x);
    }
  }
  const f = v.find(x => Math.abs(x) > TOL);
  return v.map(x => Math.abs(x / f) < TOL ? 0 : x / f);
}
/* polinomio característico mónico det(λI − A) = λⁿ + c₁λⁿ⁻¹ + … + cₙ (Faddeev–LeVerrier) */
function charpoly(A){
  const n = A.length, I = ident(n), c = [1]; let M = zeros(n);
  for(let k = 1; k <= n; k++){
    M = mmul(A, M).map((r, i) => r.map((x, j) => x + c[k - 1] * I[i][j]));
    c.push(-tr(mmul(A, M)) / k);

/* ---------- PASO 2: ecuación característica ---------- */
steps.push({

      const px = x => l + (x + R) / (2 * R) * (r_ - l), py_ = y => (t + b) / 2 - y / Y * (b - t) / 2;
      let g = `<line x1="${l}" y1="${py_(0)}" x2="${r_}" y2="${py_(0)}" stroke="#3a4a6b"/><line x1="${px(0)}" y1="${t}" x2="${px(0)}" y2="${b}" stroke="#26324A"/>`;

      const d0 = det(mshift(A, lam0)); g += `<line x1="${px(lam0)}" y1="${t}" x2="${px(lam0)}" y2="${b}" stroke="#F472B6" stroke-dasharray="5 4"/><circle cx="${px(lam0)}" cy="${py_(Math.max(-Y, Math.min(Y, d0)))}" r="5" fill="#F472B6"/>`;
      g += `<text x="${l}" y="${t + 8}" fill="#8B96AD" font-size="10.5">det(A − λI)</text><text x="${r_}" y="${b + 14}" fill="#8B96AD" font-size="10.5" text-anchor="end">λ</text>`;

/* ---------- PASO 3: ejemplo 2×2 ---------- */
steps.push({

/* ---------- PASO 4: diagonalización ---------- */
steps.push({
  name:'Diagonalización: P⁻¹AP = D', short:'4 Diagonalización', shape:'AP = PD ⇔ P⁻¹AP = D',
  desc:'Si A tiene <b>n autovectores linealmente independientes</b>, los colocamos por columnas en P y sus autovalores en la diagonal de D (en el mismo orden). Columna a columna: A·vⱼ = λⱼ·vⱼ, es decir <b>AP = PD</b>; como P es invertible, P⁻¹AP = D. La página construye P y D y lo comprueba numéricamente.',
  render(stage){

  const s = steps[current];
  $('#stepCount').textContent = current === 0 ? 'Introducción' : `Paso ${current} de ${steps.length - 1}`;
  $('#stepTitle').textContent = s.name;
  $('#stepDesc').innerHTML = s.desc;
  const chip = $('#shapeChip');
  if(s.shape){ chip.style.display = ''; chip.innerHTML = `<b>${s.shape}</b>`; } else chip.style.display = 'none';
  const stage = $('#stage'); stage.innerHTML = '';
  s.render(stage);
  const btns = document.querySelectorAll('.trail button');
  btns.forEach((b, idx) => b.classList.toggle('active', idx === current));
  if(btns[current]) btns[current].scrollIntoView({ block:'nearest', inline:'center' });
  $('#prevBtn').disabled = current === 0;
  $('#nextBtn').textContent = current === steps.length - 1 ? 'Volver al inicio ↺' : 'Siguiente →';
  window.scrollTo(0, 0);
}
$('#prevBtn').addEventListener('click', () => { if(current > 0) goTo(current - 1); });
$('#nextBtn').addEventListener('click', () => goTo(current === steps.length - 1 ? 0 : current + 1));
document.addEventListener('keydown', e => {
  if(e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT')) return;
  if(e.key === 'ArrowRight') $('#nextBtn').click();
  if(e.key === 'ArrowLeft') $('#prevBtn').click();
});
renderTrail(); goTo(0);
</script>
</body>
</html>
