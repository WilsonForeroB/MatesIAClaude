<style>

  .panel-title.c1{ color:var(--viu); } .panel-title.c2{ color:var(--cyan); } .panel-title.c3{ color:var(--pink); }

  /* filas de preguntas (sorter) */
  .qrow{ background:var(--panel-2); border:1px solid var(--line); border-radius:12px; padding:12px 14px; display:flex; gap:12px; align-items:center; justify-content:space-between; flex-wrap:wrap; }

  .qrow.done{ border-color:#3a4a6b; }

  select{ font-family:var(--font-mono); font-size:13px; background:var(--panel-2); color:var(--text); border:1px solid var(--line); border-radius:8px; padding:8px 10px; max-width:100%; }
  select:focus,button:focus-visible{ outline:2px solid var(--cyan); outline-offset:1px; }

  .cards6{ display:grid; grid-template-columns:repeat(auto-fit,minmax(230px,1fr)); gap:10px; width:100%; }
  .ccard{ background:var(--panel-2); border:1px solid var(--line); border-radius:12px; padding:12px 14px; display:flex; flex-direction:column; gap:6px; }
  .ccard .sym{ font-family:var(--font-mono); font-size:22px; color:var(--viu); font-weight:600; }
  .ccard .nm{ font-family:var(--font-head); font-weight:600; font-size:14px; }

  .strip{ display:flex; flex-direction:column; gap:4px; align-items:center; overflow-x:auto; max-width:100%; }
  .srow{ display:flex; gap:3px; align-items:center; }

  .srow > div{ flex:0 0 40px; width:40px; text-align:center; font-family:var(--font-mono); font-size:12px; padding:4px 0; border-radius:6px; background:var(--panel-2); border:1px solid var(--line); }
  .srow > div.v1{ background:var(--viu-dim); border-color:var(--viu); color:var(--viu); }

  .flow{ display:flex; flex-wrap:wrap; gap:8px; align-items:center; justify-content:center; }

  .fnode:hover{ border-color:var(--viu); } .fnode small{ display:block; color:var(--muted); font-size:10.5px; }
  .farrow{ color:var(--muted); }

  svg text{ font-family:var(--font-mono); }
  @media (max-width:640px){ .viz-row{ gap:16px; } table.dt th,table.dt td{ padding:5px 7px; } }
  @media (prefers-reduced-motion:reduce){ *{ transition:none !important; } }

</header>

    <div class="step-meta">

        <p class="step-count" id="stepCount"></p>

</footer>

<script>
/* =========================================================
   Utilidades
========================================================= */
const $ = s => document.querySelector(s);
let timers = [];
function clearTimers(){ timers.forEach(t => clearInterval(t)); timers = []; }
function el(tag, cls, html){ const e = document.createElement(tag); if(cls) e.className = cls; if(html != null) e.innerHTML = html; return e; }
const V = x => x ? 1 : 0;
const vtag = x => `<span class="tv v${V(x)}">${V(x)}</span>`;
const lower1 = s => s.charAt(0).toLowerCase() + s.slice(1);

function py(code){
  return code.replace(/&/g, '&amp;').replace(/</g, '&lt;').split('\n').map(l => {
    const k = l.indexOf('#'); let body = l, cm = '';
    if(k >= 0){ body = l.slice(0, k); cm = '<span class="cm">' + l.slice(k) + '</span>'; }
    body = body.replace(/\b(import|from|as|print|def|return|not|and|or|for|in)\b/g, '<span class="kw">$1</span>');
    return body + cm;
  }).join('\n');
}
function codeBox(code){ const p = el('pre', 'code'); p.innerHTML = py(code); return p; }

/* ---------- lógica: todas las combinaciones, en el orden de las diapositivas (1,1 / 1,0 / 0,1 / 0,0) ---------- */
function combos(vars){
  const n = vars.length, out = [];
  for(let i = 0; i < (1 << n); i++){ const e = {}; vars.forEach((v, k) => e[v] = !((i >> (n-1-k)) & 1)); out.push(e); }
  return out;
}
const sameEnv = (a, b) => Object.keys(a).every(k => a[k] === b[k]);
const OPS = {
  and: { sym:'∧', f:(p, q) => p && q },
  or:  { sym:'∨', f:(p, q) => p || q },
  xor: { sym:'⊻', f:(p, q) => p !== q },
  imp: { sym:'→', f:(p, q) => !p || q },
  iff: { sym:'↔', f:(p, q) => p === q }
};
function classify(f, vars){
  const vals = combos(vars).map(f);
  return vals.every(Boolean) ? 'T' : (vals.every(v => !v) ? 'C' : 'K');
}
const CLS = { T:'Tautología', C:'Contradicción', K:'Contingencia' };

/* tabla de verdad viva: highlight de la fila actual; clic en fila = elegir esos valores */
function makeTable(vars, cols, onPick, rowClass){
  const wrap = el('div', 'tbl-wrap'), t = el('table', 'dt'); wrap.appendChild(t);
  const head = el('tr'); const ths = [];
  vars.forEach(v => head.appendChild(el('th', null, v)));
  cols.forEach(c => { const th = el('th', c.res === false ? '' : 'res', c.h); ths.push(th); head.appendChild(th); });
  t.appendChild(head);
  const rows = combos(vars).map(env => {
    const tr = el('tr', onPick ? 'pick' : ''); tr._env = env;
    vars.forEach(v => tr.appendChild(el('td', null, vtag(env[v]))));
    cols.forEach(c => tr.appendChild(el('td', null, vtag(c.f(env)))));
    if(rowClass){ const rc = rowClass(env); if(rc) tr.classList.add(rc); }
    if(onPick) tr.addEventListener('click', () => onPick(env));
    t.appendChild(tr); return tr;
  });
  return { el: wrap, setHead:(i, txt) => { ths[i].innerHTML = txt; }, set: env => rows.forEach(r => r.classList.toggle('hl', !!env && sameEnv(r._env, env))) };
}

/* interruptor 1/0 */
function toggleBtn(name, init, cb, subs){
  let val = init; const b = el('button', 'tg'); b.type = 'button';
  function draw(){
    b.className = 'tg ' + (val ? 'on' : 'off');
    b.innerHTML = `<b>${name} = ${V(val)}</b><small>${val ? (subs ? subs[0] : 'verdadera') : (subs ? subs[1] : 'falsa')}</small>`;
    b.setAttribute('aria-pressed', val); b.setAttribute('aria-label', `${name} vale ${V(val)}`);
  }
  b.addEventListener('click', () => { val = !val; draw(); cb(val); });
  draw();
  return { el:b, get:() => val, set:v => { val = v; draw(); } };
}

/* ---------- circuitos (analogía física) ---------- */
function circuit(mode, p, q){
  const on = '#E55015', off = '#3a4a6b';
  const w = (x1, y1, x2, y2, lit) => `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${lit ? on : off}" stroke-width="3.5" stroke-linecap="round"/>`;
  const dotc = (x, y, lit) => `<circle cx="${x}" cy="${y}" r="3.6" fill="${lit ? on : off}"/>`;
  const sw = (x, y, closed, lit, lab) => w(x, y, closed ? x+60 : x+54, closed ? y : y-26, closed && lit) + dotc(x, y, lit) + dotc(x+60, y, closed && lit) +
    `<text x="${x+30}" y="${y+22}" text-anchor="middle" font-size="12" fill="#8B96AD">${lab}=${V(closed)}</text>`;
  const lamp = (cx, cy, lit) => `<circle cx="${cx}" cy="${cy}" r="17" fill="${lit ? on : '#17233A'}" stroke="${lit ? '#ffb08a' : off}" stroke-width="2.5"/>` +
    (lit ? [0,45,90,135,180,225,270,315].map(a => { const r = a*Math.PI/180; return `<line x1="${cx+23*Math.cos(r)}" y1="${cy+23*Math.sin(r)}" x2="${cx+31*Math.cos(r)}" y2="${cy+31*Math.sin(r)}" stroke="${on}" stroke-width="2.5" stroke-linecap="round"/>`; }).join('') : '') +
    `<line x1="${cx-9}" y1="${cy-9}" x2="${cx+9}" y2="${cy+9}" stroke="${lit ? '#fff' : off}" stroke-width="2"/><line x1="${cx+9}" y1="${cy-9}" x2="${cx-9}" y2="${cy+9}" stroke="${lit ? '#fff' : off}" stroke-width="2"/>`;
  const batt = (x, y1, y2) => `<line x1="${x-9}" y1="${y1}" x2="${x+9}" y2="${y1}" stroke="#E7ECF5" stroke-width="3"/><line x1="${x-5}" y1="${y1+8}" x2="${x+5}" y2="${y1+8}" stroke="#E7ECF5" stroke-width="3"/>`;
  let s = '', lit = false;
  if(mode === 'and'){
    lit = p && q;
    s += w(24,60,96,60,true) + sw(96,60,p,true,'p') + w(156,60,228,60,p) + sw(228,60,q,p,'q') + w(288,60,352,60,lit) + lamp(372,60,lit);
    s += w(372,77,372,108,lit) + w(372,108,24,108,lit) + w(24,108,24,72,lit) + batt(24,60);
  } else if(mode === 'or'){
    lit = p || q;
    s += w(24,70,96,70,true) + w(96,40,96,100,true) + w(96,40,150,40,true) + sw(150,40,p,true,'p') + w(210,40,300,40,p) +
         w(96,100,150,100,true) + sw(150,100,q,true,'q') + w(210,100,300,100,q) + w(300,40,300,100,lit) + w(300,70,355,70,lit) + lamp(372,70,lit);
    s += w(372,87,372,128,lit) + w(372,128,24,128,lit) + w(24,128,24,82,lit) + batt(24,70);
  } else {
    lit = p !== q;
    const pt = [140,40], pb = [140,100], qt = [280,40], qb = [280,100];
    s += w(24,70,110,70,true) + dotc(110,70,true) + dotc(310,70,lit) + w(310,70,355,70,lit) + lamp(372,70,lit);
    s += w(110,70,140,p ? 40 : 100,true);
    s += w(140,40,280,100,p) + w(140,100,280,40,!p);
    s += w(310,70,280,q ? 40 : 100,lit);
    s += [pt,pb,qt,qb].map(c => dotc(c[0], c[1], false)).join('');
    s += `<text x="110" y="124" text-anchor="middle" font-size="12" fill="#8B96AD">p=${V(p)}</text><text x="310" y="124" text-anchor="middle" font-size="12" fill="#8B96AD">q=${V(q)}</text>`;

function tfQuiz(items){
  const box = el('div', 'viz-col'); box.style.width = '100%';
  items.forEach(it => {
    const row = el('div', 'qrow'); const tx = el('div', 'tx', it.q); const opts = el('div', 'opts'); const fb = el('div', 'fb');
    [['Verdadero (1)', true], ['Falso (0)', false]].forEach(([lab, val]) => {
      const b = el('button', 'toggle-btn', lab); b.type = 'button';
      b.addEventListener('click', () => {
        const ok = val === it.ans;
        opts.querySelectorAll('button').forEach(x => x.classList.remove('good', 'bad'));
        b.classList.add(ok ? 'good' : 'bad');
        fb.innerHTML = (ok ? '<b class="ok">✔ Correcto.</b> ' : '<b class="no">✘ Casi.</b> ') + it.why;
        row.classList.add('done');
      });
      opts.appendChild(b);
    });
    row.append(tx, opts, fb); box.appendChild(row);
  });
  return box;
}

/* clasificador por filas */
function sortRows(items, options){
  const box = el('div', 'viz-col'); box.style.width = '100%'; box.style.alignItems = 'stretch';
  const stats = el('div', 'stats'); const sOk = el('div', 'stat c1', '<span class="l">acertadas</span><span class="v">0</span>'), sTot = el('div', 'stat', `<span class="l">total</span><span class="v">${items.length}</span>`);
  stats.append(sOk, sTot); box.appendChild(stats);
  const answered = new Set(); let good = 0;
  items.forEach((it, idx) => {
    const row = el('div', 'qrow'); const tx = el('div', 'tx', it.t); const opts = el('div', 'opts'); const fb = el('div', 'fb');
    options.forEach(o => {
      const b = el('button', 'toggle-btn', o.label); b.type = 'button';
      b.addEventListener('click', () => {
        const ok = o.k === it.a;
        if(ok && !answered.has(idx)){ answered.add(idx); good++; sOk.querySelector('.v').textContent = good; }
        opts.querySelectorAll('button').forEach(x => x.classList.remove('good', 'bad'));
        b.classList.add(ok ? 'good' : 'bad');
        fb.innerHTML = (ok ? '<b class="ok">✔ </b>' : '<b class="no">✘ Prueba otra vez. </b>') + (ok ? it.why : (it.hint || 'Piensa qué se puede afirmar de ella.'));
        row.classList.toggle('done', ok);
      });
      opts.appendChild(b);
    });
    row.append(tx, opts, fb); box.appendChild(row);
  });
  return box;
}

  xnor: { n:'XNOR', sym:'x ↔ y', f:(a, b) => a === b, fe:'f(x,y) = x · y + x̄ · ȳ', body:'M0 0 Q40 0 70 30 Q40 60 0 60 Q18 30 0 0 Z', w:70, bub:true, two:true, extra:'M-9 0 Q9 30 -9 60' }

const ON = '#E55015', OFF = '#3a4a6b';
const wire = (pts, lit) => `<polyline points="${pts.map(p => p.join(',')).join(' ')}" fill="none" stroke="${lit ? ON : OFF}" stroke-width="3.2" stroke-linejoin="round" stroke-linecap="round"/>`;
const lampS = (x, y, lit) => `<circle cx="${x}" cy="${y}" r="10" fill="${lit ? ON : '#17233A'}" stroke="${lit ? '#ffb08a' : OFF}" stroke-width="2"/>`;
const label = (x, y, t, anchor) => `<text x="${x}" y="${y}" fill="#E7ECF5" font-size="12" text-anchor="${anchor || 'middle'}">${t}</text>`;
function ports(type, gx, gy){
  const G = GATES[type], out = [gx + G.w + (G.bub ? 10 : 0), gy + 30];
  return { ins:G.two ? [[gx, gy + 15], [gx, gy + 45]] : [[gx, gy + 30]], out };
}
function gateS(type, gx, gy, outVal){
  const G = GATES[type];
  let s = `<g transform="translate(${gx},${gy})"><path d="${G.body}" fill="${outVal ? 'rgba(229,80,21,.25)' : '#17233A'}" stroke="${outVal ? ON : '#8B96AD'}" stroke-width="2.4"/>`;
  if(G.extra) s += `<path d="${G.extra}" fill="none" stroke="${outVal ? ON : '#8B96AD'}" stroke-width="2.4"/>`;
  if(G.bub) s += `<circle cx="${G.w + 5}" cy="30" r="5" fill="#0B1220" stroke="${outVal ? ON : '#8B96AD'}" stroke-width="2.2"/>`;
  s += `<text x="${G.w/2 - 6}" y="34" fill="#8B96AD" font-size="11" text-anchor="middle">${G.n}</text></g>`;

}

      const rows = combos(['x', 'y', 'z']), ones = rows.filter(e => ev(e.x, e.y, e.z)).length;
      const e1 = `${GATES[g1].n}(x, y)`, e2 = negz ? 'NOT(z)' : 'z';
      out.innerHTML = `<b>f(x, y, z) = ${GATES[g2].n}( ${e1} , ${e2} )</b><br>Con x=${V(x)}, y=${V(y)}, z=${V(z)} → <span class="${C ? 'ok' : 'no'}">${V(C)}</span><br>Da 1 en <b>${ones}</b> de 8 casos ${ones === 8 ? '(¡siempre 1: tautología!)' : (ones === 0 ? '(siempre 0: contradicción)' : '(contingente)')}`;
      out.classList.toggle('win', C);
      tb.innerHTML = ''; const mt = makeTable(['x', 'y', 'z'], [{ h:'f(x,y,z)', f:e => ev(e.x, e.y, e.z) }], env => { x = env.x; y = env.y; z = env.z; tx.set(x); ty.set(y); tz.set(z); upd(); }); mt.set({ x, y, z }); tb.appendChild(mt.el);
    }
    k2.forEach(k => { const a = chipBtn(GATES[k].n, false, () => { g1 = k; upd(); }); a._k = k; b1.appendChild(a); const c = chipBtn(GATES[k].n, false, () => { g2 = k; upd(); }); c._k = k; b2.appendChild(c); });
    stage.append(el('div', 'panel-title c1', 'Puerta 1 (recibe x e y)'), b1, el('div', 'panel-title c2', 'Puerta final (recibe A y z)'), b2, (() => { const r = el('div', 'btn-row'); r.appendChild(nb); return r; })(), sw, box, out, tb);
    stage.appendChild(el('p', 'pad-note', 'Reto: encuentra un circuito que dé 1 solo en 1 de los 8 casos (¿y en exactamente 3?). Pregunta: con este constructor, ¿puede la salida ser siempre 1 o siempre 0? Razona por qué no.'));
    upd();
  }
});

/* ---------- PASO 5: medio sumador ---------- */
steps.push({
  name:'Aplicación: un medio sumador suma bits', short:'5 Medio sumador', shape:'suma = x ⊻ y · acarreo = x · y',
  desc:'Con solo <b>dos puertas</b> (XOR y AND) se suman dos bits. La XOR da el bit de la suma y la AND da el acarreo. Así las puertas lógicas se convierten en <b>aritmética</b>: es la pieza más pequeña de la unidad de cálculo de un procesador.',
  render(stage){
    let a = true, b = true; const sw = el('div', 'btn-row'), box = el('div'), out = el('div', 'formula'), tb = el('div');
    const ta = toggleBtn('a', a, v => { a = v; upd(); }, ['1', '0']), tb2 = toggleBtn('b', b, v => { b = v; upd(); }, ['1', '0']); sw.append(ta.el, tb2.el);
    function upd(){
      const S = a !== b, Cy = a && b, px = ports('xor', 150, 15), pa = ports('and', 150, 105);
      let s = wire([[14, 30], [60, 30], [60, px.ins[0][1]], px.ins[0]], a) + wire([[60, 30], [60, pa.ins[0][1]], pa.ins[0]], a);
      s += wire([[14, 150], [90, 150], [90, px.ins[1][1]], px.ins[1]], b) + wire([[90, 150], [90, pa.ins[1][1]], pa.ins[1]], b);
      s += label(10, 24, 'a', 'start') + label(10, 144, 'b', 'start') + gateS('xor', 150, 15, S) + gateS('and', 150, 105, Cy);
      s += wire([px.out, [330, px.out[1]]], S) + lampS(342, px.out[1], S) + label(342, px.out[1] + 28, `suma=${V(S)}`, 'middle');
      s += wire([pa.out, [330, pa.out[1]]], Cy) + lampS(342, pa.out[1], Cy) + label(342, pa.out[1] + 28, `acarreo=${V(Cy)}`, 'middle');
      box.innerHTML = svgBox(420, 190, s, `Medio sumador: suma ${V(S)}, acarreo ${V(Cy)}`);
      const total = V(a) + V(b);
      out.innerHTML = `${V(a)} + ${V(b)} = <b>${total}</b> en decimal = <b>${V(Cy)}${V(S)}</b> en binario<br>suma = a ⊻ b = ${V(S)} · acarreo = a · b = ${V(Cy)}`; out.classList.toggle('win', true);
      tb.innerHTML = ''; const mt = makeTable(['a', 'b'], [{ h:'acarreo', f:e => e.a && e.b, res:false }, { h:'suma', f:e => e.a !== e.b }], env => { a = env.a; b = env.b; ta.set(a); tb2.set(b); upd(); }); mt.set({ a, b }); tb.appendChild(mt.el);
    }
    stage.append(sw, box, out, tb);
    stage.appendChild(el('p', 'pad-note', 'Cuando 1 + 1, la suma da 0 y el acarreo 1: es decir, <b>10</b> en binario (el 2). Combinando dos medios sumadores y una OR se obtiene un sumador completo (con acarreo de entrada); encadenando sumadores completos se construyen sumadores de 8, 32 o 64 bits.'));
    upd();
  }
});

/* ---------- PASO 6: resumen ---------- */
steps.push({
  name:'Resumen y código', short:'6 Resumen', shape:null,
  desc:'Una puerta es una función booleana; un circuito es una composición de puertas. Las tablas de abajo las calcula la página.',
  render(stage){
    const T = el('div', 'tbl-wrap'); T.innerHTML = `<table class="dt"><tr><th>Puerta</th><th>f(x, y)</th><th>(0,0)</th><th>(0,1)</th><th>(1,0)</th><th>(1,1)</th></tr>${Object.keys(GATES).filter(k => GATES[k].two).map(k => `<tr><td>${GATES[k].n}</td><td>${GATES[k].fe.split('=')[1].trim()}</td>${[[0, 0], [0, 1], [1, 0], [1, 1]].map(([p, q]) => `<td>${vtag(GATES[k].f(!!p, !!q))}</td>`).join('')}</tr>`).join('')}<tr><td>NOT</td><td>x̄</td><td colspan="2">x = 0 → ${vtag(true)}</td><td colspan="2">x = 1 → ${vtag(false)}</td></tr></table>`;
    stage.appendChild(T);
    stage.appendChild(el('div', 'panel-title c1', 'En Python: el circuito de la clase y el medio sumador'));
    stage.appendChild(codeBox(`def circuito(x, y, z):          # f(x,y,z) = (x + y) · z'
    A = x | y                    # puerta OR
    B = 1 - z                    # puerta NOT
    return A & B                 # puerta AND

def medio_sumador(a, b):
    return a ^ b, a & b          # (suma, acarreo)

print(circuito(1, 0, 0), circuito(1, 1, 1))
print(medio_sumador(1, 1))`));
    stage.appendChild(el('div', 'viz-label', 'Salida del programa (calculada aquí con las mismas reglas):'));
    const circ = (x, y, z) => ((x | y) & (1 - z)); stage.appendChild(codeBox(`${circ(1, 0, 0)} ${circ(1, 1, 1)}\n(${1 ^ 1}, ${1 & 1})`));
    stage.appendChild(el('div', 'panel-title c3', 'Errores frecuentes'));
    const errs = el('div', 'bio-text'); errs.innerHTML = `<p><b>1.</b> Confundir OR con XOR: OR(1,1) = 1, XOR(1,1) = 0.</p>
      <p><b>2.</b> Olvidar el círculo: una puerta con círculo en la salida es la <i>negada</i> (NAND ≠ AND).</p>
      <p><b>3.</b> Leer el circuito de izquierda a derecha sin fijarse en los NOT intermedios: un NOT en z cambia todo el resultado.</p>
      <p><b>4.</b> Creer que 1 + 1 = 1 también en el sumador: en aritmética binaria 1 + 1 = 10 (suma 0 y acarreo 1).</p>`;
    stage.appendChild(errs); stage.appendChild(qcards(QUESTIONS));
  }
});

/* =========================================================
   Motor de navegación (idéntico en todas las actividades)
========================================================= */
let current = 0;
function renderTrail(){
  const tr = $('#trail'); tr.innerHTML = '';
  steps.forEach((s, i) => { const b = el('button', null, s.short); b.type = 'button'; b.addEventListener('click', () => goTo(i)); tr.appendChild(b); });
}
function goTo(i){
  current = i;
  clearTimers();
  const s = steps[current];
  $('#stepCount').textContent = current === 0 ? 'Introducción' : `Paso ${current} de ${steps.length - 1}`;
  $('#stepTitle').textContent = s.name;
  $('#stepDesc').innerHTML = s.desc;
  const chip = $('#shapeChip');
  if(s.shape){ chip.style.display = ''; chip.innerHTML = `<b>${s.shape}</b>`; } else chip.style.display = 'none';
  const stage = $('#stage'); stage.innerHTML = '';
  s.render(stage);
  const btns = document.querySelectorAll('.trail button');
  btns.forEach((b, idx) => b.classList.toggle('active', idx === current));
  if(btns[current]) btns[current].scrollIntoView({ block:'nearest', inline:'center' });
  $('#prevBtn').disabled = current === 0;
  $('#nextBtn').textContent = current === steps.length - 1 ? 'Volver al inicio ↺' : 'Siguiente →';
  window.scrollTo(0, 0);
}
$('#prevBtn').addEventListener('click', () => { if(current > 0) goTo(current - 1); });
$('#nextBtn').addEventListener('click', () => goTo(current === steps.length - 1 ? 0 : current + 1));
document.addEventListener('keydown', e => {
  if(e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT')) return;
  if(e.key === 'ArrowRight') $('#nextBtn').click();
  if(e.key === 'ArrowLeft') $('#prevBtn').click();
});
renderTrail(); goTo(0);
</script>
