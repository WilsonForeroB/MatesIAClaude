</header>

<main>

    <div class="step-meta">
      <div>
        <p class="step-count" id="stepCount"></p>
        <h2 class="step-title" id="stepTitle"></h2>

</footer>

<script>
/* =========================================================
   Utilidades
========================================================= */
const $ = s => document.querySelector(s);
let timers = [];
function clearTimers(){ timers.forEach(t => clearInterval(t)); timers = []; }
function el(tag, cls, html){ const e = document.createElement(tag); if(cls) e.className = cls; if(html != null) e.innerHTML = html; return e; }
const V = x => x ? 1 : 0;
const vtag = x => `<span class="tv v${V(x)}">${V(x)}</span>`;
const lower1 = s => s.charAt(0).toLowerCase() + s.slice(1);

function py(code){
  return code.replace(/&/g, '&amp;').replace(/</g, '&lt;').split('\n').map(l => {
    const k = l.indexOf('#'); let body = l, cm = '';
    if(k >= 0){ body = l.slice(0, k); cm = '<span class="cm">' + l.slice(k) + '</span>'; }
    body = body.replace(/\b(import|from|as|print|def|return|not|and|or|for|in)\b/g, '<span class="kw">$1</span>');
    return body + cm;
  }).join('\n');
}
function codeBox(code){ const p = el('pre', 'code'); p.innerHTML = py(code); return p; }

/* ---------- lógica: todas las combinaciones, en el orden de las diapositivas (1,1 / 1,0 / 0,1 / 0,0) ---------- */
function combos(vars){
  const n = vars.length, out = [];
  for(let i = 0; i < (1 << n); i++){ const e = {}; vars.forEach((v, k) => e[v] = !((i >> (n-1-k)) & 1)); out.push(e); }
  return out;
}
const sameEnv = (a, b) => Object.keys(a).every(k => a[k] === b[k]);
const OPS = {
  and: { sym:'∧', f:(p, q) => p && q },
  or:  { sym:'∨', f:(p, q) => p || q },
  xor: { sym:'⊻', f:(p, q) => p !== q },
  imp: { sym:'→', f:(p, q) => !p || q },
  iff: { sym:'↔', f:(p, q) => p === q }
};
function classify(f, vars){
  const vals = combos(vars).map(f);
  return vals.every(Boolean) ? 'T' : (vals.every(v => !v) ? 'C' : 'K');
}
const CLS = { T:'Tautología', C:'Contradicción', K:'Contingencia' };

/* tabla de verdad viva: highlight de la fila actual; clic en fila = elegir esos valores */
function makeTable(vars, cols, onPick, rowClass){
  const wrap = el('div', 'tbl-wrap'), t = el('table', 'dt'); wrap.appendChild(t);
  const head = el('tr'); const ths = [];
  vars.forEach(v => head.appendChild(el('th', null, v)));
  cols.forEach(c => { const th = el('th', c.res === false ? '' : 'res', c.h); ths.push(th); head.appendChild(th); });
  t.appendChild(head);
  const rows = combos(vars).map(env => {
    const tr = el('tr', onPick ? 'pick' : ''); tr._env = env;
    vars.forEach(v => tr.appendChild(el('td', null, vtag(env[v]))));
    cols.forEach(c => tr.appendChild(el('td', null, vtag(c.f(env)))));
    if(rowClass){ const rc = rowClass(env); if(rc) tr.classList.add(rc); }
    if(onPick) tr.addEventListener('click', () => onPick(env));
    t.appendChild(tr); return tr;
  });
  return { el: wrap, setHead:(i, txt) => { ths[i].innerHTML = txt; }, set: env => rows.forEach(r => r.classList.toggle('hl', !!env && sameEnv(r._env, env))) };
}

/* interruptor 1/0 */
function toggleBtn(name, init, cb, subs){
  let val = init; const b = el('button', 'tg'); b.type = 'button';
  function draw(){
    b.className = 'tg ' + (val ? 'on' : 'off');
    b.innerHTML = `<b>${name} = ${V(val)}</b><small>${val ? (subs ? subs[0] : 'verdadera') : (subs ? subs[1] : 'falsa')}</small>`;
    b.setAttribute('aria-pressed', val); b.setAttribute('aria-label', `${name} vale ${V(val)}`);
  }
  b.addEventListener('click', () => { val = !val; draw(); cb(val); });
  draw();
  return { el:b, get:() => val, set:v => { val = v; draw(); } };
}

/* ---------- circuitos (analogía física) ---------- */
function circuit(mode, p, q){
  const on = '#E55015', off = '#3a4a6b';
  const w = (x1, y1, x2, y2, lit) => `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${lit ? on : off}" stroke-width="3.5" stroke-linecap="round"/>`;
  const dotc = (x, y, lit) => `<circle cx="${x}" cy="${y}" r="3.6" fill="${lit ? on : off}"/>`;
  const sw = (x, y, closed, lit, lab) => w(x, y, closed ? x+60 : x+54, closed ? y : y-26, closed && lit) + dotc(x, y, lit) + dotc(x+60, y, closed && lit) +
    `<text x="${x+30}" y="${y+22}" text-anchor="middle" font-size="12" fill="#8B96AD">${lab}=${V(closed)}</text>`;
  const lamp = (cx, cy, lit) => `<circle cx="${cx}" cy="${cy}" r="17" fill="${lit ? on : '#17233A'}" stroke="${lit ? '#ffb08a' : off}" stroke-width="2.5"/>` +
    (lit ? [0,45,90,135,180,225,270,315].map(a => { const r = a*Math.PI/180; return `<line x1="${cx+23*Math.cos(r)}" y1="${cy+23*Math.sin(r)}" x2="${cx+31*Math.cos(r)}" y2="${cy+31*Math.sin(r)}" stroke="${on}" stroke-width="2.5" stroke-linecap="round"/>`; }).join('') : '') +
    `<line x1="${cx-9}" y1="${cy-9}" x2="${cx+9}" y2="${cy+9}" stroke="${lit ? '#fff' : off}" stroke-width="2"/><line x1="${cx+9}" y1="${cy-9}" x2="${cx-9}" y2="${cy+9}" stroke="${lit ? '#fff' : off}" stroke-width="2"/>`;
  const batt = (x, y1, y2) => `<line x1="${x-9}" y1="${y1}" x2="${x+9}" y2="${y1}" stroke="#E7ECF5" stroke-width="3"/><line x1="${x-5}" y1="${y1+8}" x2="${x+5}" y2="${y1+8}" stroke="#E7ECF5" stroke-width="3"/>`;
  let s = '', lit = false;
  if(mode === 'and'){
    lit = p && q;
    s += w(24,60,96,60,true) + sw(96,60,p,true,'p') + w(156,60,228,60,p) + sw(228,60,q,p,'q') + w(288,60,352,60,lit) + lamp(372,60,lit);
    s += w(372,77,372,108,lit) + w(372,108,24,108,lit) + w(24,108,24,72,lit) + batt(24,60);
  } else if(mode === 'or'){
    lit = p || q;
    s += w(24,70,96,70,true) + w(96,40,96,100,true) + w(96,40,150,40,true) + sw(150,40,p,true,'p') + w(210,40,300,40,p) +
         w(96,100,150,100,true) + sw(150,100,q,true,'q') + w(210,100,300,100,q) + w(300,40,300,100,lit) + w(300,70,355,70,lit) + lamp(372,70,lit);
    s += w(372,87,372,128,lit) + w(372,128,24,128,lit) + w(24,128,24,82,lit) + batt(24,70);
  } else {
    lit = p !== q;
    const pt = [140,40], pb = [140,100], qt = [280,40], qb = [280,100];
    s += w(24,70,110,70,true) + dotc(110,70,true) + dotc(310,70,lit) + w(310,70,355,70,lit) + lamp(372,70,lit);
    s += w(110,70,140,p ? 40 : 100,true);
    s += w(140,40,280,100,p) + w(140,100,280,40,!p);
    s += w(310,70,280,q ? 40 : 100,lit);
    s += [pt,pb,qt,qb].map(c => dotc(c[0], c[1], false)).join('');
    s += `<text x="110" y="124" text-anchor="middle" font-size="12" fill="#8B96AD">p=${V(p)}</text><text x="310" y="124" text-anchor="middle" font-size="12" fill="#8B96AD">q=${V(q)}</text>`;

/* ---------- algoritmos de la clase, con contadores ---------- */
function dotAlg(u, v, c){ let p = u[0] * v[0]; c.mul++; for(let k = 1; k < u.length; k++){ p += u[k] * v[k]; c.mul++; c.add++; } return p; }
function matAddAlg(A, B, c){ const n = A.length, C = A.map(r => r.map(() => 0)); for(let i = 0; i < n; i++) for(let j = 0; j < n; j++){ C[i][j] = A[i][j] + B[i][j]; c.add++; } return C; }
function matMulAlg(A, B, c){ const n = A.length, C = A.map(r => r.map(() => 0)); for(let i = 0; i < n; i++) for(let j = 0; j < n; j++) for(let k = 0; k < n; k++){ C[i][j] += A[i][k] * B[k][j]; c.mul++; c.add++; } return C; }
function triAlg(A, b, c){ const n = A.length, X = Array(n).fill(0); for(let i = 0; i < n; i++){ X[i] = b[i]; for(let j = 0; j < i; j++){ X[i] -= A[i][j] * X[j]; c.mul++; c.add++; } X[i] /= A[i][i]; c.div++; } return X; }
const mkVec = n => Array.from({ length:n }, () => Math.round(rnd8() * 8 - 4)), mkMat = n => Array.from({ length:n }, () => mkVec(n));
const ALGS = [
  { k:'dot', n:'Producto escalar u · v', th:n => 2*n - 1, thTxt:'2n − 1', cls:'O(n) lineal', run:(n, c) => { const u = mkVec(n), v = mkVec(n); const r = dotAlg(u, v, c); return r === u.reduce((s, x, i) => s + x * v[i], 0); } },
  { k:'add', n:'Suma de matrices A + B', th:n => n*n, thTxt:'n²', cls:'O(n²) cuadrático', run:(n, c) => { const A = mkMat(n), B = mkMat(n); const C = matAddAlg(A, B, c); return C.every((r, i) => r.every((x, j) => x === A[i][j] + B[i][j])); } },
  { k:'mul', n:'Producto de matrices A · B', th:n => 2*n*n*n, thTxt:'2n³', cls:'O(n³) cúbico', run:(n, c) => { const A = mkMat(n), I = A.map((_, i) => A.map((_, j) => i === j ? 1 : 0)); const C = matMulAlg(A, I, new Object({ mul:0, add:0 })); matMulAlg(A, I, c); return C.every((r, i) => r.every((x, j) => x === A[i][j])); } },
  { k:'tri', n:'Sistema triangular AX = B', th:n => n*n, thTxt:'n²', cls:'O(n²) cuadrático', run:(n, c) => { const A = mkMat(n).map((r, i) => r.map((x, j) => j > i ? 0 : (j === i ? (Math.abs(x) + 1) : x))), b = mkVec(n); const X = triAlg(A, b, c); return A.every((r, i) => Math.abs(r.reduce((s, x, j) => s + x * X[j], 0) - b[i]) < 1e-6); } }
];

      { n:'n²', f:n => n * n, c:'#E55015' }, { n:'n³', f:n => n * n * n, c:'#fb923c' }, { n:'2ⁿ', f:n => Math.pow(2, n), c:'#F472B6' }, { n:'n!', f:n => Math.exp(lnFact(n)), c:'#e879f9' }
    ];
    let n = 20; const sl = el('input'); sl.type = 'range'; sl.min = 2; sl.max = 60; sl.value = n; sl.style.accentColor = 'var(--viu)'; sl.style.width = 'min(320px,70vw)'; sl.setAttribute('aria-label', 'Tamaño n');
    const ctrl = el('div', 'btn-row'); ctrl.append(el('span', 'viz-label', 'n ='), sl, el('span', 'viz-label', '20')); const chart = el('div'), tbl = el('div', 'tbl-wrap'), note = el('div', 'formula');
    function upd(){
      n = +sl.value; ctrl.lastChild.textContent = n; const W = 520, H = 230, X = k => 40 + (k - 1) / 59 * (W - 60), Y = v => H - 25 - Math.min(Math.max(Math.log10(Math.max(v, 1)), 0), 85) / 85 * (H - 45);
      let s = `<line x1="40" y1="${H - 25}" x2="${W - 15}" y2="${H - 25}" stroke="#3a4a6b"/><line x1="40" y1="10" x2="40" y2="${H - 25}" stroke="#3a4a6b"/>`;
      [0, 20, 40, 60, 80].forEach(e => { s += `<line x1="40" y1="${Y(Math.pow(10, e))}" x2="${W - 15}" y2="${Y(Math.pow(10, e))}" stroke="#1c2a44"/><text x="36" y="${Y(Math.pow(10, e)) + 4}" fill="#8B96AD" font-size="10" text-anchor="end">10^${e}</text>`; });
      CL.forEach(c => { let d = ''; for(let k = 2; k <= 60; k++) d += (k === 2 ? 'M' : 'L') + X(k).toFixed(1) + ' ' + Y(c.f(k)).toFixed(1); s += `<path d="${d}" fill="none" stroke="${c.c}" stroke-width="2.2"/>`; });
      s += `<line x1="${X(n)}" y1="10" x2="${X(n)}" y2="${H - 25}" stroke="#E7ECF5" stroke-dasharray="4 3"/><text x="${X(n)}" y="${H - 8}" fill="#E7ECF5" font-size="11" text-anchor="middle">n = ${n}</text>`;
      chart.innerHTML = `<svg viewBox="0 0 ${W} ${H}" width="100%" style="max-width:${W}px" role="img" aria-label="Crecimiento de funciones en escala logarítmica">${s}</svg><div class="strip" style="flex-direction:row;flex-wrap:wrap;justify-content:center">${CL.map(c => `<span class="viz-label"><b style="color:${c.c}">━</b> ${c.n}</span>`).join(' ')}</div>`;
      const t = el('table', 'dt'); t.innerHTML = `<tr><th>clase</th><th>operaciones</th><th>tiempo a 10⁹ op/s</th></tr>` + CL.map(c => { const v = c.f(n); return `<tr><td style="color:${c.c}">${c.n}</td><td>${sci(Math.round(v))}</td><td>${human(v / 1e9)}</td></tr>`; }).join('');
      tbl.innerHTML = ''; tbl.appendChild(t);
      const inv = CL.filter(c => c.f(n) / 1e9 > 3.156e7 * 100).map(c => c.n);
      note.innerHTML = `Con n = ${n}: ${inv.length ? `<span class="no">inviables (más de 100 años): ${inv.join(', ')}</span>` : '<span class="ok">todas las clases se resuelven en un tiempo razonable.</span>'}`; note.classList.toggle('win', !inv.length);
    }
    sl.addEventListener('input', upd); stage.append(ctrl, chart, note, tbl);
    stage.appendChild(el('p', 'pad-note', '<b>Ejemplo de la clase:</b> los algoritmos de ordenación por comparaciones óptimos (mergesort, heapsort) cuestan O(n log n) en el peor caso. A n = 60 siguen siendo casi instantáneos, mientras que 2ⁿ ya son ~10¹⁸ operaciones (~36 años a 10⁹ op/s) y n! ≈ 10⁸² es imposible.'));
    upd();
  }
});

/* ---------- PASO 5: determinante ---------- */
function detCof(M, c){ const n = M.length; if(n === 1) return M[0][0]; let d = 0; for(let j = 0; j < n; j++){ const minor = M.slice(1).map(r => r.filter((_, k) => k !== j)); c.calls++; d += (j % 2 ? -1 : 1) * M[0][j] * detCof(minor, c); c.ops += 2; } return d; }
function detGauss(M0, c){ const M = M0.map(r => r.slice()), n = M.length; let d = 1; for(let i = 0; i < n; i++){ let p = i; for(let r = i + 1; r < n; r++) if(Math.abs(M[r][i]) > Math.abs(M[p][i])) p = r; if(Math.abs(M[p][i]) < 1e-12) return 0; if(p !== i){ [M[p], M[i]] = [M[i], M[p]]; d = -d; } d *= M[i][i]; c.ops++; for(let r = i + 1; r < n; r++){ const f = M[r][i] / M[i][i]; c.ops++; for(let k = i; k < n; k++){ M[r][k] -= f * M[i][k]; c.ops += 2; } } } return d; }
steps.push({
  name:'El determinante: recursivo (n!) frente a eliminación (n³)', short:'5 Determinante', shape:'O(n!) vs O(n³)',
  desc:'El algoritmo recursivo que desarrolla el determinante por cofactores cuesta del orden de <b>n!</b> operaciones. La página lo ejecuta de verdad y lo compara con la <b>eliminación de Gauss</b> sobre la <b>misma matriz</b>: mismo resultado, coste brutalmente distinto.',
  render(stage){
    let n = 6; const sl = el('input'); sl.type = 'range'; sl.min = 2; sl.max = 9; sl.value = n; sl.style.accentColor = 'var(--viu)'; sl.style.width = 'min(320px,70vw)'; sl.setAttribute('aria-label', 'Tamaño n');
    const ctrl = el('div', 'btn-row'); ctrl.append(el('span', 'viz-label', 'n ='), sl, el('span', 'viz-label', '6')); const mat = el('div', 'tbl-wrap'), out = el('div', 'formula'), tbl = el('div', 'tbl-wrap');
    const row = (m) => { seed8 = 100 + m; const M = mkMat(m); const c1 = { calls:0, ops:0 }, c2 = { ops:0 }; const d1 = detCof(M, c1), d2 = detGauss(M, c2); return { M, d1, d2, c1, c2 }; };
    function upd(){
      n = +sl.value; ctrl.lastChild.textContent = n; const r = row(n);
      mat.innerHTML = `<table class="dt">${r.M.map(rw => `<tr>${rw.map(x => `<td>${x}</td>`).join('')}</tr>`).join('')}</table>`;
      const same = Math.abs(r.d1 - r.d2) < 1e-6 * Math.max(1, Math.abs(r.d1));
      out.innerHTML = `det(A) por cofactores = <b>${r.d1}</b> · por Gauss = <b>${Math.round(r.d2 * 1e6) / 1e6}</b> → ${same ? '<span class="ok">coinciden ✔</span>' : '<span class="no">no coinciden</span>'}<br>Operaciones medidas: cofactores <b>${r.c1.ops.toLocaleString('es-ES')}</b> · Gauss <b>${r.c2.ops.toLocaleString('es-ES')}</b> → Gauss es <b>${(r.c1.ops / r.c2.ops).toFixed(1)}×</b> más barato`;
      out.classList.toggle('win', same);
      const t = el('table', 'dt'); t.innerHTML = '<tr><th>n</th><th>cofactores</th><th>c / n!</th><th>Gauss</th><th>Gauss / n³</th></tr>' + rng_(2, 9).map(m => { const q = row(m), f = [1, 1, 2, 6, 24, 120, 720, 5040, 40320, 362880][m]; return `<tr${m === n ? ' class="hl"' : ''}><td>${m}</td><td>${q.c1.ops.toLocaleString('es-ES')}</td><td>${(q.c1.ops / f).toFixed(2)}</td><td>${q.c2.ops}</td><td>${(q.c2.ops / (m * m * m)).toFixed(2)}</td></tr>`; }).join('');
      tbl.innerHTML = ''; tbl.appendChild(t);
    }
    sl.addEventListener('input', upd); stage.append(ctrl, mat, out, tbl);
    stage.appendChild(el('p', 'pad-note', 'Mira las columnas <b>c / n!</b> y <b>Gauss / n³</b>: ambas se estabilizan en una constante (≈ 3,4 para los cofactores). Eso indica Θ(n!) y Θ(n³) (y, por tanto, O). Con la recursión, pasar de n = 9 a n = 20 supondría ~7·10¹² veces más trabajo (20!/9!).'));
    upd();
  }
});

/* ---------- PASO 6: resumen ---------- */
steps.push({
  name:'Resumen y código', short:'6 Resumen', shape:null,
  desc:'El coste se mide contando operaciones y se clasifica por el término que domina al crecer n. Las cifras de abajo las calcula la página.',
  render(stage){
    const T = el('div', 'tbl-wrap'); T.innerHTML = `<table class="dt"><tr><th>Algoritmo</th><th>Operaciones</th><th>Orden</th></tr>${ALGS.map(A => `<tr><td>${A.n}</td><td>${A.thTxt}</td><td>${A.cls}</td></tr>`).join('')}<tr><td>Determinante por cofactores</td><td>≈ 3,4·n!</td><td>Θ(n!) factorial</td></tr><tr><td>Ordenación por comparaciones óptima (mergesort, heapsort)</td><td>~ n log n</td><td>Θ(n log n)</td></tr></table>`; stage.appendChild(T);
    stage.appendChild(el('div', 'panel-title c1', 'En Python: contar operaciones'));
    stage.appendChild(codeBox(`def producto_escalar(u, v):
    ops = 0
    p = u[0] * v[0]; ops += 1
    for k in range(1, len(u)):
        p += u[k] * v[k]; ops += 2
    return p, ops

def suma_matrices_ops(n):
    return n * n                  # una suma por casilla

for n in (10, 100, 1000):
    _, ops = producto_escalar([1] * n, [1] * n)
    print(n, ops, suma_matrices_ops(n))`));
    stage.appendChild(el('div', 'viz-label', 'Salida del programa (calculada aquí con las mismas reglas):'));
    stage.appendChild(codeBox([10, 100, 1000].map(n => `${n} ${2 * n - 1} ${n * n}`).join('\n')));
    stage.appendChild(el('div', 'panel-title c3', 'Errores frecuentes'));
    const errs = el('div', 'bio-text'); errs.innerHTML = `<p><b>1.</b> Medir el coste en segundos: dependen de la máquina. La complejidad cuenta <i>operaciones</i>.</p>
      <p><b>2.</b> Tomar la constante en serio: 2n³ y n³ son <i>ambos</i> O(n³); lo que manda es cómo crece, no el factor.</p>
      <p><b>3.</b> Confundir O con Θ: n² es O(n³) (verdadero, cota no ajustada), pero no Θ(n³), porque n²/n³ → 0. Al dar un orden conviene dar la cota ajustada Θ.</p>
      <p><b>4.</b> Pensar que un ordenador más rápido arregla un algoritmo exponencial: con 2ⁿ, una máquina 1000 veces más rápida solo permite ~10 datos más.</p>`;
    stage.appendChild(errs); stage.appendChild(qcards(QUESTIONS));
  }
});

/* =========================================================
   Motor de navegación (idéntico en todas las actividades)
========================================================= */
let current = 0;
function renderTrail(){
  const tr = $('#trail'); tr.innerHTML = '';
  steps.forEach((s, i) => { const b = el('button', null, s.short); b.type = 'button'; b.addEventListener('click', () => goTo(i)); tr.appendChild(b); });
}
function goTo(i){
  current = i;
  clearTimers();
  const s = steps[current];
  $('#stepCount').textContent = current === 0 ? 'Introducción' : `Paso ${current} de ${steps.length - 1}`;
  $('#stepTitle').textContent = s.name;
  $('#stepDesc').innerHTML = s.desc;
  const chip = $('#shapeChip');
  if(s.shape){ chip.style.display = ''; chip.innerHTML = `<b>${s.shape}</b>`; } else chip.style.display = 'none';
  const stage = $('#stage'); stage.innerHTML = '';
  s.render(stage);
  const btns = document.querySelectorAll('.trail button');
  btns.forEach((b, idx) => b.classList.toggle('active', idx === current));
  if(btns[current]) btns[current].scrollIntoView({ block:'nearest', inline:'center' });
  $('#prevBtn').disabled = current === 0;
  $('#nextBtn').textContent = current === steps.length - 1 ? 'Volver al inicio ↺' : 'Siguiente →';
  window.scrollTo(0, 0);
}
$('#prevBtn').addEventListener('click', () => { if(current > 0) goTo(current - 1); });
$('#nextBtn').addEventListener('click', () => goTo(current === steps.length - 1 ? 0 : current + 1));
document.addEventListener('keydown', e => {
  if(e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT')) return;
  if(e.key === 'ArrowRight') $('#nextBtn').click();
  if(e.key === 'ArrowLeft') $('#prevBtn').click();
});
renderTrail(); goTo(0);
</script>
