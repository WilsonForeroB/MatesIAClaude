  select:focus,button:focus-visible{ outline:2px solid var(--cyan); outline-offset:1px; }

  .fnode:hover{ border-color:var(--viu); } .fnode small{ display:block; color:var(--muted); font-size:10.5px; }

<body>

<header>
  <div class="headline-row">
    <h1>Álgebra de Boole: <span>cinco reglas</span>, muchos mundos</h1>
    <span class="net-tag">02MIAR · Matemáticas para la IA · Sesión 2</span>
  </div>
  <div class="trail" id="trail"></div>
</header>

<main>
  <div class="card">
    <div class="step-meta">
      <div>
        <p class="step-count" id="stepCount"></p>
        <h2 class="step-title" id="stepTitle"></h2>
        <p class="step-desc" id="stepDesc"></p>
      </div>
      <div class="shape-chip" id="shapeChip"></div>
    </div>
    <div id="stage"></div>
  </div>
</main>

<footer>
  <button class="nav-btn" id="prevBtn">← Anterior</button>
  <button class="nav-btn primary" id="nextBtn">Siguiente →</button>
</footer>

<script>
/* =========================================================
   Utilidades
========================================================= */
const $ = s => document.querySelector(s);
let timers = [];
function clearTimers(){ timers.forEach(t => clearInterval(t)); timers = []; }
function el(tag, cls, html){ const e = document.createElement(tag); if(cls) e.className = cls; if(html != null) e.innerHTML = html; return e; }
const V = x => x ? 1 : 0;
const vtag = x => `<span class="tv v${V(x)}">${V(x)}</span>`;
const lower1 = s => s.charAt(0).toLowerCase() + s.slice(1);

function py(code){
  return code.replace(/&/g, '&amp;').replace(/</g, '&lt;').split('\n').map(l => {
    const k = l.indexOf('#'); let body = l, cm = '';
    if(k >= 0){ body = l.slice(0, k); cm = '<span class="cm">' + l.slice(k) + '</span>'; }
    body = body.replace(/\b(import|from|as|print|def|return|not|and|or|for|in)\b/g, '<span class="kw">$1</span>');
    return body + cm;
  }).join('\n');
}
function codeBox(code){ const p = el('pre', 'code'); p.innerHTML = py(code); return p; }

/* ---------- lógica: todas las combinaciones, en el orden de las diapositivas (1,1 / 1,0 / 0,1 / 0,0) ---------- */
function combos(vars){
  const n = vars.length, out = [];
  for(let i = 0; i < (1 << n); i++){ const e = {}; vars.forEach((v, k) => e[v] = !((i >> (n-1-k)) & 1)); out.push(e); }
  return out;
}
const sameEnv = (a, b) => Object.keys(a).every(k => a[k] === b[k]);
const OPS = {
  and: { sym:'∧', f:(p, q) => p && q },
  or:  { sym:'∨', f:(p, q) => p || q },
  xor: { sym:'⊻', f:(p, q) => p !== q },
  imp: { sym:'→', f:(p, q) => !p || q },
  iff: { sym:'↔', f:(p, q) => p === q }
};
function classify(f, vars){
  const vals = combos(vars).map(f);
  return vals.every(Boolean) ? 'T' : (vals.every(v => !v) ? 'C' : 'K');
}
const CLS = { T:'Tautología', C:'Contradicción', K:'Contingencia' };

/* tabla de verdad viva: highlight de la fila actual; clic en fila = elegir esos valores */
function makeTable(vars, cols, onPick, rowClass){
  const wrap = el('div', 'tbl-wrap'), t = el('table', 'dt'); wrap.appendChild(t);
  const head = el('tr'); const ths = [];
  vars.forEach(v => head.appendChild(el('th', null, v)));
  cols.forEach(c => { const th = el('th', c.res === false ? '' : 'res', c.h); ths.push(th); head.appendChild(th); });
  t.appendChild(head);
  const rows = combos(vars).map(env => {
    const tr = el('tr', onPick ? 'pick' : ''); tr._env = env;
    vars.forEach(v => tr.appendChild(el('td', null, vtag(env[v]))));
    cols.forEach(c => tr.appendChild(el('td', null, vtag(c.f(env)))));
    if(rowClass){ const rc = rowClass(env); if(rc) tr.classList.add(rc); }
    if(onPick) tr.addEventListener('click', () => onPick(env));
    t.appendChild(tr); return tr;
  });
  return { el: wrap, setHead:(i, txt) => { ths[i].innerHTML = txt; }, set: env => rows.forEach(r => r.classList.toggle('hl', !!env && sameEnv(r._env, env))) };
}

/* interruptor 1/0 */
function toggleBtn(name, init, cb, subs){
  let val = init; const b = el('button', 'tg'); b.type = 'button';
  function draw(){
    b.className = 'tg ' + (val ? 'on' : 'off');
    b.innerHTML = `<b>${name} = ${V(val)}</b><small>${val ? (subs ? subs[0] : 'verdadera') : (subs ? subs[1] : 'falsa')}</small>`;
    b.setAttribute('aria-pressed', val); b.setAttribute('aria-label', `${name} vale ${V(val)}`);
  }
  b.addEventListener('click', () => { val = !val; draw(); cb(val); });
  draw();
  return { el:b, get:() => val, set:v => { val = v; draw(); } };
}

/* ---------- circuitos (analogía física) ---------- */
function circuit(mode, p, q){
  const on = '#E55015', off = '#3a4a6b';
  const w = (x1, y1, x2, y2, lit) => `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${lit ? on : off}" stroke-width="3.5" stroke-linecap="round"/>`;
  const dotc = (x, y, lit) => `<circle cx="${x}" cy="${y}" r="3.6" fill="${lit ? on : off}"/>`;
  const sw = (x, y, closed, lit, lab) => w(x, y, closed ? x+60 : x+54, closed ? y : y-26, closed && lit) + dotc(x, y, lit) + dotc(x+60, y, closed && lit) +
    `<text x="${x+30}" y="${y+22}" text-anchor="middle" font-size="12" fill="#8B96AD">${lab}=${V(closed)}</text>`;
  const lamp = (cx, cy, lit) => `<circle cx="${cx}" cy="${cy}" r="17" fill="${lit ? on : '#17233A'}" stroke="${lit ? '#ffb08a' : off}" stroke-width="2.5"/>` +
    (lit ? [0,45,90,135,180,225,270,315].map(a => { const r = a*Math.PI/180; return `<line x1="${cx+23*Math.cos(r)}" y1="${cy+23*Math.sin(r)}" x2="${cx+31*Math.cos(r)}" y2="${cy+31*Math.sin(r)}" stroke="${on}" stroke-width="2.5" stroke-linecap="round"/>`; }).join('') : '') +
    `<line x1="${cx-9}" y1="${cy-9}" x2="${cx+9}" y2="${cy+9}" stroke="${lit ? '#fff' : off}" stroke-width="2"/><line x1="${cx+9}" y1="${cy-9}" x2="${cx-9}" y2="${cy+9}" stroke="${lit ? '#fff' : off}" stroke-width="2"/>`;
  const batt = (x, y1, y2) => `<line x1="${x-9}" y1="${y1}" x2="${x+9}" y2="${y1}" stroke="#E7ECF5" stroke-width="3"/><line x1="${x-5}" y1="${y1+8}" x2="${x+5}" y2="${y1+8}" stroke="#E7ECF5" stroke-width="3"/>`;
  let s = '', lit = false;
  if(mode === 'and'){
    lit = p && q;
    s += w(24,60,96,60,true) + sw(96,60,p,true,'p') + w(156,60,228,60,p) + sw(228,60,q,p,'q') + w(288,60,352,60,lit) + lamp(372,60,lit);
    s += w(372,77,372,108,lit) + w(372,108,24,108,lit) + w(24,108,24,72,lit) + batt(24,60);
  } else if(mode === 'or'){
    lit = p || q;
    s += w(24,70,96,70,true) + w(96,40,96,100,true) + w(96,40,150,40,true) + sw(150,40,p,true,'p') + w(210,40,300,40,p) +
         w(96,100,150,100,true) + sw(150,100,q,true,'q') + w(210,100,300,100,q) + w(300,40,300,100,lit) + w(300,70,355,70,lit) + lamp(372,70,lit);
    s += w(372,87,372,128,lit) + w(372,128,24,128,lit) + w(24,128,24,82,lit) + batt(24,70);
  } else {
    lit = p !== q;
    const pt = [140,40], pb = [140,100], qt = [280,40], qb = [280,100];
    s += w(24,70,110,70,true) + dotc(110,70,true) + dotc(310,70,lit) + w(310,70,355,70,lit) + lamp(372,70,lit);
    s += w(110,70,140,p ? 40 : 100,true);
    s += w(140,40,280,100,p) + w(140,100,280,40,!p);
    s += w(310,70,280,q ? 40 : 100,lit);
    s += [pt,pb,qt,qb].map(c => dotc(c[0], c[1], false)).join('');
    s += `<text x="110" y="124" text-anchor="middle" font-size="12" fill="#8B96AD">p=${V(p)}</text><text x="310" y="124" text-anchor="middle" font-size="12" fill="#8B96AD">q=${V(q)}</text>`;

/* ---------- álgebras concretas ---------- */
const gcd = (a, b) => b ? gcd(b, a % b) : a, lcm = (a, b) => a*b / gcd(a, b);
const maskSet = m => { const a = [1, 2, 3].filter((_, i) => m & (1 << i)); return a.length ? '{' + a.join(',') + '}' : '∅'; };
const maskBits = m => `(${m & 1 ? 1 : 0},${m & 2 ? 1 : 0},${m & 4 ? 1 : 0})`;
function makeAlg(o){ // calcula el complemento por búsqueda: a' tal que a⊕a'=1 y a⊙a'=0
  const A = Object.assign({}, o);
  A.comp = a => { const c = A.elems.find(x => A.eq(A.or(a, x), A.one) && A.eq(A.and(a, x), A.zero)); return c === undefined ? undefined : c; };
  A.eq = A.eq || ((a, b) => a === b);
  return A;
}
const ALGS = {

  pa: makeAlg({ n:'P({1,2,3}) con ∪ y ∩', long:'P(A), A = {1,2,3}', elems:[0, 1, 2, 3, 4, 5, 6, 7], show:maskSet, or:(a, b) => a | b, and:(a, b) => a & b, zero:0, one:7, sym:['∪', '∩'], eq:(a, b) => a === b }),
  b3: makeAlg({ n:'B³ (ternas de bits)', long:'B³ componente a componente', elems:[0, 1, 2, 3, 4, 5, 6, 7], show:maskBits, or:(a, b) => a | b, and:(a, b) => a & b, zero:0, one:7, sym:['+', '·'], eq:(a, b) => a === b }),
  d6: makeAlg({ n:'Divisores de 6 (mcm, mcd)', long:'Divisores de 6 con mcm y mcd', elems:[1, 2, 3, 6], show:String, or:lcm, and:gcd, zero:1, one:6, sym:['mcm', 'mcd'], eq:(a, b) => a === b }),
  d12: makeAlg({ n:'Divisores de 12 (mcm, mcd)', long:'Divisores de 12 con mcm y mcd', elems:[1, 2, 3, 4, 6, 12], show:String, or:lcm, and:gcd, zero:1, one:12, sym:['mcm', 'mcd'], eq:(a, b) => a === b })
};
const PRODS = (() => { const e = []; [0, 1].forEach(b => ALGS.pa.elems.forEach(m => e.push([b, m]))); return e; })();
ALGS.prod = makeAlg({ n:'B × P(A) (producto)', long:'B₁ × B₂, con B₁={0,1} y B₂=P({1,2,3})', elems:PRODS.map((_, i) => i), show:i => `(${PRODS[i][0]}, ${maskSet(PRODS[i][1])})`,
  or:(a, b) => PRODS.findIndex(p => p[0] === (PRODS[a][0] | PRODS[b][0]) && p[1] === (PRODS[a][1] | PRODS[b][1])),
  and:(a, b) => PRODS.findIndex(p => p[0] === (PRODS[a][0] & PRODS[b][0]) && p[1] === (PRODS[a][1] & PRODS[b][1])), zero:0, one:15, sym:['∨', '∧'], eq:(a, b) => a === b });

/* ---------- leyes: axiomas y propiedades ---------- */
const AXIOMS = [
  { g:'B₁ Conmutativas', n:2, t:'a ⊕ b = b ⊕ a', f:(A, a, b) => A.eq(A.or(a, b), A.or(b, a)) },
  { g:'B₁ Conmutativas', n:2, t:'a ⊙ b = b ⊙ a', f:(A, a, b) => A.eq(A.and(a, b), A.and(b, a)) },
  { g:'B₂ Asociativas', n:3, t:'a ⊕ (b ⊕ c) = (a ⊕ b) ⊕ c', f:(A, a, b, c) => A.eq(A.or(a, A.or(b, c)), A.or(A.or(a, b), c)) },
  { g:'B₂ Asociativas', n:3, t:'a ⊙ (b ⊙ c) = (a ⊙ b) ⊙ c', f:(A, a, b, c) => A.eq(A.and(a, A.and(b, c)), A.and(A.and(a, b), c)) },
  { g:'B₃ Identidad', n:1, t:'a ⊕ 0 = a', f:(A, a) => A.eq(A.or(a, A.zero), a) },
  { g:'B₃ Identidad', n:1, t:'1 ⊙ a = a', f:(A, a) => A.eq(A.and(A.one, a), a) },
  { g:'B₄ Distributivas', n:3, t:'a ⊙ (b ⊕ c) = (a ⊙ b) ⊕ (a ⊙ c)', f:(A, a, b, c) => A.eq(A.and(a, A.or(b, c)), A.or(A.and(a, b), A.and(a, c))) },
  { g:'B₄ Distributivas', n:3, t:'a ⊕ (b ⊙ c) = (a ⊕ b) ⊙ (a ⊕ c)', f:(A, a, b, c) => A.eq(A.or(a, A.and(b, c)), A.and(A.or(a, b), A.or(a, c))) },
  { g:'B₅ Complementación', n:1, t:'a ⊕ a′ = 1', f:(A, a) => { const c = A.comp(a); return c !== undefined && A.eq(A.or(a, c), A.one); }, miss:true },
  { g:'B₅ Complementación', n:1, t:'a ⊙ a′ = 0', f:(A, a) => { const c = A.comp(a); return c !== undefined && A.eq(A.and(a, c), A.zero); }, miss:true }
];
const PROPS = [
  { g:'Idempotencia', n:1, t:'x ⊕ x = x', f:(A, x) => A.eq(A.or(x, x), x) }, { g:'Idempotencia', n:1, t:'x ⊙ x = x', f:(A, x) => A.eq(A.and(x, x), x) },
  { g:'Dominación', n:1, t:'x ⊕ 1 = 1', f:(A, x) => A.eq(A.or(x, A.one), A.one) }, { g:'Dominación', n:1, t:'x ⊙ 0 = 0', f:(A, x) => A.eq(A.and(x, A.zero), A.zero) },
  { g:'Absorción', n:2, t:'x ⊕ (x ⊙ y) = x', f:(A, x, y) => A.eq(A.or(x, A.and(x, y)), x) }, { g:'Absorción', n:2, t:'x ⊙ (x ⊕ y) = x', f:(A, x, y) => A.eq(A.and(x, A.or(x, y)), x) },
  { g:'Cancelativa', n:3, t:'x⊕y = x⊕z  y  x⊙y = x⊙z  ⇒  y = z', f:(A, x, y, z) => !(A.eq(A.or(x, y), A.or(x, z)) && A.eq(A.and(x, y), A.and(x, z))) || A.eq(y, z) },
  { g:'Doble complemento', n:1, t:'x″ = x', f:(A, x) => { const c = A.comp(x); return c !== undefined && A.eq(A.comp(c), x); } },
  { g:'Leyes de De Morgan', n:2, t:'(x ⊕ y)′ = x′ ⊙ y′', f:(A, x, y) => { const l = A.comp(A.or(x, y)), a = A.comp(x), b = A.comp(y); return l !== undefined && a !== undefined && b !== undefined && A.eq(l, A.and(a, b)); } },
  { g:'Leyes de De Morgan', n:2, t:'(x ⊙ y)′ = x′ ⊕ y′', f:(A, x, y) => { const l = A.comp(A.and(x, y)), a = A.comp(x), b = A.comp(y); return l !== undefined && a !== undefined && b !== undefined && A.eq(l, A.or(a, b)); } }
];
function tuples(A, n){ let out = [[]]; for(let i = 0; i < n; i++) out = out.flatMap(t => A.elems.map(e => [...t, e])); return out; }
function checkLaw(A, L){
  const all = tuples(A, L.n); let ok = 0, bad = null;
  all.forEach(t => { if(L.f(A, ...t)) ok++; else if(!bad) bad = t; });
  return { ok, total:all.length, bad };
}
const VARN = ['a', 'b', 'c'];
function badText(A, L, r){
  const t = r.bad; const vs = t.map((e, i) => `${(L.g.startsWith('B') ? VARN : ['x', 'y', 'z'])[i]} = ${A.show(e)}`).join(', ');
  if(L.miss && A.comp(t[0]) === undefined) return `${vs}: no existe a′ con a ⊕ a′ = 1 y a ⊙ a′ = 0`;
  return vs;
}

        <tr><td>x + y</td><td><b>${fm(sum)}</b></td><td>${asSets ? 'unión' : 'bit a bit: ' + x.map((v, i) => `${v}+${y[i]}`).join(', ')}</td></tr>

        <tr><td>x′</td><td><b>${fm(cx)}</b></td><td>${asSets ? 'complemento en A' : 'se invierte cada bit'}</td></tr></table>`;
      const mx = x.reduce((m, b, i) => m | (b << i), 0);
      out.innerHTML = `Misma operación, dos lecturas: <b>${maskBits(mx)}</b> ↔ <b>${maskSet(mx)}</b>. El álgebra B³ tiene 2³ = <b>8</b> elementos, igual que P({1,2,3}).`;
    }
    stage.append(el('div', 'panel-title c1', 'Terna x'), swX, el('div', 'panel-title c2', 'Terna y'), swY, el('div', 'btn-row'), grid, out);
    stage.lastChild.previousSibling.previousSibling.appendChild(view);
    stage.appendChild(el('p', 'pad-note', '<b>Idea:</b> toda álgebra de Boole finita tiene 2ⁿ elementos para algún n (es isomorfa a 𝒫 de un conjunto de n elementos, igual que B³ ≅ 𝒫({1,2,3})). Por eso un byte (B⁸) tiene 256 estados.'));
    upd();
  }
});

/* ---------- PASO 4: verificador ---------- */
steps.push({
  name:'Verificador: ¿es un álgebra de Boole?', short:'4 Verificador', shape:'B₁–B₅ + propiedades',
  desc:'Elige una estructura y la página comprueba <b>todas las combinaciones</b> de elementos. Si una ley falla, ves el contraejemplo. Verás que los divisores de 6 sí son un álgebra de Boole, pero los de 12 no. Las propiedades derivadas (idempotencia, De Morgan…) se cumplen siempre que valgan B₁–B₅.',
  render(stage){
    const keys = Object.keys(ALGS); let cur = 'b2'; const bar = el('div', 'btn-row'), head = el('div', 'formula'), list = el('div');
    function upd(){
      bar.querySelectorAll('button').forEach((b, i) => b.classList.toggle('active', keys[i] === cur));
      const A = ALGS[cur]; const axR = AXIOMS.map(L => ({ L, r:checkLaw(A, L) })), prR = PROPS.map(L => ({ L, r:checkLaw(A, L) }));
      const isBool = axR.every(o => o.r.ok === o.r.total);
      head.innerHTML = `<b>${A.long}</b> · ${A.elems.length} elementos · ⊕ = ${A.sym[0]}, ⊙ = ${A.sym[1]}<br>${isBool ? '<span class="ok">✔ Cumple B₁–B₅: es un álgebra de Boole.</span>' : '<span class="no">✘ Falla algún axioma: NO es un álgebra de Boole.</span>'}`;
      head.classList.toggle('win', isBool);
      const row = ({ L, r }) => `<div class="qrow" style="margin:4px 0"><div class="tx"><b>${L.g}</b>: ${L.t}</div><div>${vtag(r.ok === r.total)} <span class="viz-label">${r.ok}/${r.total}</span></div>${r.bad ? `<div class="fb"><b class="no">Contraejemplo:</b> ${badText(A, L, r)}</div>` : ''}</div>`;
      list.innerHTML = `<div class="panel-title c1">Axiomas</div>${axR.map(row).join('')}<div class="panel-title c2" style="margin-top:10px">Propiedades derivadas</div>${prR.map(row).join('')}`;
    }
    keys.forEach(k => bar.appendChild(chipBtn(ALGS[k].n, false, () => { cur = k; upd(); })));
    stage.append(bar, head, list);
    stage.appendChild(el('p', 'pad-note', 'Fíjate: en los divisores de 12 fallan B₅ (el 2 no tiene complemento) y, como consecuencia, varias propiedades derivadas. Con una sola ley que falle, la estructura deja de ser un álgebra de Boole.'));
    upd();
  }
});

/* ---------- PASO 5: producto ---------- */
steps.push({
  name:'Teorema: el producto de álgebras de Boole es un álgebra de Boole', short:'5 Producto', shape:'B₁ × B₂ = B × P(A)',
  desc:'Si tienes dos álgebras, sus pares también forman una: <b>(x₁, y₁) ∨ (x₂, y₂) = (x₁ ∨₁ x₂, y₁ ∨₂ y₂)</b>, y lo mismo con ∧. Ejemplo de la clase: B₁ = {0,1} y B₂ = P({1,2,3}): 2 × 8 = <b>16</b> elementos. Construye dos pares.',
  render(stage){
    let b1 = 1, m1 = 3, b2 = 0, m2 = 6; const out = el('div'), ver = el('div', 'formula');
    const tg = [toggleBtn('b₁', true, v => { b1 = v ? 1 : 0; upd(); }, ['1', '0']), toggleBtn('b₂', false, v => { b2 = v ? 1 : 0; upd(); }, ['1', '0'])];
    const chips = (get, set) => { const bar = el('div', 'btn-row'); [1, 2, 3].forEach((e, i) => { const b = chipBtn(String(e), false, () => { set(get() ^ (1 << i)); upd(); }); b._i = i; bar.appendChild(b); }); return bar; };
    const ch1 = chips(() => m1, v => m1 = v), ch2 = chips(() => m2, v => m2 = v);
    const pr = (b, m) => `(${b}, ${maskSet(m)})`;
    function upd(){
      [[ch1, m1], [ch2, m2]].forEach(([bar, m]) => bar.querySelectorAll('button').forEach(b => b.classList.toggle('active', !!(m & (1 << b._i)))));
      out.innerHTML = `<div class="formula">u = ${pr(b1, m1)} · v = ${pr(b2, m2)}<br>u ∨ v = (${b1}∨${b2}, ${maskSet(m1)}∪${maskSet(m2)}) = <b>${pr(b1 | b2, m1 | m2)}</b><br>u ∧ v = (${b1}∧${b2}, ${maskSet(m1)}∩${maskSet(m2)}) = <b>${pr(b1 & b2, m1 & m2)}</b><br>u′ = (${1 - b1}, ${maskSet(7 ^ m1)}) · cada componente se calcula en <i>su propia</i> álgebra</div>`;
    }
    const r1 = el('div', 'viz-row'), c1 = el('div', 'viz-col'), c2 = el('div', 'viz-col');
    c1.append(el('div', 'panel-title c1', 'Par u = (b₁, X)'), tg[0].el, ch1); c2.append(el('div', 'panel-title c2', 'Par v = (b₂, Y)'), tg[1].el, ch2); r1.append(c1, c2);
    stage.append(r1, out);
    const A = ALGS.prod, axR = AXIOMS.map(L => checkLaw(A, L)), okAll = axR.every(r => r.ok === r.total), tot = axR.reduce((s, r) => s + r.total, 0);
    ver.innerHTML = `Verificación del teorema sobre los <b>${A.elems.length}</b> elementos de B × P(A): ${okAll ? `<span class="ok">se cumplen B₁–B₅ en las ${tot} comprobaciones</span>` : '<span class="no">falla algún axioma</span>'}.<br>Y como 16 = 2⁴, es el mismo álgebra que B⁴: cuatro bits.`;
    ver.classList.toggle('win', okAll);
    stage.append(el('div', 'panel-title c3', '¿Funciona de verdad?'), ver);
    stage.appendChild(el('p', 'pad-note', 'El teorema se puede generalizar a n álgebras. Es la razón por la que las palabras de 8, 16 o 64 bits son álgebras de Boole.'));
    upd();
  }
});

/* ---------- PASO 6: resumen ---------- */
steps.push({
  name:'Resumen y código', short:'6 Resumen', shape:null,
  desc:'Un álgebra de Boole es cualquier cosa que cumpla B₁–B₅. En Python, los enteros con operadores bit a bit son un ejemplo directo. Los resultados de abajo los calcula la página.',
  render(stage){
    const T = el('div', 'tbl-wrap'); T.innerHTML = `<table class="dt"><tr><th>Axioma</th><th>Dice</th></tr>
      <tr><td>B₁</td><td>⊕ y ⊙ son conmutativas</td></tr><tr><td>B₂</td><td>⊕ y ⊙ son asociativas</td></tr>
      <tr><td>B₃</td><td>existen 0 y 1 (neutros)</td></tr><tr><td>B₄</td><td>cada una distribuye sobre la otra</td></tr>
      <tr><td>B₅</td><td>todo a tiene complemento a′</td></tr></table>`;
    stage.appendChild(T);
    stage.appendChild(el('div', 'panel-title c1', 'En Python (palabras de 3 bits = P({1,2,3}))'));
    stage.appendChild(codeBox(`UNO = 0b111                  # el conjunto A = {1,2,3}
X = 0b101                    # {1,3}
Y = 0b110                    # {2,3}

print(bin(X | Y))            # unión        X ⊕ Y
print(bin(X & Y))            # intersección X ⊙ Y
print(bin(UNO ^ X))          # complemento  X′
print((X | (UNO ^ X)) == UNO)  # X ⊕ X′ = 1
print((X & (UNO ^ X)) == 0)    # X ⊙ X′ = 0`));
    const X = 5, Y = 6, bn = n => '0b' + n.toString(2).padStart(3, '0').replace(/^0+(?=.)/, '');
    stage.appendChild(el('div', 'viz-label', 'Salida del programa (calculada aquí con las mismas reglas):'));
    stage.appendChild(codeBox([bn(X | Y), bn(X & Y), bn(7 ^ X), String((X | (7 ^ X)) === 7), String((X & (7 ^ X)) === 0)].map((s, i) => i < 3 ? '0b' + parseInt(s.slice(2) || '0', 2).toString(2) : (s === 'true' ? 'True' : 'False')).join('\n')));
    stage.appendChild(el('div', 'panel-title c3', 'Errores frecuentes'));
    const errs = el('div', 'bio-text'); errs.innerHTML = `<p><b>1.</b> Pensar que «+» es la suma de siempre: en {0,1}, 1 + 1 = 1 (es el OR).</p>
      <p><b>2.</b> Olvidar que los <i>dos</i> distributivos valen: a ⊕ (b ⊙ c) = (a ⊕ b) ⊙ (a ⊕ c) también, a diferencia de los números.</p>
      <p><b>3.</b> Creer que cualquier conjunto con mcm y mcd es álgebra de Boole: los divisores de 12 no lo son (falta el complemento del 2).</p>
      <p><b>4.</b> Confundir el complemento con «el opuesto»: a′ se define por a ⊕ a′ = 1 y a ⊙ a′ = 0.</p>`;
    stage.appendChild(errs); stage.appendChild(qcards(QUESTIONS));
  }
});

/* =========================================================
   Motor de navegación (idéntico en todas las actividades)
========================================================= */
let current = 0;
function renderTrail(){
  const tr = $('#trail'); tr.innerHTML = '';
  steps.forEach((s, i) => { const b = el('button', null, s.short); b.type = 'button'; b.addEventListener('click', () => goTo(i)); tr.appendChild(b); });
}
function goTo(i){
  current = i;
  clearTimers();
  const s = steps[current];
  $('#stepCount').textContent = current === 0 ? 'Introducción' : `Paso ${current} de ${steps.length - 1}`;
  $('#stepTitle').textContent = s.name;
  $('#stepDesc').innerHTML = s.desc;
  const chip = $('#shapeChip');
  if(s.shape){ chip.style.display = ''; chip.innerHTML = `<b>${s.shape}</b>`; } else chip.style.display = 'none';
  const stage = $('#stage'); stage.innerHTML = '';
  s.render(stage);
  const btns = document.querySelectorAll('.trail button');
  btns.forEach((b, idx) => b.classList.toggle('active', idx === current));
  if(btns[current]) btns[current].scrollIntoView({ block:'nearest', inline:'center' });
  $('#prevBtn').disabled = current === 0;
  $('#nextBtn').textContent = current === steps.length - 1 ? 'Volver al inicio ↺' : 'Siguiente →';
  window.scrollTo(0, 0);
}
$('#prevBtn').addEventListener('click', () => { if(current > 0) goTo(current - 1); });
$('#nextBtn').addEventListener('click', () => goTo(current === steps.length - 1 ? 0 : current + 1));
document.addEventListener('keydown', e => {
  if(e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT')) return;
  if(e.key === 'ArrowRight') $('#nextBtn').click();
  if(e.key === 'ArrowLeft') $('#prevBtn').click();
});
renderTrail(); goTo(0);
</script>
