<script>
/* =========================================================
   Utilidades
========================================================= */
const $ = s => document.querySelector(s);
let timers = [];
function clearTimers(){ timers.forEach(t => clearInterval(t)); timers = []; }
function el(tag, cls, html){ const e = document.createElement(tag); if(cls) e.className = cls; if(html != null) e.innerHTML = html; return e; }
const V = x => x ? 1 : 0;
const vtag = x => `<span class="tv v${V(x)}">${V(x)}</span>`;
const lower1 = s => s.charAt(0).toLowerCase() + s.slice(1);

function py(code){
  return code.replace(/&/g, '&amp;').replace(/</g, '&lt;').split('\n').map(l => {
    const k = l.indexOf('#'); let body = l, cm = '';
    if(k >= 0){ body = l.slice(0, k); cm = '<span class="cm">' + l.slice(k) + '</span>'; }
    body = body.replace(/\b(import|from|as|print|def|return|not|and|or|for|in)\b/g, '<span class="kw">$1</span>');
    return body + cm;
  }).join('\n');
}
function codeBox(code){ const p = el('pre', 'code'); p.innerHTML = py(code); return p; }

/* ---------- lógica: todas las combinaciones, en el orden de las diapositivas (1,1 / 1,0 / 0,1 / 0,0) ---------- */
function combos(vars){
  const n = vars.length, out = [];
  for(let i = 0; i < (1 << n); i++){ const e = {}; vars.forEach((v, k) => e[v] = !((i >> (n-1-k)) & 1)); out.push(e); }
  return out;
}
const sameEnv = (a, b) => Object.keys(a).every(k => a[k] === b[k]);
const OPS = {
  and: { sym:'∧', f:(p, q) => p && q },
  or:  { sym:'∨', f:(p, q) => p || q },
  xor: { sym:'⊻', f:(p, q) => p !== q },
  imp: { sym:'→', f:(p, q) => !p || q },
  iff: { sym:'↔', f:(p, q) => p === q }
};
function classify(f, vars){
  const vals = combos(vars).map(f);
  return vals.every(Boolean) ? 'T' : (vals.every(v => !v) ? 'C' : 'K');
}
const CLS = { T:'Tautología', C:'Contradicción', K:'Contingencia' };

/* tabla de verdad viva: highlight de la fila actual; clic en fila = elegir esos valores */
function makeTable(vars, cols, onPick, rowClass){
  const wrap = el('div', 'tbl-wrap'), t = el('table', 'dt'); wrap.appendChild(t);
  const head = el('tr'); const ths = [];
  vars.forEach(v => head.appendChild(el('th', null, v)));
  cols.forEach(c => { const th = el('th', c.res === false ? '' : 'res', c.h); ths.push(th); head.appendChild(th); });
  t.appendChild(head);
  const rows = combos(vars).map(env => {
    const tr = el('tr', onPick ? 'pick' : ''); tr._env = env;
    vars.forEach(v => tr.appendChild(el('td', null, vtag(env[v]))));
    cols.forEach(c => tr.appendChild(el('td', null, vtag(c.f(env)))));
    if(rowClass){ const rc = rowClass(env); if(rc) tr.classList.add(rc); }
    if(onPick) tr.addEventListener('click', () => onPick(env));
    t.appendChild(tr); return tr;
  });
  return { el: wrap, setHead:(i, txt) => { ths[i].innerHTML = txt; }, set: env => rows.forEach(r => r.classList.toggle('hl', !!env && sameEnv(r._env, env))) };
}

/* interruptor 1/0 */
function toggleBtn(name, init, cb, subs){
  let val = init; const b = el('button', 'tg'); b.type = 'button';
  function draw(){
    b.className = 'tg ' + (val ? 'on' : 'off');
    b.innerHTML = `<b>${name} = ${V(val)}</b><small>${val ? (subs ? subs[0] : 'verdadera') : (subs ? subs[1] : 'falsa')}</small>`;
    b.setAttribute('aria-pressed', val); b.setAttribute('aria-label', `${name} vale ${V(val)}`);
  }
  b.addEventListener('click', () => { val = !val; draw(); cb(val); });
  draw();
  return { el:b, get:() => val, set:v => { val = v; draw(); } };
}

/* ---------- circuitos (analogía física) ---------- */
function circuit(mode, p, q){
  const on = '#E55015', off = '#3a4a6b';
  const w = (x1, y1, x2, y2, lit) => `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${lit ? on : off}" stroke-width="3.5" stroke-linecap="round"/>`;
  const dotc = (x, y, lit) => `<circle cx="${x}" cy="${y}" r="3.6" fill="${lit ? on : off}"/>`;
  const sw = (x, y, closed, lit, lab) => w(x, y, closed ? x+60 : x+54, closed ? y : y-26, closed && lit) + dotc(x, y, lit) + dotc(x+60, y, closed && lit) +
    `<text x="${x+30}" y="${y+22}" text-anchor="middle" font-size="12" fill="#8B96AD">${lab}=${V(closed)}</text>`;
  const lamp = (cx, cy, lit) => `<circle cx="${cx}" cy="${cy}" r="17" fill="${lit ? on : '#17233A'}" stroke="${lit ? '#ffb08a' : off}" stroke-width="2.5"/>` +
    (lit ? [0,45,90,135,180,225,270,315].map(a => { const r = a*Math.PI/180; return `<line x1="${cx+23*Math.cos(r)}" y1="${cy+23*Math.sin(r)}" x2="${cx+31*Math.cos(r)}" y2="${cy+31*Math.sin(r)}" stroke="${on}" stroke-width="2.5" stroke-linecap="round"/>`; }).join('') : '') +
    `<line x1="${cx-9}" y1="${cy-9}" x2="${cx+9}" y2="${cy+9}" stroke="${lit ? '#fff' : off}" stroke-width="2"/><line x1="${cx+9}" y1="${cy-9}" x2="${cx-9}" y2="${cy+9}" stroke="${lit ? '#fff' : off}" stroke-width="2"/>`;
  const batt = (x, y1, y2) => `<line x1="${x-9}" y1="${y1}" x2="${x+9}" y2="${y1}" stroke="#E7ECF5" stroke-width="3"/><line x1="${x-5}" y1="${y1+8}" x2="${x+5}" y2="${y1+8}" stroke="#E7ECF5" stroke-width="3"/>`;
  let s = '', lit = false;
  if(mode === 'and'){
    lit = p && q;
    s += w(24,60,96,60,true) + sw(96,60,p,true,'p') + w(156,60,228,60,p) + sw(228,60,q,p,'q') + w(288,60,352,60,lit) + lamp(372,60,lit);
    s += w(372,77,372,108,lit) + w(372,108,24,108,lit) + w(24,108,24,72,lit) + batt(24,60);
  } else if(mode === 'or'){
    lit = p || q;
    s += w(24,70,96,70,true) + w(96,40,96,100,true) + w(96,40,150,40,true) + sw(150,40,p,true,'p') + w(210,40,300,40,p) +
         w(96,100,150,100,true) + sw(150,100,q,true,'q') + w(210,100,300,100,q) + w(300,40,300,100,lit) + w(300,70,355,70,lit) + lamp(372,70,lit);
    s += w(372,87,372,128,lit) + w(372,128,24,128,lit) + w(24,128,24,82,lit) + batt(24,70);
  } else {
    lit = p !== q;
    const pt = [140,40], pb = [140,100], qt = [280,40], qb = [280,100];
    s += w(24,70,110,70,true) + dotc(110,70,true) + dotc(310,70,lit) + w(310,70,355,70,lit) + lamp(372,70,lit);
    s += w(110,70,140,p ? 40 : 100,true);
    s += w(140,40,280,100,p) + w(140,100,280,40,!p);
    s += w(310,70,280,q ? 40 : 100,lit);
    s += [pt,pb,qt,qb].map(c => dotc(c[0], c[1], false)).join('');
    s += `<text x="110" y="124" text-anchor="middle" font-size="12" fill="#8B96AD">p=${V(p)}</text><text x="310" y="124" text-anchor="middle" font-size="12" fill="#8B96AD">q=${V(q)}</text>`;

function tfQuiz(items){

/* clasificador por filas */
function sortRows(items, options){
  const box = el('div', 'viz-col'); box.style.width = '100%'; box.style.alignItems = 'stretch';
  const stats = el('div', 'stats'); const sOk = el('div', 'stat c1', '<span class="l">acertadas</span><span class="v">0</span>'), sTot = el('div', 'stat', `<span class="l">total</span><span class="v">${items.length}</span>`);
  stats.append(sOk, sTot); box.appendChild(stats);
  const answered = new Set(); let good = 0;
  items.forEach((it, idx) => {
    const row = el('div', 'qrow'); const tx = el('div', 'tx', it.t); const opts = el('div', 'opts'); const fb = el('div', 'fb');
    options.forEach(o => {
      const b = el('button', 'toggle-btn', o.label); b.type = 'button';
      b.addEventListener('click', () => {

        if(ok && !answered.has(idx)){ answered.add(idx); good++; sOk.querySelector('.v').textContent = good; }
        opts.querySelectorAll('button').forEach(x => x.classList.remove('good', 'bad'));
        b.classList.add(ok ? 'good' : 'bad');

const stepF = x => x >= 0 ? 1 : 0, sigm = x => 1 / (1 + Math.exp(-x));
const GATE_T = { AND:(a, b) => a & b, OR:(a, b) => a | b, NAND:(a, b) => 1 - (a & b), NOR:(a, b) => 1 - (a | b), XOR:(a, b) => a ^ b, XNOR:(a, b) => 1 - (a ^ b) };

function neuronSvg(a, w, b, y, hasTwo = true){

    <circle cx="${X0}" cy="${yy}" r="18" fill="rgba(94,234,212,${0.1 + 0.5 * a[i]})" stroke="#5EEAD4" stroke-width="2"/><text x="${X0}" y="${yy + 4}" fill="#E7ECF5" font-size="12" text-anchor="middle">${f2(a[i])}</text><text x="${X0}" y="${yy - 26}" fill="#8B96AD" font-size="11" text-anchor="middle">a${i + 1}</text>`; });
  s += `<circle cx="${X1}" cy="${Yc}" r="26" fill="rgba(229,80,21,${0.12 + 0.6 * y})" stroke="#E55015" stroke-width="2.6"/><text x="${X1}" y="${Yc + 4}" fill="#E7ECF5" font-size="13" text-anchor="middle" font-weight="600">y = ${f2(y)}</text>
    <line x1="${X1 + 26}" y1="${Yc}" x2="${X1 + 56}" y2="${Yc}" stroke="#E55015" stroke-width="3" opacity="${0.25 + 0.75 * y}"/><text x="${X1}" y="${Yc - 36}" fill="#8B96AD" font-size="11" text-anchor="middle">sesgo b = ${f2(b)}</text>`;
  return `<svg viewBox="0 0 330 200" width="100%" style="max-width:340px;display:block;margin:0 auto" role="img" aria-label="Neurona con dos entradas, salida ${f2(y)}">${s}</svg>`;
}

/* ---------- PASO 1: una neurona ---------- */
steps.push({

/* ---------- PASO 2: puertas con una neurona ---------- */
const FIT = {}; (() => { Object.keys(GATE_T).forEach(g => { let n = 0; GRID.forEach(w1 => GRID.forEach(w2 => GRID.forEach(b => { if(ROWS.every(([x, y]) => stepF(w1 * x + w2 * y + b) === GATE_T[g](x, y))) n++; }))); FIT[g] = n; }); })();

    stage.appendChild(el('div', 'formula', `Para AND, OR, NAND y NOR hay <b>muchísimas</b> neuronas que sirven. Para <b>XOR y XNOR hay ${FIT.XOR + FIT.XNOR}</b>: <b>ninguna neurona sola</b> puede calcularlos.<br>Motivo: una neurona traza <i>una recta</i> y separa los puntos en dos lados; con XOR, los unos (1,0) y (0,1) y los ceros (0,0) y (1,1) están «cruzados» y ninguna recta los separa.<br>Prueba: XOR exigiría b &lt; 0, ω₁ + b ≥ 0, ω₂ + b ≥ 0 y ω₁ + ω₂ + b &lt; 0. Sumando las dos del medio, ω₁ + ω₂ + 2b ≥ 0, es decir, ω₁ + ω₂ + b ≥ −b &gt; 0, lo que contradice la cuarta condición. (La búsqueda en rejilla solo lo ilustra.)`));

/* ---------- PASO 4: dos capas ---------- */
steps.push({

  desc:'XOR se puede escribir como <b>(x ∨ y) ∧ ¬(x ∧ y)</b>: una neurona OR, una NAND y una AND que las junta. Eso es una <b>red de dos capas</b>: entrada → capa oculta (OR, NAND) → salida (AND). Cambia las entradas y sigue la señal; «estropea» un sesgo y mira qué fila falla.',
  render(stage){
    let x = 1, y = 0, broken = false; const tx = toggleBtn('x', true, v => { x = V(v); upd(); }, ['1', '0']), ty = toggleBtn('y', false, v => { y = V(v); upd(); }, ['1', '0']), brk = chipBtn('Estropear el sesgo de la neurona OR', false, bt => { broken = !broken; bt.classList.toggle('active', broken); upd(); });
    const sw = el('div', 'btn-row'); sw.append(tx.el, ty.el, brk); const box = el('div'), out = el('div', 'formula'), tb = el('div', 'tbl-wrap');
    const net = (a, b, br) => { const h1 = stepF(a + b + (br ? -1.5 : -0.5)), h2 = stepF(-a - b + 1.5), o = stepF(h1 + h2 - 1.5); return { h1, h2, o }; };
    function upd(){
      const r = net(x, y, broken); let s = '';
      const IN = [[40, 70], [40, 150]], HD = [[170, 55], [170, 165]], OU = [150 + 150, 110];
      const col = v => v ? '#E55015' : '#3a4a6b';
      IN.forEach((p, i) => HD.forEach((h, j) => { const wv = j === 0 ? 1 : -1; s += `<line x1="${p[0] + 18}" y1="${p[1]}" x2="${h[0] - 20}" y2="${h[1]}" stroke="${wv > 0 ? '#E55015' : '#F472B6'}" stroke-width="2.2" opacity="${(i ? y : x) ? .95 : .3}"/>`; }));
      HD.forEach((h, j) => { s += `<line x1="${h[0] + 20}" y1="${h[1]}" x2="${OU[0] - 24}" y2="${OU[1]}" stroke="#E55015" stroke-width="2.2" opacity="${(j ? r.h2 : r.h1) ? .95 : .3}"/>`; });
      IN.forEach((p, i) => { s += `<circle cx="${p[0]}" cy="${p[1]}" r="18" fill="${(i ? y : x) ? 'rgba(94,234,212,.5)' : '#17233A'}" stroke="#5EEAD4" stroke-width="2"/><text x="${p[0]}" y="${p[1] + 4}" fill="#E7ECF5" font-size="12" text-anchor="middle">${i ? y : x}</text><text x="${p[0]}" y="${p[1] - 26}" fill="#8B96AD" font-size="11" text-anchor="middle">${i ? 'y' : 'x'}</text>`; });
      [['OR', r.h1], ['NAND', r.h2]].forEach(([n, v], j) => { s += `<circle cx="${HD[j][0]}" cy="${HD[j][1]}" r="22" fill="${v ? 'rgba(229,80,21,.45)' : '#17233A'}" stroke="${col(v)}" stroke-width="2.4"/><text x="${HD[j][0]}" y="${HD[j][1] + 4}" fill="#E7ECF5" font-size="11" text-anchor="middle">${n}=${v}</text>`; });
      s += `<circle cx="${OU[0]}" cy="${OU[1]}" r="25" fill="${r.o ? 'rgba(229,80,21,.55)' : '#17233A'}" stroke="${col(r.o)}" stroke-width="2.6"/><text x="${OU[0]}" y="${OU[1] + 4}" fill="#E7ECF5" font-size="11" text-anchor="middle">AND=${r.o}</text><line x1="${OU[0] + 25}" y1="${OU[1]}" x2="${OU[0] + 60}" y2="${OU[1]}" stroke="${col(r.o)}" stroke-width="3"/>`;
      s += `<text x="40" y="196" fill="#8B96AD" font-size="11" text-anchor="middle">entrada</text><text x="170" y="196" fill="#8B96AD" font-size="11" text-anchor="middle">capa oculta</text><text x="${OU[0]}" y="196" fill="#8B96AD" font-size="11" text-anchor="middle">salida</text>`;
      box.innerHTML = `<svg viewBox="0 0 400 205" width="100%" style="max-width:420px;display:block;margin:0 auto" role="img" aria-label="Red de dos capas para XOR">${s}</svg>`;
      out.innerHTML = `x = ${x}, y = ${y} → OR(x,y) = <b>${r.h1}</b>, NAND(x,y) = <b>${r.h2}</b> → salida = AND(${r.h1}, ${r.h2}) = <span class="${r.o ? 'ok' : 'no'}">${r.o}</span> · XOR esperado: ${vtag(x ^ y)} ${r.o === (x ^ y) ? '✔' : '<span class="no">✘ falla</span>'}`; out.classList.toggle('win', r.o === (x ^ y));
      const t = el('table', 'dt'); t.innerHTML = '<tr><th>x</th><th>y</th><th>OR</th><th>NAND</th><th class="res">red</th><th>XOR</th><th></th></tr>' + ROWS.map(([a, b]) => { const q = net(a, b, broken); return `<tr class="${q.o === (a ^ b) ? '' : 'bad'}${a === x && b === y ? ' hl' : ''}"><td>${a}</td><td>${b}</td><td>${q.h1}</td><td>${q.h2}</td><td>${vtag(q.o)}</td><td>${vtag(a ^ b)}</td><td>${q.o === (a ^ b) ? '✔' : '✘'}</td></tr>`; }).join(''); tb.innerHTML = ''; tb.appendChild(t);
    }
    stage.append(sw, box, out, tb);
    stage.appendChild(el('p', 'pad-note', '<b>La idea de fondo del aprendizaje profundo:</b> capas de neuronas simples, cada una trazando rectas, se combinan en fronteras que ninguna puede dibujar sola. Con más capas y miles de neuronas se reconocen imágenes o texto. Los pesos, en la práctica, se aprenden (retropropagación) en lugar de elegirse a mano.'));
    upd();
  }
});

/* ---------- PASO 5: resumen ---------- */
steps.push({
  name:'Resumen y código', short:'5 Resumen', shape:null,
  desc:'Una neurona es una suma ponderada más una activación; una red es un grafo de neuronas. Las cifras de abajo las calcula la página con las mismas reglas.',
  render(stage){
    const T = el('div', 'tbl-wrap'); T.innerHTML = `<table class="dt"><tr><th>Elemento</th><th>En el grafo</th></tr><tr><td>Neurona i</td><td>vértice con estado aᵢ ∈ [0,1]</td></tr><tr><td>Peso ωⱼ,ᵢ</td><td>etiqueta de la arista dirigida (j, i)</td></tr><tr><td>Sesgo bᵢ</td><td>umbral de la neurona</td></tr><tr><td>Activación fᵢ</td><td>f(Σ ωⱼ,ᵢ aⱼ + bᵢ), de ℝ a [0,1]</td></tr></table>`; stage.appendChild(T);
    stage.appendChild(el('div', 'panel-title c1', 'En Python'));
    stage.appendChild(codeBox(`def f(x):                      # activación escalón
    return 1 if x >= 0 else 0

def neurona(entradas, pesos, sesgo):
    return f(sum(w * a for w, a in zip(pesos, entradas)) + sesgo)

AND = lambda a, b: neurona([a, b], [1, 1], -1.5)
OR  = lambda a, b: neurona([a, b], [1, 1], -0.5)
NAND = lambda a, b: neurona([a, b], [-1, -1], 1.5)
XOR = lambda a, b: AND(OR(a, b), NAND(a, b))      # red de dos capas

for a, b in [(1, 1), (1, 0), (0, 1), (0, 0)]:
    print(a, b, AND(a, b), OR(a, b), XOR(a, b))`));
    stage.appendChild(el('div', 'viz-label', 'Salida del programa (calculada aquí con las mismas reglas):'));
    stage.appendChild(codeBox(ROWS.map(([a, b]) => { const h1 = stepF(a + b - 0.5), h2 = stepF(-a - b + 1.5); return `${a} ${b} ${stepF(a + b - 1.5)} ${stepF(a + b - 0.5)} ${stepF(h1 + h2 - 1.5)}`; }).join('\n')));
    stage.appendChild(el('div', 'panel-title c3', 'Errores frecuentes'));
    const errs = el('div', 'bio-text'); errs.innerHTML = `<p><b>1.</b> Olvidar el sesgo: sin él, una neurona con ω = (1, 1) no puede hacer un AND (necesita un sesgo b ∈ [−2, −1); por ejemplo, −1,5).</p>
      <p><b>2.</b> Creer que una neurona puede aprender cualquier función: XOR es la prueba de que no.</p>
      <p><b>3.</b> Confundir peso con sesgo: el peso multiplica una entrada, el sesgo se suma una sola vez.</p>
      <p><b>4.</b> Pensar que el aprendizaje «programa» la lógica: solo ajusta números; la lógica emerge de los pesos.</p>`;
    stage.appendChild(errs); stage.appendChild(qcards(QUESTIONS));
  }
});

/* =========================================================
   Motor de navegación (idéntico en todas las actividades)
========================================================= */
let current = 0;
function renderTrail(){
  const tr = $('#trail'); tr.innerHTML = '';
  steps.forEach((s, i) => { const b = el('button', null, s.short); b.type = 'button'; b.addEventListener('click', () => goTo(i)); tr.appendChild(b); });
}
function goTo(i){
  current = i;
  clearTimers();
  const s = steps[current];
  $('#stepCount').textContent = current === 0 ? 'Introducción' : `Paso ${current} de ${steps.length - 1}`;
  $('#stepTitle').textContent = s.name;
  $('#stepDesc').innerHTML = s.desc;
  const chip = $('#shapeChip');
  if(s.shape){ chip.style.display = ''; chip.innerHTML = `<b>${s.shape}</b>`; } else chip.style.display = 'none';
  const stage = $('#stage'); stage.innerHTML = '';
  s.render(stage);
  const btns = document.querySelectorAll('.trail button');
  btns.forEach((b, idx) => b.classList.toggle('active', idx === current));
  if(btns[current]) btns[current].scrollIntoView({ block:'nearest', inline:'center' });
  $('#prevBtn').disabled = current === 0;
  $('#nextBtn').textContent = current === steps.length - 1 ? 'Volver al inicio ↺' : 'Siguiente →';
  window.scrollTo(0, 0);
}
$('#prevBtn').addEventListener('click', () => { if(current > 0) goTo(current - 1); });
$('#nextBtn').addEventListener('click', () => goTo(current === steps.length - 1 ? 0 : current + 1));
document.addEventListener('keydown', e => {
  if(e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT')) return;
  if(e.key === 'ArrowRight') $('#nextBtn').click();
  if(e.key === 'ArrowLeft') $('#prevBtn').click();
});
renderTrail(); goTo(0);
</script>
