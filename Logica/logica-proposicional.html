<script>
/* =========================================================
   Utilidades
========================================================= */
const $ = s => document.querySelector(s);
let timers = [];
function clearTimers(){ timers.forEach(t => clearInterval(t)); timers = []; }
function el(tag, cls, html){ const e = document.createElement(tag); if(cls) e.className = cls; if(html != null) e.innerHTML = html; return e; }
const V = x => x ? 1 : 0;
const vtag = x => `<span class="tv v${V(x)}">${V(x)}</span>`;
const lower1 = s => s.charAt(0).toLowerCase() + s.slice(1);

function py(code){
  return code.replace(/&/g, '&amp;').replace(/</g, '&lt;').split('\n').map(l => {
    const k = l.indexOf('#'); let body = l, cm = '';
    if(k >= 0){ body = l.slice(0, k); cm = '<span class="cm">' + l.slice(k) + '</span>'; }
    body = body.replace(/\b(import|from|as|print|def|return|not|and|or|for|in)\b/g, '<span class="kw">$1</span>');
    return body + cm;
  }).join('\n');
}
function codeBox(code){ const p = el('pre', 'code'); p.innerHTML = py(code); return p; }

/* ---------- lógica: todas las combinaciones, en el orden de las diapositivas (1,1 / 1,0 / 0,1 / 0,0) ---------- */
function combos(vars){
  const n = vars.length, out = [];
  for(let i = 0; i < (1 << n); i++){ const e = {}; vars.forEach((v, k) => e[v] = !((i >> (n-1-k)) & 1)); out.push(e); }
  return out;
}
const sameEnv = (a, b) => Object.keys(a).every(k => a[k] === b[k]);
const OPS = {
  and: { sym:'∧', f:(p, q) => p && q },
  or:  { sym:'∨', f:(p, q) => p || q },
  xor: { sym:'⊻', f:(p, q) => p !== q },
  imp: { sym:'→', f:(p, q) => !p || q },
  iff: { sym:'↔', f:(p, q) => p === q }
};
function classify(f, vars){
  const vals = combos(vars).map(f);
  return vals.every(Boolean) ? 'T' : (vals.every(v => !v) ? 'C' : 'K');
}
const CLS = { T:'Tautología', C:'Contradicción', K:'Contingencia' };

/* tabla de verdad viva: highlight de la fila actual; clic en fila = elegir esos valores */
function makeTable(vars, cols, onPick, rowClass){
  const wrap = el('div', 'tbl-wrap'), t = el('table', 'dt'); wrap.appendChild(t);
  const head = el('tr'); const ths = [];
  vars.forEach(v => head.appendChild(el('th', null, v)));
  cols.forEach(c => { const th = el('th', c.res === false ? '' : 'res', c.h); ths.push(th); head.appendChild(th); });
  t.appendChild(head);
  const rows = combos(vars).map(env => {
    const tr = el('tr', onPick ? 'pick' : ''); tr._env = env;
    vars.forEach(v => tr.appendChild(el('td', null, vtag(env[v]))));
    cols.forEach(c => tr.appendChild(el('td', null, vtag(c.f(env)))));
    if(rowClass){ const rc = rowClass(env); if(rc) tr.classList.add(rc); }
    if(onPick) tr.addEventListener('click', () => onPick(env));
    t.appendChild(tr); return tr;
  });
  return { el: wrap, setHead:(i, txt) => { ths[i].innerHTML = txt; }, set: env => rows.forEach(r => r.classList.toggle('hl', !!env && sameEnv(r._env, env))) };
}

/* interruptor 1/0 */
function toggleBtn(name, init, cb, subs){
  let val = init; const b = el('button', 'tg'); b.type = 'button';
  function draw(){
    b.className = 'tg ' + (val ? 'on' : 'off');
    b.innerHTML = `<b>${name} = ${V(val)}</b><small>${val ? (subs ? subs[0] : 'verdadera') : (subs ? subs[1] : 'falsa')}</small>`;
    b.setAttribute('aria-pressed', val); b.setAttribute('aria-label', `${name} vale ${V(val)}`);
  }
  b.addEventListener('click', () => { val = !val; draw(); cb(val); });
  draw();
  return { el:b, get:() => val, set:v => { val = v; draw(); } };
}

/* ---------- circuitos (analogía física) ---------- */
function circuit(mode, p, q){
  const on = '#E55015', off = '#3a4a6b';
  const w = (x1, y1, x2, y2, lit) => `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${lit ? on : off}" stroke-width="3.5" stroke-linecap="round"/>`;
  const dotc = (x, y, lit) => `<circle cx="${x}" cy="${y}" r="3.6" fill="${lit ? on : off}"/>`;
  const sw = (x, y, closed, lit, lab) => w(x, y, closed ? x+60 : x+54, closed ? y : y-26, closed && lit) + dotc(x, y, lit) + dotc(x+60, y, closed && lit) +
    `<text x="${x+30}" y="${y+22}" text-anchor="middle" font-size="12" fill="#8B96AD">${lab}=${V(closed)}</text>`;
  const lamp = (cx, cy, lit) => `<circle cx="${cx}" cy="${cy}" r="17" fill="${lit ? on : '#17233A'}" stroke="${lit ? '#ffb08a' : off}" stroke-width="2.5"/>` +
    (lit ? [0,45,90,135,180,225,270,315].map(a => { const r = a*Math.PI/180; return `<line x1="${cx+23*Math.cos(r)}" y1="${cy+23*Math.sin(r)}" x2="${cx+31*Math.cos(r)}" y2="${cy+31*Math.sin(r)}" stroke="${on}" stroke-width="2.5" stroke-linecap="round"/>`; }).join('') : '') +
    `<line x1="${cx-9}" y1="${cy-9}" x2="${cx+9}" y2="${cy+9}" stroke="${lit ? '#fff' : off}" stroke-width="2"/><line x1="${cx+9}" y1="${cy-9}" x2="${cx-9}" y2="${cy+9}" stroke="${lit ? '#fff' : off}" stroke-width="2"/>`;
  const batt = (x, y1, y2) => `<line x1="${x-9}" y1="${y1}" x2="${x+9}" y2="${y1}" stroke="#E7ECF5" stroke-width="3"/><line x1="${x-5}" y1="${y1+8}" x2="${x+5}" y2="${y1+8}" stroke="#E7ECF5" stroke-width="3"/>`;
  let s = '', lit = false;
  if(mode === 'and'){
    lit = p && q;
    s += w(24,60,96,60,true) + sw(96,60,p,true,'p') + w(156,60,228,60,p) + sw(228,60,q,p,'q') + w(288,60,352,60,lit) + lamp(372,60,lit);
    s += w(372,77,372,108,lit) + w(372,108,24,108,lit) + w(24,108,24,72,lit) + batt(24,60);
  } else if(mode === 'or'){
    lit = p || q;
    s += w(24,70,96,70,true) + w(96,40,96,100,true) + w(96,40,150,40,true) + sw(150,40,p,true,'p') + w(210,40,300,40,p) +
         w(96,100,150,100,true) + sw(150,100,q,true,'q') + w(210,100,300,100,q) + w(300,40,300,100,lit) + w(300,70,355,70,lit) + lamp(372,70,lit);
    s += w(372,87,372,128,lit) + w(372,128,24,128,lit) + w(24,128,24,82,lit) + batt(24,70);
  } else {
    lit = p !== q;
    const pt = [140,40], pb = [140,100], qt = [280,40], qb = [280,100];
    s += w(24,70,110,70,true) + dotc(110,70,true) + dotc(310,70,lit) + w(310,70,355,70,lit) + lamp(372,70,lit);
    s += w(110,70,140,p ? 40 : 100,true);
    s += w(140,40,280,100,p) + w(140,100,280,40,!p);
    s += w(310,70,280,q ? 40 : 100,lit);
    s += [pt,pb,qt,qb].map(c => dotc(c[0], c[1], false)).join('');
    s += `<text x="110" y="124" text-anchor="middle" font-size="12" fill="#8B96AD">p=${V(p)}</text><text x="310" y="124" text-anchor="middle" font-size="12" fill="#8B96AD">q=${V(q)}</text>`;
    s += w(372,87,372,138,lit) + w(372,138,24,138,lit) + w(24,138,24,82,lit) + batt(24,70);
  }
  return `<svg viewBox="0 0 420 ${mode === 'xor' ? 150 : 140}" width="100%" style="max-width:420px" role="img" aria-label="Circuito con lámpara ${lit ? 'encendida' : 'apagada'}">${s}</svg>`;
}

/* cuestionario "verdadero / falso" con retroalimentación */
function tfQuiz(items){
  const box = el('div', 'viz-col'); box.style.width = '100%';
  items.forEach(it => {
    const row = el('div', 'qrow'); const tx = el('div', 'tx', it.q); const opts = el('div', 'opts'); const fb = el('div', 'fb');
    [['Verdadero (1)', true], ['Falso (0)', false]].forEach(([lab, val]) => {
      const b = el('button', 'toggle-btn', lab); b.type = 'button';
      b.addEventListener('click', () => {
        const ok = val === it.ans;
        opts.querySelectorAll('button').forEach(x => x.classList.remove('good', 'bad'));
        b.classList.add(ok ? 'good' : 'bad');
        fb.innerHTML = (ok ? '<b class="ok">✔ Correcto.</b> ' : '<b class="no">✘ Casi.</b> ') + it.why;
        row.classList.add('done');
      });
      opts.appendChild(b);
    });
    row.append(tx, opts, fb); box.appendChild(row);
  });
  return box;
}

/* clasificador por filas */
function sortRows(items, options){
  const box = el('div', 'viz-col'); box.style.width = '100%'; box.style.alignItems = 'stretch';
  const stats = el('div', 'stats'); const sOk = el('div', 'stat c1', '<span class="l">acertadas</span><span class="v">0</span>'), sTot = el('div', 'stat', `<span class="l">total</span><span class="v">${items.length}</span>`);
  stats.append(sOk, sTot); box.appendChild(stats);
  const answered = new Set(); let good = 0;
  items.forEach((it, idx) => {
    const row = el('div', 'qrow'); const tx = el('div', 'tx', it.t); const opts = el('div', 'opts'); const fb = el('div', 'fb');
    options.forEach(o => {
      const b = el('button', 'toggle-btn', o.label); b.type = 'button';
      b.addEventListener('click', () => {
        const ok = o.k === it.a;
        if(ok && !answered.has(idx)){ answered.add(idx); good++; sOk.querySelector('.v').textContent = good; }
        opts.querySelectorAll('button').forEach(x => x.classList.remove('good', 'bad'));
        b.classList.add(ok ? 'good' : 'bad');
        fb.innerHTML = (ok ? '<b class="ok">✔ </b>' : '<b class="no">✘ Prueba otra vez. </b>') + (ok ? it.why : (it.hint || 'Piensa qué se puede afirmar de ella.'));
        row.classList.toggle('done', ok);
      });
      opts.appendChild(b);
    });
    row.append(tx, opts, fb); box.appendChild(row);
  });
  return box;
}

function connectorStep(cfg){
  return {
    name:cfg.name, short:cfg.short, shape:cfg.shape, desc:cfg.desc,
    render(stage){
      let p = true, q = true, arith = false;
      const svgBox = el('div'), reading = el('div', 'formula');
      const tbl = makeTable(['p', 'q'], [{ h:`p ${cfg.sym} q`, f:e => cfg.f(e.p, e.q) }], env => { tp.set(env.p); tq.set(env.q); p = env.p; q = env.q; update(); });
      const tp = toggleBtn('p', p, v => { p = v; update(); }, cfg.subs && cfg.subs[0]), tq = toggleBtn('q', q, v => { q = v; update(); }, cfg.subs && cfg.subs[1]);
      const row = el('div', 'viz-row'), left = el('div', 'viz-col'), right = el('div', 'viz-col');
      left.append(el('div', 'panel-title c1', cfg.analogTitle), svgBox, el('div', 'viz-label', cfg.analogNote));
      const sws = el('div', 'btn-row'); sws.append(tp.el, tq.el);
      right.append(sws, tbl.el, reading);
      if(cfg.arith){
        const ab = el('button', 'toggle-btn', `Ver ${cfg.sym} como "${cfg.arith.op}" (aritmética 0/1)`); ab.type = 'button';
        ab.addEventListener('click', () => { arith = !arith; ab.classList.toggle('active', arith); update(); });
        right.appendChild(ab);
      }
      row.append(left, right); stage.appendChild(row);
      stage.appendChild(el('div', 'panel-title c2', 'Ejercicio de las diapositivas'));
      stage.appendChild(el('p', 'pad-note', `p: ${FACT.p.t} · q: ${FACT.q.t} · r: ${FACT.r.t}`));
      stage.appendChild(tfQuiz(cfg.quiz.map(z => ({ q:`<b>${z.s}</b>`, ans:z.f(FACT.p.v, z.b.v), why:`Sustituyendo valores: ${z.l} = ${V(z.f(FACT.p.v, z.b.v))}. ${z.why || ''}` }))));
      function update(){
        svgBox.innerHTML = circuit(cfg.mode, p, q);
        const res = cfg.f(p, q);
        tbl.set({ p, q });
        if(arith) tbl.setHead(0, `p ${cfg.arith.op} q`); else tbl.setHead(0, `p ${cfg.sym} q`);
        reading.innerHTML = (arith ? `En números: ${V(p)} ${cfg.arith.op} ${V(q)} = <b>${cfg.arith.calc(V(p), V(q))}</b>${cfg.arith.note ? ' (' + cfg.arith.note + ')' : ''}. ` : '') +
          cfg.read(p, q, res);
        reading.classList.toggle('win', res);
      }
      update();
    }
  };
}

      tblBox.innerHTML = ''; tblBox.appendChild(makeTable(['p', 'q'], [{ h:'A: ' + A.s, f:A.f }, { h:'B: ' + B.s, f:B.f }], null, e => A.f(e) !== B.f(e) ? 'bad' : '').el);
    }
    PRE.forEach(pz => { const b = el('button', 'toggle-btn', pz.n); b.type = 'button'; b.addEventListener('click', () => { selA.value = EQ.findIndex(e => e.k === pz.a); selB.value = EQ.findIndex(e => e.k === pz.b); presets.querySelectorAll('button').forEach(x => x.classList.toggle('active', x === b)); ex.innerHTML = '<b>En palabras:</b> ' + pz.ej; cmp(); }); presets.appendChild(b); });
    [selA, selB].forEach(s => s.addEventListener('change', () => { presets.querySelectorAll('button').forEach(x => x.classList.remove('active')); ex.innerHTML = ''; cmp(); }));
    const sr = el('div', 'btn-row'); sr.append(el('span', 'viz-label', 'A ='), selA, el('span', 'viz-label', 'B ='), selB);
    stage.append(presets, sr, res, tblBox, ex);
    stage.appendChild(el('p', 'pad-note', 'Comprueba <b>p → q</b> frente a su <b>recíproco</b> (q → p): se confunden mucho en los razonamientos de la vida diaria, y aquí ves que NO son lo mismo. Con el <b>contrarrecíproco</b> sí.'));
    presets.firstChild.click();
  }
});

/* =========================================================
   PASO 13 · Propiedades / leyes
========================================================= */
const bit = v => v ? 1 : 0;
const LAWS = [
  { g:'Asociatividad', l:'p · (q · r)', r:'(p · q) · r', vs:['p', 'q', 'r'], fl:e => e.p && (e.q && e.r), fr:e => (e.p && e.q) && e.r },
  { g:'Asociatividad', l:'p + (q + r)', r:'(p + q) + r', vs:['p', 'q', 'r'], fl:e => e.p || (e.q || e.r), fr:e => (e.p || e.q) || e.r },
  { g:'Conmutatividad', l:'p · q', r:'q · p', vs:['p', 'q'], fl:e => e.p && e.q, fr:e => e.q && e.p },
  { g:'Conmutatividad', l:'p + q', r:'q + p', vs:['p', 'q'], fl:e => e.p || e.q, fr:e => e.q || e.p },
  { g:'Distributiva', l:'p · (q + r)', r:'(p · q) + (p · r)', vs:['p', 'q', 'r'], fl:e => e.p && (e.q || e.r), fr:e => (e.p && e.q) || (e.p && e.r) },
  { g:'Distributiva', l:'p + (q · r)', r:'(p + q) · (p + r)', vs:['p', 'q', 'r'], fl:e => e.p || (e.q && e.r), fr:e => (e.p || e.q) && (e.p || e.r) },
  { g:'Complemento', l:'p · ¬p', r:'0', vs:['p'], fl:e => e.p && !e.p, fr:e => false },
  { g:'Complemento', l:'p + ¬p', r:'1', vs:['p'], fl:e => e.p || !e.p, fr:e => true },
  { g:'Absorción por 0/1', l:'p · 0', r:'0', vs:['p'], fl:e => e.p && false, fr:e => false },
  { g:'Absorción por 0/1', l:'p + 1', r:'1', vs:['p'], fl:e => e.p || true, fr:e => true },
  { g:'Neutros', l:'p · 1', r:'p', vs:['p'], fl:e => e.p && true, fr:e => e.p },
  { g:'Neutros', l:'p + 0', r:'p', vs:['p'], fl:e => e.p || false, fr:e => e.p },
  { g:'Idempotencia', l:'p · p', r:'p', vs:['p'], fl:e => e.p && e.p, fr:e => e.p },
  { g:'Idempotencia', l:'p + p', r:'p', vs:['p'], fl:e => e.p || e.p, fr:e => e.p },
  { g:'Absorción', l:'p · (p + q)', r:'p', vs:['p', 'q'], fl:e => e.p && (e.p || e.q), fr:e => e.p },
  { g:'Absorción', l:'p + (p · q)', r:'p', vs:['p', 'q'], fl:e => e.p || (e.p && e.q), fr:e => e.p },
  { g:'Doble negación', l:'¬¬p', r:'p', vs:['p'], fl:e => !(!e.p), fr:e => e.p },
  { g:'De Morgan', l:'¬(p · q)', r:'¬p + ¬q', vs:['p', 'q'], fl:e => !(e.p && e.q), fr:e => !e.p || !e.q },
  { g:'De Morgan', l:'¬(p + q)', r:'¬p · ¬q', vs:['p', 'q'], fl:e => !(e.p || e.q), fr:e => !e.p && !e.q }
];
steps.push({
  name:'Las leyes del álgebra de proposiciones', short:'13 Propiedades', shape:'· = ∧   + = ∨',
  desc:'Las leyes que ves en las diapositivas no hay que memorizarlas: se pueden <b>comprobar</b>. Aquí "·" es ∧ y "+" es ∨. Elige una ley y el programa prueba <b>todas</b> las combinaciones de valores.',
  render(stage){
    const groups = [...new Set(LAWS.map(l => l.g))]; const gbar = el('div', 'btn-row'), lbar = el('div', 'btn-row'), res = el('div', 'formula'), tblBox = el('div'); let gcur = groups[0];
    function showLaw(L){
      lbar.querySelectorAll('button').forEach(b => b.classList.toggle('active', b._law === L));
      const rows = combos(L.vs); const okc = rows.filter(e => L.fl(e) === L.fr(e)).length;
      res.innerHTML = `<b>${L.g}</b>: ${L.l} = ${L.r}<br>Comprobada en <b>${okc} de ${rows.length}</b> combinaciones → <span class="${okc === rows.length ? 'ok' : 'no'}">${okc === rows.length ? 'la ley se cumple siempre' : 'no se cumple'}</span>.`;
      res.classList.toggle('win', okc === rows.length);
      tblBox.innerHTML = ''; tblBox.appendChild(makeTable(L.vs, [{ h:L.l, f:L.fl }, { h:L.r, f:L.fr }], null, e => L.fl(e) !== L.fr(e) ? 'bad' : '').el);
    }
    function showGroup(g){
      gcur = g; gbar.querySelectorAll('button').forEach(b => b.classList.toggle('active', b.textContent === g)); lbar.innerHTML = '';
      LAWS.filter(l => l.g === g).forEach(L => { const b = el('button', 'toggle-btn', `${L.l} = ${L.r}`); b._law = L; b.type = 'button'; b.addEventListener('click', () => showLaw(L)); lbar.appendChild(b); });
      lbar.firstChild.click();
    }
    groups.forEach(g => { const b = el('button', 'toggle-btn', g); b.type = 'button'; b.addEventListener('click', () => showGroup(g)); gbar.appendChild(b); });
    stage.append(gbar, lbar, res, tblBox);
    stage.appendChild(el('p', 'pad-note', '<b>¿Por qué "·" y "+"?</b> Con 0 y 1: ∧ funciona como el producto (1·1 = 1, el resto 0) y ∨ como la suma donde 1 + 1 = 1. Por eso estas leyes se parecen a las del álgebra de siempre; la distributiva de "+" sobre "·" es la que <b>no</b> existe en los números.'));
    showGroup(groups[0]);
  }
});

/* =========================================================
   PASO 14 · Resumen
========================================================= */
steps.push({
  name:'Resumen y código', short:'14 Resumen', shape:null,
  desc:'Todo lo anterior cabe en una tabla de seis columnas y unas pocas líneas de Python. Las cifras de abajo no están escritas a mano: las calcula la página.',
  render(stage){
    const cols = [{ h:'p ∧ q', f:e => e.p && e.q }, { h:'p ∨ q', f:e => e.p || e.q }, { h:'p ⊻ q', f:e => e.p !== e.q }, { h:'p → q', f:e => !e.p || e.q }, { h:'p ↔ q', f:e => e.p === e.q }, { h:'¬p', f:e => !e.p }];
    stage.appendChild(makeTable(['p', 'q'], cols).el);
    stage.appendChild(el('div', 'panel-title c1', 'En Python (los mismos conectores)'));
    stage.appendChild(codeBox(`from itertools import product

def implica(p, q):            # p → q  ≡  ¬p ∨ q
    return (not p) or q

def sii(p, q):                # p ↔ q
    return p == q

for p, q in product([True, False], repeat=2):
    print(int(p), int(q),
          int(p and q),       # ∧
          int(p or q),        # ∨
          int(p != q),        # ⊻
          int(implica(p, q)), # →
          int(sii(p, q)),     # ↔
          int(not p))         # ¬`));
    const outLines = combos(['p', 'q']).map(e => [e.p, e.q, e.p && e.q, e.p || e.q, e.p !== e.q, !e.p || e.q, e.p === e.q, !e.p].map(bit).join(' '));
    stage.appendChild(el('div', 'viz-label', 'Salida del programa (calculada aquí con las mismas reglas):'));
    stage.appendChild(codeBox(outLines.join('\n')));
    stage.appendChild(el('div', 'panel-title c3', 'Errores frecuentes'));
    const errs = el('div', 'bio-text'); errs.innerHTML = `<p><b>1.</b> Creer que <i>p → q</i> es falsa cuando p es falsa. Falso: con p = 0 la promesa no se rompe, vale 1.</p>
      <p><b>2.</b> Confundir <i>p → q</i> con su recíproco <i>q → p</i>. No son equivalentes; el que sí lo es es el contrarrecíproco <i>¬q → ¬p</i>.</p>
      <p><b>3.</b> Pensar que "o" excluye al "y". En lógica, <i>∨</i> es inclusiva: 1 ∨ 1 = 1. Para "o … o …" se usa ⊻.</p>
      <p><b>4.</b> Negar mal: ¬(p ∧ q) NO es ¬p ∧ ¬q, sino ¬p ∨ ¬q (De Morgan).</p>
      <p><b>5.</b> Pensar que una proposición debe ser cierta. Basta con que tenga <i>valor de verdad</i>: "4 > 5" es proposición (falsa).</p>`;
    stage.appendChild(errs);
    stage.appendChild(qcards(QUESTIONS));
  }
});

/* =========================================================
   Motor de navegación (idéntico en todas las actividades)
========================================================= */
let current = 0;
function renderTrail(){
  const tr = $('#trail'); tr.innerHTML = '';
  steps.forEach((s, i) => { const b = el('button', null, s.short); b.type = 'button'; b.addEventListener('click', () => goTo(i)); tr.appendChild(b); });
}
function goTo(i){
  current = i;
  clearTimers();
  const s = steps[current];
  $('#stepCount').textContent = current === 0 ? 'Introducción' : `Paso ${current} de ${steps.length - 1}`;
  $('#stepTitle').textContent = s.name;
  $('#stepDesc').innerHTML = s.desc;
  const chip = $('#shapeChip');
  if(s.shape){ chip.style.display = ''; chip.innerHTML = `<b>${s.shape}</b>`; } else chip.style.display = 'none';
  const stage = $('#stage'); stage.innerHTML = '';
  s.render(stage);
  const btns = document.querySelectorAll('.trail button');
  btns.forEach((b, idx) => b.classList.toggle('active', idx === current));
  if(btns[current]) btns[current].scrollIntoView({ block:'nearest', inline:'center' });
  $('#prevBtn').disabled = current === 0;
  $('#nextBtn').textContent = current === steps.length - 1 ? 'Volver al inicio ↺' : 'Siguiente →';
  window.scrollTo(0, 0);
}
$('#prevBtn').addEventListener('click', () => { if(current > 0) goTo(current - 1); });
$('#nextBtn').addEventListener('click', () => goTo(current === steps.length - 1 ? 0 : current + 1));
document.addEventListener('keydown', e => {
  if(e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT')) return;
  if(e.key === 'ArrowRight') $('#nextBtn').click();
  if(e.key === 'ArrowLeft') $('#prevBtn').click();
});
renderTrail(); goTo(0);
</script>
