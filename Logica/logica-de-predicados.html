  select:focus,button:focus-visible{ outline:2px solid var(--cyan); outline-offset:1px; }

  .strip{ display:flex; flex-direction:column; gap:4px; align-items:center; overflow-x:auto; max-width:100%; }
  .srow{ display:flex; gap:3px; align-items:center; }

  .fnode:hover{ border-color:var(--viu); } .fnode small{ display:block; color:var(--muted); font-size:10.5px; }

  </div>
  <div class="trail" id="trail"></div>
</header>

<main>
  <div class="card">
    <div class="step-meta">
      <div>
        <p class="step-count" id="stepCount"></p>
        <h2 class="step-title" id="stepTitle"></h2>
        <p class="step-desc" id="stepDesc"></p>

  <button class="nav-btn primary" id="nextBtn">Siguiente →</button>
</footer>

<script>
/* =========================================================
   Utilidades
========================================================= */
const $ = s => document.querySelector(s);
let timers = [];
function clearTimers(){ timers.forEach(t => clearInterval(t)); timers = []; }
function el(tag, cls, html){ const e = document.createElement(tag); if(cls) e.className = cls; if(html != null) e.innerHTML = html; return e; }
const V = x => x ? 1 : 0;
const vtag = x => `<span class="tv v${V(x)}">${V(x)}</span>`;
const lower1 = s => s.charAt(0).toLowerCase() + s.slice(1);

function py(code){
  return code.replace(/&/g, '&amp;').replace(/</g, '&lt;').split('\n').map(l => {
    const k = l.indexOf('#'); let body = l, cm = '';
    if(k >= 0){ body = l.slice(0, k); cm = '<span class="cm">' + l.slice(k) + '</span>'; }
    body = body.replace(/\b(import|from|as|print|def|return|not|and|or|for|in)\b/g, '<span class="kw">$1</span>');
    return body + cm;
  }).join('\n');
}
function codeBox(code){ const p = el('pre', 'code'); p.innerHTML = py(code); return p; }

/* ---------- lógica: todas las combinaciones, en el orden de las diapositivas (1,1 / 1,0 / 0,1 / 0,0) ---------- */
function combos(vars){
  const n = vars.length, out = [];
  for(let i = 0; i < (1 << n); i++){ const e = {}; vars.forEach((v, k) => e[v] = !((i >> (n-1-k)) & 1)); out.push(e); }
  return out;
}
const sameEnv = (a, b) => Object.keys(a).every(k => a[k] === b[k]);
const OPS = {
  and: { sym:'∧', f:(p, q) => p && q },
  or:  { sym:'∨', f:(p, q) => p || q },
  xor: { sym:'⊻', f:(p, q) => p !== q },
  imp: { sym:'→', f:(p, q) => !p || q },
  iff: { sym:'↔', f:(p, q) => p === q }
};
function classify(f, vars){
  const vals = combos(vars).map(f);
  return vals.every(Boolean) ? 'T' : (vals.every(v => !v) ? 'C' : 'K');
}
const CLS = { T:'Tautología', C:'Contradicción', K:'Contingencia' };

/* tabla de verdad viva: highlight de la fila actual; clic en fila = elegir esos valores */
function makeTable(vars, cols, onPick, rowClass){
  const wrap = el('div', 'tbl-wrap'), t = el('table', 'dt'); wrap.appendChild(t);
  const head = el('tr'); const ths = [];
  vars.forEach(v => head.appendChild(el('th', null, v)));
  cols.forEach(c => { const th = el('th', c.res === false ? '' : 'res', c.h); ths.push(th); head.appendChild(th); });
  t.appendChild(head);
  const rows = combos(vars).map(env => {
    const tr = el('tr', onPick ? 'pick' : ''); tr._env = env;
    vars.forEach(v => tr.appendChild(el('td', null, vtag(env[v]))));
    cols.forEach(c => tr.appendChild(el('td', null, vtag(c.f(env)))));
    if(rowClass){ const rc = rowClass(env); if(rc) tr.classList.add(rc); }
    if(onPick) tr.addEventListener('click', () => onPick(env));
    t.appendChild(tr); return tr;
  });
  return { el: wrap, setHead:(i, txt) => { ths[i].innerHTML = txt; }, set: env => rows.forEach(r => r.classList.toggle('hl', !!env && sameEnv(r._env, env))) };
}

/* interruptor 1/0 */
function toggleBtn(name, init, cb, subs){
  let val = init; const b = el('button', 'tg'); b.type = 'button';
  function draw(){
    b.className = 'tg ' + (val ? 'on' : 'off');
    b.innerHTML = `<b>${name} = ${V(val)}</b><small>${val ? (subs ? subs[0] : 'verdadera') : (subs ? subs[1] : 'falsa')}</small>`;
    b.setAttribute('aria-pressed', val); b.setAttribute('aria-label', `${name} vale ${V(val)}`);
  }
  b.addEventListener('click', () => { val = !val; draw(); cb(val); });
  draw();
  return { el:b, get:() => val, set:v => { val = v; draw(); } };
}

/* ---------- circuitos (analogía física) ---------- */
function circuit(mode, p, q){
  const on = '#E55015', off = '#3a4a6b';
  const w = (x1, y1, x2, y2, lit) => `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${lit ? on : off}" stroke-width="3.5" stroke-linecap="round"/>`;
  const dotc = (x, y, lit) => `<circle cx="${x}" cy="${y}" r="3.6" fill="${lit ? on : off}"/>`;
  const sw = (x, y, closed, lit, lab) => w(x, y, closed ? x+60 : x+54, closed ? y : y-26, closed && lit) + dotc(x, y, lit) + dotc(x+60, y, closed && lit) +
    `<text x="${x+30}" y="${y+22}" text-anchor="middle" font-size="12" fill="#8B96AD">${lab}=${V(closed)}</text>`;
  const lamp = (cx, cy, lit) => `<circle cx="${cx}" cy="${cy}" r="17" fill="${lit ? on : '#17233A'}" stroke="${lit ? '#ffb08a' : off}" stroke-width="2.5"/>` +
    (lit ? [0,45,90,135,180,225,270,315].map(a => { const r = a*Math.PI/180; return `<line x1="${cx+23*Math.cos(r)}" y1="${cy+23*Math.sin(r)}" x2="${cx+31*Math.cos(r)}" y2="${cy+31*Math.sin(r)}" stroke="${on}" stroke-width="2.5" stroke-linecap="round"/>`; }).join('') : '') +
    `<line x1="${cx-9}" y1="${cy-9}" x2="${cx+9}" y2="${cy+9}" stroke="${lit ? '#fff' : off}" stroke-width="2"/><line x1="${cx+9}" y1="${cy-9}" x2="${cx-9}" y2="${cy+9}" stroke="${lit ? '#fff' : off}" stroke-width="2"/>`;
  const batt = (x, y1, y2) => `<line x1="${x-9}" y1="${y1}" x2="${x+9}" y2="${y1}" stroke="#E7ECF5" stroke-width="3"/><line x1="${x-5}" y1="${y1+8}" x2="${x+5}" y2="${y1+8}" stroke="#E7ECF5" stroke-width="3"/>`;
  let s = '', lit = false;
  if(mode === 'and'){
    lit = p && q;
    s += w(24,60,96,60,true) + sw(96,60,p,true,'p') + w(156,60,228,60,p) + sw(228,60,q,p,'q') + w(288,60,352,60,lit) + lamp(372,60,lit);
    s += w(372,77,372,108,lit) + w(372,108,24,108,lit) + w(24,108,24,72,lit) + batt(24,60);
  } else if(mode === 'or'){
    lit = p || q;
    s += w(24,70,96,70,true) + w(96,40,96,100,true) + w(96,40,150,40,true) + sw(150,40,p,true,'p') + w(210,40,300,40,p) +
         w(96,100,150,100,true) + sw(150,100,q,true,'q') + w(210,100,300,100,q) + w(300,40,300,100,lit) + w(300,70,355,70,lit) + lamp(372,70,lit);
    s += w(372,87,372,128,lit) + w(372,128,24,128,lit) + w(24,128,24,82,lit) + batt(24,70);
  } else {
    lit = p !== q;
    const pt = [140,40], pb = [140,100], qt = [280,40], qb = [280,100];
    s += w(24,70,110,70,true) + dotc(110,70,true) + dotc(310,70,lit) + w(310,70,355,70,lit) + lamp(372,70,lit);
    s += w(110,70,140,p ? 40 : 100,true);
    s += w(140,40,280,100,p) + w(140,100,280,40,!p);
    s += w(310,70,280,q ? 40 : 100,lit);
    s += [pt,pb,qt,qb].map(c => dotc(c[0], c[1], false)).join('');
    s += `<text x="110" y="124" text-anchor="middle" font-size="12" fill="#8B96AD">p=${V(p)}</text><text x="310" y="124" text-anchor="middle" font-size="12" fill="#8B96AD">q=${V(q)}</text>`;
    s += w(372,87,372,138,lit) + w(372,138,24,138,lit) + w(24,138,24,82,lit) + batt(24,70);

  ] : [

    name:ALL ? 'Cuantificador universal ∀: «para todo»' : 'Cuantificador existencial ∃: «existe»', short:ALL ? '2 Para todo' : '3 Existe', shape:ALL ? '∀x, p(x)' : '∃x : p(x)',

      bar.querySelectorAll('button').forEach((b, i) => b.classList.toggle('active', i === pi)); const P = PAIRS[pi];
      const ab = P.rows.filter(r => P.fa(...r) && !P.fb(...r)), ba = P.rows.filter(r => !P.fa(...r) && P.fb(...r));
      const t = el('table', 'dt'); t.innerHTML = `<tr>${P.cols.map(c => `<th>${c}</th>`).join('')}<th class="res">A</th><th class="res">B</th><th>¿rompe A⊨B?</th><th>¿rompe B⊨A?</th></tr>` + P.rows.map(r => { const a = P.fa(...r), b = P.fb(...r), x1 = a && !b, x2 = !a && b; return `<tr class="${x1 || x2 ? 'bad' : ''}">${r.map(v => `<td>${typeof v === 'boolean' ? vtag(v) : v}</td>`).join('')}<td>${vtag(a)}</td><td>${vtag(b)}</td><td>${x1 ? '<span class="no">sí</span>' : '·'}</td><td>${x2 ? '<span class="no">sí</span>' : '·'}</td></tr>`; }).join('');
      tb.innerHTML = ''; tb.appendChild(t);
      const imp = ab.length === 0, rev = ba.length === 0;
      out.innerHTML = `A: <b>${P.A}</b> · B: <b>${P.B}</b>${P.interp ? '<br><span style="color:var(--muted)">Cada fila es una «interpretación» posible de los predicados.</span>' : ''}<br>A ⊨ B: ${vtag(imp)} ${imp ? '(no hay ningún caso con A verdadera y B falsa)' : `(contraejemplo: ${P.cols.map((c, i) => `${c}=${typeof ab[0][i] === 'boolean' ? V(ab[0][i]) : ab[0][i]}`).join(', ')})`}<br>B ⊨ A: ${vtag(rev)} ${rev ? '' : `(contraejemplo: ${P.cols.map((c, i) => `${c}=${typeof ba[0][i] === 'boolean' ? V(ba[0][i]) : ba[0][i]}`).join(', ')})`}<br><b>${imp && rev ? 'A ≡ B (equivalentes)' : (imp ? 'A ⊨ B pero NO son equivalentes' : (rev ? 'B ⊨ A pero NO son equivalentes' : 'Ninguna implica a la otra'))}</b>`;
      out.classList.toggle('win', imp && rev);
    }
    PAIRS.forEach((P, i) => bar.appendChild(chipBtn(P.n, false, () => { pi = i; upd(); })));
    stage.append(bar, out, tb);
    stage.appendChild(el('p', 'pad-note', '<b>Idea:</b> «x &gt; 4» es más exigente que «x &gt; 3»: lo que cumple lo primero cumple lo segundo, pero no al revés (x = 4). Y «∀» implica «∃», pero «∃» no implica «∀».'));
    upd();
  }
});

/* ---------- PASO 6: cuantificadores y conectores ---------- */
steps.push({
  name:'Cuantificadores y conectores: lo que sí y lo que no se puede mover', short:'6 Con conectores', shape:'∀(p ∨ q) ⊭ (∀p) ∨ (∀q)',
  desc:'¿Se puede «repartir» un cuantificador sobre ∨ y ∧? A veces sí (≡) y a veces solo en un sentido (⊨). Define p(x) y q(x) pulsando las casillas (o carga un ejemplo de la clase) y la página calcula <b>los dos lados</b> de cada relación.',
  render(stage){
    let n = 6; const p = Array(6).fill(false), q = Array(6).fill(false); const out = el('div'), grid = el('div', 'tbl-wrap'), pre = el('div', 'btn-row'), sz = el('div', 'btn-row');
    function set(fp, fq, nn){ n = nn; for(let i = 0; i < 6; i++){ p[i] = i < n && fp(i + 1); q[i] = i < n && fq(i + 1); } upd(); }
    function upd(){
      sz.querySelectorAll('button').forEach((b, i) => b.classList.toggle('active', i + 3 === n));
      const idx = rng_(0, n - 1), P = idx.map(i => p[i]), Q = idx.map(i => q[i]);
      const all = a => a.every(Boolean), some = a => a.some(Boolean), or = (a, b) => a.map((v, i) => v || b[i]), and = (a, b) => a.map((v, i) => v && b[i]);
      const t = el('table', 'dt'); t.innerHTML = `<tr><th>x</th>${idx.map(i => `<th>${i + 1}</th>`).join('')}</tr>`;
      [['p(x)', p], ['q(x)', q]].forEach(([nm, arr]) => { const tr = el('tr'); tr.appendChild(el('th', null, nm)); idx.forEach(i => { const td = el('td', 'pick', vtag(arr[i])); td.style.cursor = 'pointer'; td.addEventListener('click', () => { arr[i] = !arr[i]; upd(); }); tr.appendChild(td); }); t.appendChild(tr); });
      grid.innerHTML = ''; grid.appendChild(t);
      const REL = [
        { l:'∀x [p ∨ q]', r:'[∀x p] ∨ [∀x q]', a:all(or(P, Q)), b:all(P) || all(Q), kind:'rl', txt:'solo «lado derecho ⊨ lado izquierdo»' },
        { l:'∃x [p ∨ q]', r:'[∃x p] ∨ [∃x q]', a:some(or(P, Q)), b:some(P) || some(Q), kind:'eq', txt:'equivalentes siempre' },
        { l:'∀x [p ∧ q]', r:'[∀x p] ∧ [∀x q]', a:all(and(P, Q)), b:all(P) && all(Q), kind:'eq', txt:'equivalentes siempre' },
        { l:'∃x [p ∧ q]', r:'[∃x p] ∧ [∃x q]', a:some(and(P, Q)), b:some(P) && some(Q), kind:'lr', txt:'solo «lado izquierdo ⊨ lado derecho»' }
      ];
      out.innerHTML = REL.map(R => { const same = R.a === R.b, sym = R.kind === 'eq' ? '≡' : (R.kind === 'rl' ? '⇐' : '⇒'); return `<div class="qrow" style="margin:4px 0"><div class="tx"><b>${R.l}</b> ${vtag(R.a)} &nbsp;<b style="color:var(--viu)">${sym}</b>&nbsp; <b>${R.r}</b> ${vtag(R.b)}</div><div class="viz-label">${R.txt}</div><div class="fb">${same ? 'En este caso los dos lados coinciden.' : '<b class="ok">¡Aquí los dos lados DIFIEREN!</b> Es el caso que muestra que no son equivalentes.'}</div></div>`; }).join('');
    }
    [3, 4, 5, 6].forEach(k => sz.appendChild(chipBtn(`universo {1..${k}}`, false, () => { n = k; upd(); })));
    const PR = [['Par / impar (1..6)', () => set(x => x % 2 === 0, x => x % 2 === 1, 6)], ['Múltiplo de 2 y de 3 en {1..5}', () => set(x => x % 2 === 0, x => x % 3 === 0, 5)], ['Todos cumplen p y q', () => set(() => true, () => true, 6)]];
    PR.forEach(([nm, f]) => pre.appendChild(chipBtn(nm, false, f)));
    stage.append(el('div', 'panel-title c1', 'Ejemplos de la clase'), pre, sz, grid, out);
    stage.appendChild(el('p', 'pad-note', '<b>Par/impar:</b> «todo natural es par o impar» es verdadera, pero «todos son pares, o todos son impares» es falsa. <b>Múltiplos en {1..5}:</b> «existe un múltiplo de 2 y existe un múltiplo de 3» es verdadera, pero «existe uno que sea múltiplo de 2 y de 3» es falsa.'));
    set(x => x % 2 === 0, x => x % 2 === 1, 6);
  }
});

/* ---------- PASO 7: De Morgan generalizado ---------- */
steps.push({
  name:'Negar cuantificadores: De Morgan generalizado', short:'7 De Morgan', shape:'¬∀ ≡ ∃¬  ·  ¬∃ ≡ ∀¬',
  desc:'Negar «para todo» equivale a «existe uno que no»; negar «existe» equivale a «para todo no». Elige un predicado sobre {1,…,8}: la página calcula <b>ambos lados</b> de las cuatro leyes y te enseña el elemento clave.',
  render(stage){
    const U = rng_(1, 8); const PR = [['x es par', x => x % 2 === 0], ['x > 3', x => x > 3], ['x es primo', x => [2, 3, 5, 7].includes(x)], ['x es múltiplo de 9', x => x % 9 === 0], ['x ≥ 1', x => x >= 1]];
    let pi = 0; const bar = el('div', 'btn-row'), out = el('div'), row = el('div', 'btn-row');
    function upd(){
      bar.querySelectorAll('button').forEach((b, i) => b.classList.toggle('active', i === pi)); const f = PR[pi][1], vals = U.map(f), cx = U.find(x => !f(x)), wt = U.find(x => f(x));
      row.innerHTML = ''; U.forEach((x, i) => { const c = el('span', 'tv v' + V(vals[i]), String(x)); c.style.margin = '2px'; row.appendChild(c); });
      const L = [
        ['¬[∀x p(x)]', !vals.every(Boolean), '∃x : ¬p(x)', vals.some(v => !v), cx !== undefined ? `testigo de «no cumple»: x = ${cx}` : 'todos cumplen p'],
        ['¬[∃x : p(x)]', !vals.some(Boolean), '∀x ¬p(x)', vals.every(v => !v), wt !== undefined ? `x = ${wt} sí cumple p, así que ∃ es verdadera` : 'nadie cumple p'],
        ['∀x p(x)', vals.every(Boolean), '¬[∃x : ¬p(x)]', !vals.some(v => !v), ''],
        ['∃x : p(x)', vals.some(Boolean), '¬[∀x ¬p(x)]', !vals.every(v => !v), '']
      ];
      out.innerHTML = L.map(([a, va, b, vb, note]) => `<div class="qrow" style="margin:4px 0"><div class="tx"><b>${a}</b> ${vtag(va)} &nbsp;<b style="color:var(--viu)">≡</b>&nbsp; <b>${b}</b> ${vtag(vb)}</div>${note ? `<div class="fb">${note}</div>` : ''}</div>`).join('');
    }
    PR.forEach(([n], i) => bar.appendChild(chipBtn('p(x): ' + n, false, () => { pi = i; upd(); })));
    stage.append(bar, el('div', 'viz-label', 'Universo {1,…,8}: naranja = cumple p, rosa = no cumple'), row, out);
    stage.appendChild(el('div', 'panel-title c2', 'Simplificar una fórmula paso a paso (ejemplo de la clase)'));
    const STEPS = [['∀x, ¬[∃y : [p(x,y) → q(x)]]', 'Enunciado inicial'], ['∀x, ¬[∃y : [¬p(x,y) ∨ q(x)]]', 'p → q ≡ ¬p ∨ q'], ['∀x, ∀y, ¬[¬p(x,y) ∨ q(x)]', '¬∃ ≡ ∀¬'], ['∀x, ∀y, [¬¬p(x,y) ∧ ¬q(x)]', 'De Morgan: ¬(A ∨ B) ≡ ¬A ∧ ¬B'], ['∀x, ∀y, [p(x,y) ∧ ¬q(x)]', 'Doble negación: ¬¬p ≡ p'], ['∀x, y, [p(x,y) ∧ ¬q(x)]', 'Agrupar los ∀']];
    let k = 0; const ladder = el('div'), nx = el('button', 'toggle-btn', 'Siguiente paso →'); nx.type = 'button'; const rs = el('button', 'toggle-btn', 'Reiniciar'); rs.type = 'button';
    function drawL(){ ladder.innerHTML = STEPS.slice(0, k + 1).map(([f, w], i) => `<div class="formula" style="margin:4px auto;${i === k ? 'border-color:var(--viu)' : ''}">${f}<br><span style="color:var(--muted);font-size:12px">${w}</span></div>`).join(''); nx.disabled = k >= STEPS.length - 1; nx.style.opacity = nx.disabled ? .4 : 1; }
    nx.addEventListener('click', () => { if(k < STEPS.length - 1){ k++; drawL(); } }); rs.addEventListener('click', () => { k = 0; drawL(); });
    const nb = el('div', 'btn-row'); nb.append(nx, rs); stage.append(nb, ladder);
    stage.appendChild(el('div', 'panel-title c3', '«No es cierto que todo entero sea par y positivo»'));
    const Z = rng_(-3, 3), bad = Z.filter(x => !(x % 2 === 0 && x > 0)); const ex = el('div', 'formula');
    ex.innerHTML = `¬[∀x ∈ ℤ, (x par ∧ x positivo)] ≡ ∃x ∈ ℤ : (x impar <b>o</b> x no positivo)<br>En {−3,…,3} lo cumplen (son «testigos»): <b>${bad.join(', ')}</b>.`; stage.appendChild(ex);
    stage.appendChild(el('p', 'pad-note', 'Al negar: <b>∀ ↔ ∃</b> intercambian, y lo que hay dentro se niega (∧ pasa a ∨ por De Morgan).'));
    drawL(); upd();
  }
});

/* ---------- PASO 8: resumen ---------- */
steps.push({
  name:'Resumen y código', short:'8 Resumen', shape:null,
  desc:'En programación, ∀ y ∃ son <code>all()</code> y <code>any()</code>. Las cifras de abajo las calcula la página.',
  render(stage){
    const T = el('div', 'tbl-wrap'); T.innerHTML = `<table class="dt"><tr><th>Símbolo</th><th>Se lee</th><th>Se refuta con</th><th>Se prueba con</th></tr>
      <tr><td>∀x, p(x)</td><td>para todo x</td><td>un contraejemplo</td><td>un razonamiento general</td></tr>
      <tr><td>∃x : p(x)</td><td>existe un x</td><td>un razonamiento general</td><td>un testigo</td></tr>
      <tr><td>¬∀ ≡ ∃¬</td><td>De Morgan</td><td colspan="2">se cambian ∀ ↔ ∃ y se niega p</td></tr></table>`; stage.appendChild(T);
    stage.appendChild(el('div', 'panel-title c1', 'En Python'));
    stage.appendChild(codeBox(`U = range(1, 9)
par = lambda x: x % 2 == 0

print(all(par(x) for x in U))            # ∀x par(x)
print(any(par(x) for x in U))            # ∃x par(x)
print(not all(par(x) for x in U))        # ¬∀x par(x)
print(any(not par(x) for x in U))        # ∃x ¬par(x)  (¡igual!)

# ∀x ∃y : y > x   sobre U  (falla en el último elemento)
print(all(any(y > x for y in U) for x in U))`));
    const U = rng_(1, 8), par = x => x % 2 === 0; const py = b => b ? 'True' : 'False';
    stage.appendChild(el('div', 'viz-label', 'Salida del programa (calculada aquí con las mismas reglas):'));
    stage.appendChild(codeBox([U.every(par), U.some(par), !U.every(par), U.some(x => !par(x)), U.every(x => U.some(y => y > x))].map(py).join('\n')));
    stage.appendChild(el('div', 'panel-title c3', 'Errores frecuentes'));
    const errs = el('div', 'bio-text'); errs.innerHTML = `<p><b>1.</b> Creer que «para todo» se demuestra probando varios casos. Solo se <i>refuta</i> con casos.</p>
      <p><b>2.</b> Intercambiar ∀∃ por ∃∀: «todos tienen alguien» no es «hay alguien de todos».</p>
      <p><b>3.</b> Negar mal: ¬∀x p(x) es «existe x sin p», no «para todo x, no p».</p>
      <p><b>4.</b> Repartir ∀ sobre ∨ (o ∃ sobre ∧) como si fuera una equivalencia: solo valen en un sentido.</p>`;
    stage.appendChild(errs); stage.appendChild(qcards(QUESTIONS));
  }
});

/* =========================================================
   Motor de navegación (idéntico en todas las actividades)
========================================================= */
let current = 0;
function renderTrail(){
  const tr = $('#trail'); tr.innerHTML = '';
  steps.forEach((s, i) => { const b = el('button', null, s.short); b.type = 'button'; b.addEventListener('click', () => goTo(i)); tr.appendChild(b); });
}
function goTo(i){
  current = i;
  clearTimers();
  const s = steps[current];
  $('#stepCount').textContent = current === 0 ? 'Introducción' : `Paso ${current} de ${steps.length - 1}`;
  $('#stepTitle').textContent = s.name;
  $('#stepDesc').innerHTML = s.desc;
  const chip = $('#shapeChip');
  if(s.shape){ chip.style.display = ''; chip.innerHTML = `<b>${s.shape}</b>`; } else chip.style.display = 'none';
  const stage = $('#stage'); stage.innerHTML = '';
  s.render(stage);
  const btns = document.querySelectorAll('.trail button');
  btns.forEach((b, idx) => b.classList.toggle('active', idx === current));
  if(btns[current]) btns[current].scrollIntoView({ block:'nearest', inline:'center' });
  $('#prevBtn').disabled = current === 0;
  $('#nextBtn').textContent = current === steps.length - 1 ? 'Volver al inicio ↺' : 'Siguiente →';
  window.scrollTo(0, 0);
}
$('#prevBtn').addEventListener('click', () => { if(current > 0) goTo(current - 1); });
$('#nextBtn').addEventListener('click', () => goTo(current === steps.length - 1 ? 0 : current + 1));
document.addEventListener('keydown', e => {
  if(e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT')) return;
  if(e.key === 'ArrowRight') $('#nextBtn').click();
  if(e.key === 'ArrowLeft') $('#prevBtn').click();
});
renderTrail(); goTo(0);
</script>
